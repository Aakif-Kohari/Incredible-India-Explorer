<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brands of India: Interactive Brand Explorer | Incredible India</title>
  <meta name="description" content="Explore notable Indian-origin brands across industries. Discover their history, industry, and origins on our interactive map.">
  <link rel="stylesheet" href="../../css/vars.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <a class="back-link" href="../../index.html" title="Back to Incredible India Explorer">← India Explorer</a>
        <h1>🇮🇳 Brands of India</h1>
        <p class="subtitle">Discover the heritage and legacy of iconic Indian-origin brands that shaped the nation and the world.</p>
      </div>
    </header>

    <main class="brands-main">
      
      <!-- Filters and Search -->
      <section class="brands-controls">
        <div class="search-container">
          <input type="text" id="brand-search" placeholder="Search brands (e.g., Tata, Amul)..." aria-label="Search brands">
        </div>
        
        <div class="filter-container">
          <select id="industry-filter" aria-label="Filter by Industry">
            <option value="all">All Industries</option>
            <option value="Conglomerate">Conglomerate</option>
            <option value="Food & Beverages">Food & Beverages</option>
            <option value="Automotive">Automotive</option>
            <option value="Technology">Technology</option>
            <option value="FMCG">FMCG</option>
            <option value="Media & Entertainment">Media & Entertainment</option>
          </select>
          
          <select id="year-filter" aria-label="Filter by Founding Era">
            <option value="all">All Eras</option>
            <option value="pre-1900">Pre-1900</option>
            <option value="1900-1947">1900 - 1947</option>
            <option value="1948-2000">1948 - 2000</option>
            <option value="post-2000">Post 2000</option>
          </select>
        </div>
      </section>

      <!-- Map & Grid Layout -->
      <section class="brands-layout">
        <!-- Map Sidebar -->
        <aside class="brands-map-container" id="map-container">
          <!-- The SVG Map will be dynamically loaded/drawn here or referenced. For simplicity, we will use a simplified India Map SVG shape -->
          <h2>Origin Map</h2>
          <p class="map-hint">Click a state to filter brands.</p>
          <div id="india-map-wrapper">
             <!-- SVG path inserted via JS -->
          </div>
          <button id="reset-map-btn" class="brands-btn" style="display:none; margin-top:1rem;">Reset Map Filter</button>
        </aside>

        <!-- Brand Cards Grid -->
        <div class="brands-grid-container">
          <div id="brands-grid" class="brands-grid">
            <!-- Cards will be populated by JS -->
          </div>
          <div id="no-results" class="no-results hidden">
            <p>No brands found matching your criteria.</p>
          </div>
        </div>
      </section>

      <!-- Brand Timeline -->
      <section class="brands-timeline-section">
        <h2>Legacy Timeline</h2>
        <div class="brands-timeline" id="brands-timeline">
          <!-- Timeline items populated by JS -->
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <p>Part of the <strong>Incredible India Explorer</strong> project.</p>
    </footer>
  </div>

  <!-- Shared Map Data Utility -->
  <script src="../../dist/map-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
