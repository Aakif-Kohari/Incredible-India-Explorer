<!-- Interactive TCS Timeline -->
<section class="section">

  <div class="timeline-heading">
    <h2>India-to-Global Expansion Timeline</h2>
    <p>
      Trace TCS's journey from a domestic pioneer to a multinational IT titan.
    </p>
  </div>

  <!-- Timeline Selector Buttons -->
  <div class="timeline-selector">

    <button class="timeline-button active" data-index="0">
      <span class="period">1968</span>
      <span class="title">TCS Founded</span>
    </button>

    <button class="timeline-button" data-index="1">
      <span class="period">1970s</span>
      <span class="title">International Expansion</span>
    </button>

    <button class="timeline-button" data-index="2">
      <span class="period">1990s</span>
      <span class="title">Global Growth</span>
    </button>

    <button class="timeline-button" data-index="3">
      <span class="period">2004</span>
      <span class="title">Public Listing</span>
    </button>

    <button class="timeline-button" data-index="4">
      <span class="period">2010s</span>
      <span class="title">Digital Transformation</span>
    </button>

    <button class="timeline-button" data-index="5">
      <span class="period">2020s</span>
      <span class="title">AI & Innovation</span>
    </button>

  </div>


  <!-- Active Timeline Content -->
  <div class="timeline-display">

    <span class="phase-label">
      Phase Era: <span id="activePeriod">1968</span>
    </span>

    <h3 id="activeTitle">
      TCS Founded
    </h3>

    <p id="activeDescription">
      TCS began as a division of Tata Sons in India.
    </p>

  </div>

</section>
