<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sweet Tooth Explorer | Incredible India Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <!-- Header -->
    <header class="module-header">
        <a href="../../index.html" class="back-link" aria-label="Back to home">&larr; Back to Home</a>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">🌙</button>
    </header>

    <main class="sweets-container">
        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">The Sweet Tooth Explorer</h1>
            <p class="hero-subtitle">
                Discover iconic Indian desserts across regions and festivals. Filter by category to find your favorite treats!
            </p>
            
            <!-- Filter Controls -->
            <div class="filters-container" role="group" aria-label="Filter sweets by category">
                <button class="filter-btn active" data-filter="all" aria-pressed="true">All Sweets</button>
                <button class="filter-btn" data-filter="milk" aria-pressed="false">Milk-Based</button>
                <button class="filter-btn" data-filter="flour" aria-pressed="false">Flour-Based</button>
                <button class="filter-btn" data-filter="festival" aria-pressed="false">Festival Specials</button>
            </div>
        </section>

        <!-- CSS Grid Layout -->
        <section class="sweets-grid" id="sweets-grid" aria-live="polite">
            <!-- Sweet cards injected via JS -->
        </section>
        
        <div class="empty-state hidden" id="empty-state">
            <p>No sweets found for this category.</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
