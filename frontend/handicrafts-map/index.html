<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handicrafts & Weaves | Incredible India Explorer</title>
    <!-- Global Styles -->
    <link rel="stylesheet" href="../../style.css">
    <!-- Local Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar global-nav">
            <div class="logo">Incredible India</div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">🌙</button></li>
            </ul>
        </nav>

        <main class="handicrafts-module">
            <!-- Hero Section -->
            <section class="hero-section">
                <div class="hero-content">
                    <h1>Handicrafts & Weaves of India</h1>
                    <p class="subtitle">Explore India’s rich textile, pottery, painting, and handcrafted traditions through an interactive cultural directory.</p>
                </div>
            </section>

            <!-- Filters Section -->
            <section class="filter-section">
                <div class="filter-container">
                    <span class="filter-label">Filter by Category:</span>
                    <div class="filter-buttons" id="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All Crafts</button>
                        <button class="filter-btn" data-filter="Textiles">Textiles</button>
                        <button class="filter-btn" data-filter="Pottery">Pottery</button>
                        <button class="filter-btn" data-filter="Paintings">Paintings</button>
                        <button class="filter-btn" data-filter="Woodcraft">Woodcraft</button>
                        <button class="filter-btn" data-filter="Metalwork">Metalwork</button>
                    </div>
                </div>
            </section>

            <!-- Main Interactive Container -->
            <section class="directory-container">
                
                <!-- Alphabetical Index Sidebar -->
                <aside class="alphabet-sidebar">
                    <nav class="alphabet-nav" aria-label="Alphabetical Index" id="alphabet-nav">
                        <!-- Injected via JS -->
                    </nav>
                </aside>

                <!-- Craft Gallery -->
                <div class="craft-gallery" id="craft-gallery">
                    <!-- Injected via JS -->
                </div>

            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Incredible India Explorer. All rights reserved.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
