<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Indian Rivers Map | Incredible India Explorer</title>
    <meta name="description" content="Explore the major rivers of India including Ganga, Yamuna, Godavari, and more on an interactive SVG map.">
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../../pages-common.css">
    
    <!-- Feature Specific Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="game-header">
        <div class="header-container">
            <a href="../../index.html" class="back-link">← Back to Explorer</a>
            <h1>🌊 Interactive Indian Rivers Map</h1>
            <p class="subtitle">Discover the lifelines of Incredible India</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="river-container">
        
        <!-- Workspace: SVG Map & Info Panel -->
        <section class="river-workspace" aria-label="Interactive Indian Rivers Map Workspace">
            
            <!-- SVG Map -->
            <div class="river-map-wrapper">
                <svg id="indian-rivers-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of India with major rivers">
                    
                    <!-- Base India Outline -->
                    <path class="india-base" d="M 220 60 Q 380 40 460 70 Q 550 50 680 140 Q 750 200 700 320 Q 640 450 520 540 Q 420 580 340 500 Q 250 420 180 300 Q 140 200 220 60 Z" />

                    <!-- River Paths injected by script.js -->
                    <g id="river-paths-group"></g>
                </svg>
                
                <div class="map-instruction">
                    <span class="icon">👆</span> Select a river on the map to view details.
                </div>
            </div>

            <!-- River Info Panel -->
            <div class="river-info-panel">
                <div class="info-card default-state" id="river-info-card" aria-live="polite">
                    <div class="empty-state-content">
                        <div class="empty-icon">🗺️</div>
                        <h3>Select a River</h3>
                        <p>Click on any river on the map to learn about its origin, length, states covered, and ecological significance.</p>
                    </div>
                </div>
            </div>

        </section>
        
    </main>

    <!-- Scripts -->
    <script src="../../pages-common.js"></script>
    <script src="script.js"></script>
</body>
</html>
