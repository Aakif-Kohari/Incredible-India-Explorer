<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Lacing, Tensioning and Strap Assembly">
  <defs>
    <linearGradient id="bgLace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a120e"/>
      <stop offset="100%" stop-color="#140705"/>
    </linearGradient>
    <linearGradient id="woodDhol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c471c"/>
      <stop offset="50%" stop-color="#5a2c0f"/>
      <stop offset="100%" stop-color="#3c1a07"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9d3d"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e0b23d"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="20" fill="url(#bgLace)"/>

  <!-- Dhol with Full Zigzag Rope & Tuning Rings -->
  <g transform="translate(100, 110)">
    <!-- Shell -->
    <path d="M 40 30 Q 220 0 400 30 L 400 170 Q 220 200 40 170 Z" fill="url(#woodDhol)" stroke="#e0b23d" stroke-width="2"/>
    
    <!-- Left Bass Rim & Head -->
    <ellipse cx="40" cy="100" rx="22" ry="70" fill="#d9ba96" stroke="#b08456" stroke-width="6"/>
    <ellipse cx="40" cy="100" rx="12" ry="38" fill="#381b10" opacity="0.8"/>

    <!-- Right Treble Rim & Head -->
    <ellipse cx="400" cy="100" rx="20" ry="70" fill="#fff8ed" stroke="#b08456" stroke-width="6"/>

    <!-- Criss-cross Zig-Zag Rope Lacing -->
    <g stroke="#f3ecd8" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 40 35 L 400 50 L 40 68 L 400 85 L 40 102 L 400 118 L 40 135 L 400 152 L 40 168"/>
      <path d="M 40 35 L 400 70 L 40 102 L 400 135 L 40 168"/>
      <path d="M 40 50 L 400 35 L 40 85 L 400 68 L 40 118 L 400 102 L 40 152 L 400 135 L 40 168"/>
    </g>

    <!-- Metal Tuning Rings (Kadiyan) on the ropes -->
    <g fill="#e0b23d" stroke="#fff" stroke-width="1">
      <circle cx="210" cy="58" r="7"/>
      <circle cx="235" cy="92" r="7"/>
      <circle cx="195" cy="126" r="7"/>
      <circle cx="225" cy="148" r="7"/>
    </g>

    <!-- Shoulder Strap (Gati / Pattah) -->
    <path d="M 60 30 C 120 -60, 320 -60, 380 30" fill="none" stroke="url(#strapGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 60 30 C 120 -60, 320 -60, 380 30" fill="none" stroke="#2a120e" stroke-width="2" stroke-dasharray="8 6"/>
  </g>

  <!-- Labels -->
  <rect x="180" y="330" width="280" height="36" rx="18" fill="rgba(255,107,53,0.15)" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="320" y="354" fill="#fbf1e7" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" text-anchor="middle">ZIG-ZAG LACING &amp; TUNING RINGS</text>
</svg>
