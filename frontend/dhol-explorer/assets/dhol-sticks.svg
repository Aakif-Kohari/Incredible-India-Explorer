<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Dagga and Tilli - Dhol Playing Sticks">
  <defs>
    <linearGradient id="bgSticks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a120e"/>
      <stop offset="100%" stop-color="#140705"/>
    </linearGradient>
    <linearGradient id="daggaWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c47a3e"/>
      <stop offset="50%" stop-color="#8a481c"/>
      <stop offset="100%" stop-color="#542407"/>
    </linearGradient>
    <linearGradient id="tilliCane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="20" fill="url(#bgSticks)"/>

  <!-- Dagga (Thick Curved Stick) -->
  <g transform="translate(100, 70)">
    <!-- Shadow -->
    <path d="M 40 180 Q 180 80 380 90 Q 420 70 410 40 Q 390 10 360 40 Q 380 60 360 70 Q 180 60 40 160 Z" fill="#000" opacity="0.3" transform="translate(10, 15)"/>
    <!-- Curved Stick Body -->
    <path d="M 40 180 Q 180 80 380 90 Q 430 70 420 30 Q 390 0 350 40 Q 380 60 350 70 Q 180 60 40 160 Z" fill="url(#daggaWood)" stroke="#e0b23d" stroke-width="1.5"/>
    <!-- Grip wrapping -->
    <rect x="50" y="155" width="60" height="20" rx="4" fill="#a83232" opacity="0.85" transform="rotate(-30 50 155)"/>
    
    <text x="380" y="20" fill="#ff9d3d" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">DAGGA (Bass Stick)</text>
    <text x="380" y="42" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="13">Thick, curved hardwood for deep bass</text>
  </g>

  <!-- Tilli (Thin Flexible Cane Stick) -->
  <g transform="translate(100, 240)">
    <!-- Shadow -->
    <path d="M 40 110 Q 240 45 440 25" stroke="#000" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.3" transform="translate(8, 10)"/>
    <!-- Flexible Cane -->
    <path d="M 40 110 Q 240 45 440 25" stroke="url(#tilliCane)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Grip -->
    <path d="M 40 110 L 100 95" stroke="#ff9d3d" stroke-width="10" stroke-linecap="round"/>

    <text x="380" y="80" fill="#e0b23d" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">TILLI (Treble Stick)</text>
    <text x="380" y="102" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="13">Thin, flexible cane/bamboo for crisp slap beats</text>
  </g>
</svg>
