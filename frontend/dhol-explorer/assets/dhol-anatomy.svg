<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Anatomy of a Dhol Drum">
  <defs>
    <linearGradient id="bgAnatomy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f0c08"/>
      <stop offset="100%" stop-color="#100504"/>
    </linearGradient>
    <linearGradient id="woodAnat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0522d"/>
      <stop offset="45%" stop-color="#653014"/>
      <stop offset="100%" stop-color="#3d1908"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="20" fill="url(#bgAnatomy)"/>

  <!-- Dhol Shell Illustration -->
  <g transform="translate(130, 120)">
    <!-- Shell -->
    <path d="M 40 25 Q 190 -5 340 25 L 340 165 Q 190 195 40 165 Z" fill="url(#woodAnat)" stroke="#e0b23d" stroke-width="2"/>

    <!-- Left Bass Head -->
    <ellipse cx="40" cy="95" rx="20" ry="70" fill="#d9ba96" stroke="#8a5a2e" stroke-width="5"/>
    <ellipse cx="40" cy="95" rx="10" ry="35" fill="#301509" opacity="0.8"/>

    <!-- Right Treble Head -->
    <ellipse cx="340" cy="95" rx="18" ry="70" fill="#fff5ea" stroke="#8a5a2e" stroke-width="5"/>

    <!-- Lacing -->
    <g stroke="#fdf0d5" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M 40 30 L 340 50 L 40 70 L 340 90 L 40 110 L 340 130 L 40 150 L 340 160"/>
      <path d="M 40 45 L 340 30 L 40 85 L 340 70 L 40 125 L 340 110 L 40 160 L 340 145"/>
    </g>

    <!-- Tuning Rings -->
    <circle cx="180" cy="50" r="6" fill="#e0b23d" stroke="#fff" stroke-width="1"/>
    <circle cx="210" cy="90" r="6" fill="#e0b23d" stroke="#fff" stroke-width="1"/>
    <circle cx="170" cy="130" r="6" fill="#e0b23d" stroke="#fff" stroke-width="1"/>

    <!-- Shoulder Strap -->
    <path d="M 50 25 C 110 -50, 270 -50, 330 25" fill="none" stroke="#ff9d3d" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Anatomy Callouts & Labels -->
  <!-- 1. Bass Head -->
  <g>
    <line x1="160" y1="215" x2="80" y2="280" stroke="#ff9d3d" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="80" cy="280" r="4" fill="#ff9d3d"/>
    <text x="80" y="305" fill="#ff9d3d" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Bass Head (Nar)</text>
    <text x="80" y="325" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="12">Thick goat skin + paste</text>
  </g>

  <!-- 2. Treble Head -->
  <g>
    <line x1="475" y1="215" x2="540" y2="280" stroke="#e0b23d" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="540" cy="280" r="4" fill="#e0b23d"/>
    <text x="540" y="305" fill="#e0b23d" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" text-anchor="end">Treble Head (Madeen)</text>
    <text x="540" y="325" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="12" text-anchor="end">Thin resonant membrane</text>
  </g>

  <!-- 3. Shell (Dhor) -->
  <g>
    <line x1="320" y1="260" x2="320" y2="330" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="320" cy="330" r="4" fill="#ff6b35"/>
    <text x="320" y="355" fill="#fbf1e7" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Wooden Shell (Dhor)</text>
    <text x="320" y="375" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="12" text-anchor="middle">Solid carved Sheesham / Mango</text>
  </g>

  <!-- 4. Shoulder Strap -->
  <g>
    <line x1="320" y1="75" x2="320" y2="35" stroke="#ff9d3d" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="320" cy="35" r="4" fill="#ff9d3d"/>
    <text x="320" y="25" fill="#ff9d3d" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Shoulder Strap (Gati)</text>
  </g>
</svg>
