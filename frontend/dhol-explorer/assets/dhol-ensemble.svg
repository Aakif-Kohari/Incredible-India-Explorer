<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Dhol-Tasha Ensemble Street Procession">
  <defs>
    <linearGradient id="bgEnsemble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1510"/>
      <stop offset="60%" stop-color="#1c0a07"/>
      <stop offset="100%" stop-color="#0f0403"/>
    </linearGradient>
    <radialGradient id="festiveGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff9d3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" rx="20" fill="url(#bgEnsemble)"/>
  <circle cx="320" cy="180" r="200" fill="url(#festiveGlow)"/>

  <!-- Confetti / Festive particles -->
  <g fill="#e0b23d" opacity="0.65">
    <circle cx="120" cy="80" r="4"/>
    <circle cx="160" cy="50" r="3"/>
    <circle cx="280" cy="70" r="5"/>
    <circle cx="480" cy="60" r="4"/>
    <circle cx="530" cy="95" r="3"/>
    <rect x="200" y="40" width="8" height="4" fill="#ff6b35" transform="rotate(25 200 40)"/>
    <rect x="420" y="45" width="8" height="4" fill="#ff9d3d" transform="rotate(-30 420 45)"/>
  </g>

  <!-- Dhol Player Silhouette Left -->
  <g transform="translate(130, 110)">
    <!-- Turban / Head -->
    <circle cx="50" cy="40" r="18" fill="#ff6b35"/>
    <ellipse cx="50" cy="35" rx="24" ry="12" fill="#ff9d3d"/>
    <!-- Body -->
    <path d="M 30 65 L 70 65 L 85 160 L 15 160 Z" fill="#e0b23d" opacity="0.9"/>
    <!-- Dhol Slung -->
    <g transform="translate(30, 90) rotate(15)">
      <ellipse cx="40" cy="25" rx="45" ry="24" fill="#7a3614" stroke="#e0b23d" stroke-width="2"/>
      <ellipse cx="-5" cy="25" rx="10" ry="24" fill="#d9ba96"/>
      <ellipse cx="85" cy="25" rx="10" ry="24" fill="#fff5ea"/>
    </g>
    <!-- Raised Arm with Dagga -->
    <path d="M 65 75 Q 95 30 110 20" stroke="#ff9d3d" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 110 20 Q 125 10 120 0" stroke="#c47a3e" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Dhol Player Silhouette Right -->
  <g transform="translate(350, 110)">
    <!-- Turban / Head -->
    <circle cx="50" cy="40" r="18" fill="#ff9d3d"/>
    <ellipse cx="50" cy="35" rx="24" ry="12" fill="#ff6b35"/>
    <!-- Body -->
    <path d="M 30 65 L 70 65 L 85 160 L 15 160 Z" fill="#e0b23d" opacity="0.9"/>
    <!-- Dhol Slung -->
    <g transform="translate(30, 90) rotate(-15)">
      <ellipse cx="40" cy="25" rx="45" ry="24" fill="#7a3614" stroke="#e0b23d" stroke-width="2"/>
      <ellipse cx="-5" cy="25" rx="10" ry="24" fill="#fff5ea"/>
      <ellipse cx="85" cy="25" rx="10" ry="24" fill="#d9ba96"/>
    </g>
    <!-- Raised Arm with Tilli -->
    <path d="M 35 75 Q 5 30 -10 20" stroke="#ff9d3d" stroke-width="8" stroke-linecap="round" fill="none"/>
    <line x1="-10" y1="20" x2="-25" y2="0" stroke="#f5e1a4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tasha Drum Center-Front -->
  <g transform="translate(260, 210)">
    <ellipse cx="60" cy="40" rx="42" ry="18" fill="#d9ba96" stroke="#c08829" stroke-width="3"/>
    <path d="M 18 40 Q 60 85 102 40 Z" fill="#8c3d18" stroke="#c08829" stroke-width="2"/>
    <!-- Drumsticks -->
    <line x1="20" y1="0" x2="50" y2="35" stroke="#f5e1a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="0" x2="70" y2="35" stroke="#f5e1a4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Caption / Title Overlay -->
  <rect x="150" y="340" width="340" height="42" rx="21" fill="rgba(38,16,13,0.85)" stroke="#e0b23d" stroke-width="1.5"/>
  <text x="320" y="367" fill="#fbf1e7" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">DHOL-TASHA ENSEMBLE</text>
</svg>
