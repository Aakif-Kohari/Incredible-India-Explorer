<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Shaping the Dhol Shell from Seasoned Wood">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a120e"/>
      <stop offset="100%" stop-color="#140705"/>
    </linearGradient>
    <linearGradient id="woodLog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3582b"/>
      <stop offset="50%" stop-color="#6e3717"/>
      <stop offset="100%" stop-color="#4a220d"/>
    </linearGradient>
    <linearGradient id="innerHollow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#210d07"/>
      <stop offset="100%" stop-color="#3d1b10"/>
    </linearGradient>
    <linearGradient id="metalTool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="640" height="420" rx="20" fill="url(#bg)"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="320" cy="210" r="160" fill="#ff9d3d" opacity="0.08"/>

  <!-- Wood Shavings on floor -->
  <g fill="#c97d42" opacity="0.6">
    <ellipse cx="200" cy="340" rx="18" ry="4" transform="rotate(-15 200 340)"/>
    <ellipse cx="230" cy="355" rx="14" ry="3" transform="rotate(25 230 355)"/>
    <ellipse cx="380" cy="345" rx="20" ry="5" transform="rotate(10 380 345)"/>
    <ellipse cx="430" cy="335" rx="16" ry="4" transform="rotate(-30 430 335)"/>
    <ellipse cx="310" cy="360" rx="25" ry="6" transform="rotate(5 310 360)"/>
  </g>

  <!-- Dhol Barrel Shell (Cross-section and 3D perspective) -->
  <g transform="translate(140, 100)">
    <!-- Outer Shell Body -->
    <path d="M 40 40 Q 180 10 320 40 L 320 180 Q 180 210 40 180 Z" fill="url(#woodLog)" stroke="#e0b23d" stroke-width="2"/>
    
    <!-- Left Opening (Hollow rim) -->
    <ellipse cx="40" cy="110" rx="24" ry="70" fill="url(#innerHollow)" stroke="#ff9d3d" stroke-width="3"/>
    
    <!-- Wood grain details -->
    <path d="M 64 60 Q 180 35 296 60" fill="none" stroke="#d9823f" stroke-width="2" opacity="0.4"/>
    <path d="M 64 110 Q 180 85 296 110" fill="none" stroke="#d9823f" stroke-width="2" opacity="0.4"/>
    <path d="M 64 160 Q 180 135 296 160" fill="none" stroke="#d9823f" stroke-width="2" opacity="0.4"/>

    <!-- Right Rim -->
    <ellipse cx="320" cy="110" rx="22" ry="70" fill="#542610" stroke="#e0b23d" stroke-width="3"/>
    <ellipse cx="320" cy="110" rx="15" ry="58" fill="url(#innerHollow)"/>
  </g>

  <!-- Carving Chisel / Gouge Tool -->
  <g transform="translate(420, 180) rotate(-35)">
    <!-- Steel blade -->
    <polygon points="0,0 20,-10 90,-10 90,10 20,10" fill="url(#metalTool)" stroke="#ffffff" stroke-width="1"/>
    <!-- Ferrule -->
    <rect x="90" y="-12" width="12" height="24" fill="#c0a060" rx="2"/>
    <!-- Wooden handle -->
    <path d="M 102 -10 L 190 -16 Q 210 0 190 16 L 102 10 Z" fill="#9e4c1e" stroke="#542610" stroke-width="1.5"/>
  </g>

  <!-- Badge / Text label -->
  <rect x="180" y="30" width="280" height="38" rx="19" fill="rgba(255,157,61,0.12)" stroke="#ff9d3d" stroke-width="1.5"/>
  <text x="320" y="55" fill="#fbf1e7" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">SEASONED WOODEN SHELL</text>
</svg>
