<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Preparing Dhol Heads and Mounting on Gojra Rings">
  <defs>
    <linearGradient id="bgHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a120e"/>
      <stop offset="100%" stop-color="#140705"/>
    </linearGradient>
    <radialGradient id="bassSkin" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fdf4e7"/>
      <stop offset="70%" stop-color="#d9ba96"/>
      <stop offset="100%" stop-color="#a47d52"/>
    </radialGradient>
    <radialGradient id="trebleSkin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="75%" stop-color="#ecd5be"/>
      <stop offset="100%" stop-color="#be9d78"/>
    </radialGradient>
    <linearGradient id="bambooRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2bf7d"/>
      <stop offset="100%" stop-color="#8c6a2e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="20" fill="url(#bgHead)"/>
  <circle cx="320" cy="210" r="160" fill="#e0b23d" opacity="0.07"/>

  <!-- Bass Head (Nar - Thicker Skin) -->
  <g transform="translate(80, 80)">
    <!-- Outer Bamboo/Metal Gojra Ring -->
    <circle cx="110" cy="110" r="95" fill="none" stroke="url(#bambooRing)" stroke-width="14"/>
    <circle cx="110" cy="110" r="88" fill="url(#bassSkin)" stroke="#7a4e28" stroke-width="2"/>
    <!-- Central Dhol Masala / Tuning paste circle -->
    <circle cx="110" cy="110" r="38" fill="#381b10" opacity="0.75" stroke="#210d06" stroke-width="1.5"/>
    <text x="110" y="235" fill="#ff9d3d" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" text-anchor="middle">BASS HEAD (NAR)</text>
    <text x="110" y="255" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle">Thicker hide with loaded paste</text>
  </g>

  <!-- Treble Head (Madeen - Thinner Skin) -->
  <g transform="translate(360, 80)">
    <!-- Outer Bamboo/Metal Gojra Ring -->
    <circle cx="110" cy="110" r="85" fill="none" stroke="url(#bambooRing)" stroke-width="12"/>
    <circle cx="110" cy="110" r="79" fill="url(#trebleSkin)" stroke="#7a4e28" stroke-width="2"/>
    <!-- Edge lacing holes / stitches -->
    <circle cx="110" cy="110" r="70" fill="none" stroke="#a47d52" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="110" y="235" fill="#e0b23d" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" text-anchor="middle">TREBLE HEAD (MADEEN)</text>
    <text x="110" y="255" fill="#d9b8a8" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle">Thinner resonant goat skin</text>
  </g>

  <!-- Heading / Badge -->
  <rect x="170" y="25" width="300" height="38" rx="19" fill="rgba(224,178,61,0.12)" stroke="#e0b23d" stroke-width="1.5"/>
  <text x="320" y="50" fill="#fbf1e7" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">GOAT SKIN HEADS &amp; GOJRA RINGS</text>
</svg>
