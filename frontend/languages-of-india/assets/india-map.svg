<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" id="india-map-svg">
  <!-- Stylized Representation of India Map with Interactive Language Regions -->
  <style>
    .region {
      fill: #dbe4e4;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .region:hover, .region:focus {
      fill: #4b8d94;
      outline: none;
    }
    .region.active {
      fill: #005a66;
    }
    .region-label {
      pointer-events: none; 
      font-family: sans-serif; 
      font-size: 13px; 
      font-weight: bold; 
      fill: #333;
    }
    /* Dark theme colors overriden in CSS */
  </style>

  <g id="map-regions">
    <!-- North Region (Hindi Belt roughly) -->
    <path id="hindi" class="region" aria-label="Hindi language region" tabindex="0" 
          d="M 280,50 L 350,20 L 420,80 L 450,150 L 520,250 L 600,300 L 550,380 L 450,400 L 300,350 L 220,250 L 280,180 Z" />
    
    <!-- Punjab (Punjabi) -->
    <path id="punjabi" class="region" aria-label="Punjabi language region" tabindex="0" 
          d="M 220,250 L 280,180 L 250,120 L 180,180 Z" />
    
    <!-- West (Gujarati) -->
    <path id="gujarati" class="region" aria-label="Gujarati language region" tabindex="0" 
          d="M 130,400 L 250,420 L 280,500 L 180,550 L 50,480 Z" />
    
    <!-- Central-West (Marathi) -->
    <path id="marathi" class="region" aria-label="Marathi language region" tabindex="0" 
          d="M 180,550 L 280,500 L 400,450 L 420,520 L 380,550 L 400,650 L 250,700 L 160,650 Z" />
    
    <!-- East (Bengali) -->
    <path id="bengali" class="region" aria-label="Bengali language region" tabindex="0" 
          d="M 550,380 L 600,350 L 650,420 L 600,550 L 550,450 Z" />
          
    <!-- East-Coast (Odia) -->
    <path id="odia" class="region" aria-label="Odia language region" tabindex="0" 
          d="M 450,400 L 550,450 L 520,530 L 450,530 Z" />
    
    <!-- South-Central (Telugu) -->
    <path id="telugu" class="region" aria-label="Telugu language region" tabindex="0" 
          d="M 400,450 L 450,530 L 520,530 L 480,680 L 350,680 Z" />
    
    <!-- South-West (Kannada) -->
    <path id="kannada" class="region" aria-label="Kannada language region" tabindex="0" 
          d="M 250,700 L 350,680 L 380,780 L 300,850 L 220,780 Z" />
    
    <!-- Deep South-East (Tamil) -->
    <path id="tamil" class="region" aria-label="Tamil language region" tabindex="0" 
          d="M 380,780 L 480,680 L 430,850 L 360,920 L 330,900 Z" />
          
    <!-- Deep South-West (Malayalam) -->
    <path id="malayalam" class="region" aria-label="Malayalam language region" tabindex="0" 
          d="M 300,850 L 380,780 L 330,900 L 290,880 Z" />
  </g>
  
  <g id="region-labels">
    <text class="region-label" x="350" y="250">Hindi</text>
    <text class="region-label" x="180" y="210">Punjabi</text>
    <text class="region-label" x="130" y="470">Gujarati</text>
    <text class="region-label" x="250" y="580">Marathi</text>
    <text class="region-label" x="580" y="450">Bengali</text>
    <text class="region-label" x="470" y="480">Odia</text>
    <text class="region-label" x="420" y="600">Telugu</text>
    <text class="region-label" x="270" y="750">Kannada</text>
    <text class="region-label" x="390" y="800">Tamil</text>
    <text class="region-label" x="300" y="880" font-size="11px">Malayalam</text>
  </g>
</svg>
