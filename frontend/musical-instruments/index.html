<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classical Indian Music Instruments | Incredible India Explorer</title>
    <meta name="description" content="Explore traditional Indian classical music instruments including the Sitar, Tabla, Veena, and Flute.">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <script>
        (function() {
            let theme = 'dark'; try { theme = JSON.parse(localStorage.getItem('iie_storage') || '{}').theme || 'dark'; } catch(e) {}
            if (theme === 'light') {
                const s = document.createElement('style');
                s.textContent = 'body { transition: none !important; }';
                document.head.appendChild(s);
                document.body.classList.add('light-theme');
                requestAnimationFrame(() => requestAnimationFrame(() => s.remove()));
            }
        })();
    </script>
    
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="../../index.html#home" class="nav-logo" id="nav-logo">
                <span class="saffron">Incredible</span>
                <span class="gold">India</span>
                <span class="green">Explorer</span>
            </a>
            <nav class="nav-menu" id="nav-menu">
                <a href="../../index.html#home" class="nav-link">Home</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 100px;">
        <div class="instrument-header">
            <h1 class="instrument-title-main">Classical Indian Music Instruments</h1>
            <p class="instrument-description-main">Explore the rich tradition of Indian classical music through its distinctive instruments.</p>
        </div>

        <section class="instrument-grid" id="instrument-grid" aria-label="Musical Instruments">
            <!-- Cards will be dynamically inserted here -->
        </section>
    </main>

    <!-- Modal for details -->
    <div id="instrument-modal" class="instrument-modal" role="dialog" aria-modal="true" aria-labelledby="modal-instrument-name" style="display: none;">
        <div class="instrument-modal-content glass-card">
            <button id="instrument-close" class="instrument-close" aria-label="Close details">×</button>
            <div class="instrument-modal-layout">
                <div class="instrument-modal-image-container">
                    <img id="modal-instrument-image" class="instrument-modal-image" src="" alt="">
                </div>
                <div class="instrument-modal-details">
                    <span id="modal-instrument-category" class="instrument-category-badge"></span>
                    <h2 id="modal-instrument-name" class="instrument-modal-title"></h2>
                    
                    <div class="instrument-section">
                        <h3>Historical Context</h3>
                        <p id="modal-instrument-history"></p>
                    </div>

                    <div class="instrument-section">
                        <h3>How It Is Played</h3>
                        <p id="modal-instrument-playstyle"></p>
                    </div>

                    <div class="instrument-section">
                        <h3>Audio Demonstration</h3>
                        <audio id="modal-instrument-audio" class="instrument-audio" controls preload="none">
                            <source src="" type="audio/mpeg">
                            Your browser does not support HTML5 audio.
                        </audio>
                    </div>

                    <div class="instrument-section instrument-credit-section">
                        <p id="modal-instrument-credit" class="instrument-credit"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Incredible India Explorer. Created with Vanilla HTML, CSS & JavaScript.</p>
        </div>
    </footer>

    <script src="../../frontend/js-modules/storage.js" defer></script>
    <script src="../../frontend/app.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
