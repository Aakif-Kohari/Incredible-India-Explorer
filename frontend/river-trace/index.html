<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Trace Explorer | Incredible India Explorer</title>
  <meta name="description" content="Trace India's major river systems from source to mouth on an interactive SVG map. Measure accuracy percentage and discover key ecological and geographical facts.">
  <link rel="stylesheet" href="../pages-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="game-header">
    <div class="header-container">
      <a href="../../index.html" class="back-link">← Back to Explorer</a>
      <h1>🌊 River Trace Challenge</h1>
      <p class="subtitle">Trace India's sacred river courses from origin glacier/plateau to the sea!</p>
    </div>
  </header>

  <main class="game-container">
    <!-- River Selection Tabs -->
    <section class="river-selector-section" aria-label="River System Selector">
      <div class="river-tabs" role="tablist" id="river-tabs-container">
        <button class="river-tab-btn active" data-river="ganga" role="tab" aria-selected="true">🌊 Ganga</button>
        <button class="river-tab-btn" data-river="yamuna" role="tab" aria-selected="false">💧 Yamuna</button>
        <button class="river-tab-btn" data-river="godavari" role="tab" aria-selected="false">🌿 Godavari</button>
        <button class="river-tab-btn" data-river="krishna" role="tab" aria-selected="false">🏞️ Krishna</button>
        <button class="river-tab-btn" data-river="brahmaputra" role="tab" aria-selected="false">🏔️ Brahmaputra</button>
      </div>
    </section>

    <!-- Main Workspace: SVG Canvas & Instructions -->
    <section class="workspace" aria-label="River Tracing Map Workspace">
      <div class="map-container-card">
        <div class="map-header">
          <div class="target-title-box">
            <h2 id="current-river-title">River Ganga</h2>
            <p id="current-river-subtitle">From Gangotri Glacier (Uttarakhand) to Bay of Bengal</p>
          </div>
          <div class="trace-stats-box">
            <span class="stat-badge">Waypoints: <strong id="waypoint-count">0 / 5</strong></span>
            <span class="stat-badge">Accuracy: <strong id="accuracy-score">0%</strong></span>
          </div>
        </div>

        <!-- SVG Map Container -->
        <div class="svg-map-wrapper" id="map-wrapper">
          <svg id="river-map-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interactive River Map Canvas">
            <!-- Background Map Outline -->
            <path class="india-map-bg" d="M 220 60 Q 380 40 460 70 Q 550 50 680 140 Q 750 200 700 320 Q 640 450 520 540 Q 420 580 340 500 Q 250 420 180 300 Q 140 200 220 60 Z" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

            <!-- Actual River Guide Path (Hidden initially or semi-transparent guide) -->
            <path id="actual-river-path" class="river-actual-path" d="" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" stroke-dasharray="4,4" />

            <!-- Source Marker -->
            <g id="source-marker" transform="translate(0,0)" class="marker-group hidden">
              <circle r="14" fill="rgba(34, 197, 94, 0.3)" />
              <circle r="7" fill="#22c55e" />
              <text y="-18" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold">📍 Source (Start)</text>
            </g>

            <!-- Mouth Marker -->
            <g id="mouth-marker" transform="translate(0,0)" class="marker-group hidden">
              <circle r="14" fill="rgba(239, 68, 68, 0.3)" />
              <circle r="7" fill="#ef4444" />
              <text y="24" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">🌊 Mouth (Sea)</text>
            </g>

            <!-- User Traced Polyline -->
            <polyline id="user-trace-polyline" points="" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Interactive Click Target Overlay -->
            <rect id="map-click-overlay" width="800" height="600" fill="transparent" style="cursor: crosshair;" />
          </svg>
        </div>

        <div class="controls-footer">
          <button id="btn-clear-trace" class="action-btn secondary-btn">🔄 Clear My Tracing</button>
          <button id="btn-submit-trace" class="action-btn primary-btn">✨ Check Accuracy</button>
        </div>
      </div>
    </section>

    <!-- River Fact Sheet / Completion Card -->
    <section class="fact-sheet-section" id="fact-sheet-container" aria-live="polite">
      <!-- Dynamic Info Card Rendered on Completion -->
    </section>
  </main>

  <script src="../pages-common.js"></script>
  <script src="script.js"></script>
</body>
</html>
