<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Architecture Styles Guide - Incredible India</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <a href="../../index.html" class="logo">
                    <img src="../../assets/icons/mandala.svg" alt="Incredible India Explorer Logo">
                    <span>Incredible India</span>
                </a>
                <div class="nav-links">
                    <a href="../../index.html" class="nav-item">Home</a>
                    <a href="#" class="nav-item">Destinations</a>
                    <a href="#" class="nav-item active">Culture</a>
                    <a href="#" class="nav-item">Nature</a>
                </div>
                <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-toggle-btn">
                    <span class="moon-icon">🌙</span>
                    <span class="sun-icon">☀️</span>
                </button>
                <button class="hamburger-menu" aria-label="Open menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            
            <!-- Mobile Menu -->
            <div class="mobile-menu" aria-hidden="true">
                <a href="../../index.html" class="nav-item">Home</a>
                <a href="#" class="nav-item">Destinations</a>
                <a href="#" class="nav-item active">Culture</a>
                <a href="#" class="nav-item">Nature</a>
            </div>
        </nav>
    </header>

    <main class="arch-container">
        <!-- Sidebar Navigation for Architecture Styles -->
        <aside class="arch-sidebar" aria-label="Architecture Styles">
            <h1 class="arch-sidebar-title">Architecture Styles</h1>
            <div class="arch-style-list" role="tablist" aria-orientation="vertical" id="arch-style-list">
                <!-- Buttons will be injected here via JS -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <section class="arch-content" aria-live="polite" id="arch-content" role="region" aria-label="Selected Architecture Details">
            <header class="arch-content-header">
                <h2 class="arch-content-title" id="arch-title">Select a Style</h2>
                <div class="arch-meta">
                    <span class="arch-region" id="arch-region"></span>
                    <span class="arch-period" id="arch-period"></span>
                </div>
            </header>
            
            <div class="arch-content-body">
                <p class="arch-content-description" id="arch-description">
                    Please select an architectural style from the sidebar to explore its details.
                </p>
                
                <div class="arch-feature-grid">
                    <div class="arch-feature-card">
                        <h3>Key Features</h3>
                        <ul id="arch-features" class="arch-list">
                            <!-- Features injected here -->
                        </ul>
                    </div>
                    <div class="arch-feature-card">
                        <h3>Notable Examples</h3>
                        <ul id="arch-examples" class="arch-list">
                            <!-- Examples injected here -->
                        </ul>
                    </div>
                </div>
                
                <div class="arch-visual-section">
                    <figure class="arch-image-container">
                        <img id="arch-image" class="arch-image" src="" alt="Architecture style visual example" loading="lazy">
                        <figcaption class="arch-image-credit" id="arch-credit"></figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Incredible India Explorer. Open Source Project.</p>
        </div>
    </footer>

    <script src="../../app.js"></script>
    <script src="script.js"></script>
</body>
</html>
