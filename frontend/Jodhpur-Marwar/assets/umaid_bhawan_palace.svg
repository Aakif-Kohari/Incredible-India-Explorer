<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umaid Bhawan Palace, Jodhpur">
  <defs>
    <linearGradient id="skyp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="70%" stop-color="#2e6090"/>
      <stop offset="100%" stop-color="#4a8ab0"/>
    </linearGradient>
    <linearGradient id="sandstone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b870"/>
      <stop offset="100%" stop-color="#c49040"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8a30"/>
      <stop offset="100%" stop-color="#2a5a18"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="480" fill="url(#skyp)"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="30" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="500" cy="45" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="680" cy="35" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="750" cy="70" r="1.5" fill="#fff" opacity="0.8"/>
  <!-- Moon -->
  <circle cx="120" cy="80" r="35" fill="#f0e8c0" opacity="0.9"/>
  <circle cx="135" cy="70" r="28" fill="#2e6090"/>
  <!-- Lawn -->
  <rect x="0" y="370" width="800" height="110" fill="url(#grass)"/>
  <!-- Pathway -->
  <rect x="340" y="370" width="120" height="110" fill="#c8a870" opacity="0.7"/>
  <!-- Main palace building — central dome section -->
  <rect x="240" y="180" width="320" height="200" fill="url(#sandstone)"/>
  <!-- Central dome (Art Deco) -->
  <ellipse cx="400" cy="180" rx="80" ry="30" fill="#e8b870"/>
  <path d="M320 180 Q400 80 480 180 Z" fill="url(#sandstone)"/>
  <ellipse cx="400" cy="78" rx="22" ry="12" fill="#d4952a"/>
  <line x1="400" y1="78" x2="400" y2="45" stroke="#c4851a" stroke-width="4"/>
  <circle cx="400" cy="42" r="9" fill="#d4af37"/>
  <!-- Dome drum with windows -->
  <rect x="365" y="142" width="70" height="40" rx="3" fill="#d4a050"/>
  <rect x="373" y="148" width="18" height="26" rx="3" fill="#ffeebb" opacity="0.8"/>
  <rect x="409" y="148" width="18" height="26" rx="3" fill="#ffeebb" opacity="0.8"/>
  <!-- Left wing -->
  <rect x="90" y="230" width="155" height="150" fill="url(#sandstone)"/>
  <rect x="88" y="220" width="159" height="14" rx="2" fill="#d4a050"/>
  <!-- Right wing -->
  <rect x="555" y="230" width="155" height="150" fill="url(#sandstone)"/>
  <rect x="553" y="220" width="159" height="14" rx="2" fill="#d4a050"/>
  <!-- Left wing corner tower -->
  <rect x="62" y="195" width="50" height="185" fill="#dea858"/>
  <rect x="60" y="185" width="54" height="14" rx="2" fill="#c4952a"/>
  <ellipse cx="87" cy="184" rx="16" ry="9" fill="#d4af37"/>
  <!-- Right wing corner tower -->
  <rect x="688" y="195" width="50" height="185" fill="#dea858"/>
  <rect x="686" y="185" width="54" height="14" rx="2" fill="#c4952a"/>
  <ellipse cx="713" cy="184" rx="16" ry="9" fill="#d4af37"/>
  <!-- Sub-domes on wings -->
  <ellipse cx="168" cy="228" rx="35" ry="13" fill="#e8b870"/>
  <path d="M133 228 Q168 185 203 228 Z" fill="url(#sandstone)"/>
  <ellipse cx="168" cy="184" rx="10" ry="6" fill="#d4952a"/>
  <ellipse cx="632" cy="228" rx="35" ry="13" fill="#e8b870"/>
  <path d="M597 228 Q632 185 667 228 Z" fill="url(#sandstone)"/>
  <ellipse cx="632" cy="184" rx="10" ry="6" fill="#d4952a"/>
  <!-- Main facade columns and arches -->
  <rect x="258" y="240" width="284" height="140" rx="2" fill="#e0ae60"/>
  <!-- Arched colonnade -->
  <rect x="270" y="258" width="38" height="80" rx="4" fill="#c49040" opacity="0.7"/>
  <path d="M270 258 Q289 238 308 258 Z" fill="#c8a848" opacity="0.8"/>
  <rect x="318" y="258" width="38" height="80" rx="4" fill="#c49040" opacity="0.7"/>
  <path d="M318 258 Q337 238 356 258 Z" fill="#c8a848" opacity="0.8"/>
  <rect x="444" y="258" width="38" height="80" rx="4" fill="#c49040" opacity="0.7"/>
  <path d="M444 258 Q463 238 482 258 Z" fill="#c8a848" opacity="0.8"/>
  <rect x="492" y="258" width="38" height="80" rx="4" fill="#c49040" opacity="0.7"/>
  <path d="M492 258 Q511 238 530 258 Z" fill="#c8a848" opacity="0.8"/>
  <!-- Central entrance -->
  <rect x="362" y="298" width="76" height="82" rx="3" fill="#8b4010"/>
  <path d="M362 298 Q400 262 438 298 Z" fill="#8b4010"/>
  <!-- Wing windows -->
  <rect x="100" y="255" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="140" y="255" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="100" y="308" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="140" y="308" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="632" y="255" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="672" y="255" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="632" y="308" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <rect x="672" y="308" width="28" height="36" rx="3" fill="#ffeebb" opacity="0.75"/>
  <!-- Tall cypress trees flanking -->
  <rect x="28" y="280" width="16" height="90" rx="4" fill="#3a5a18"/>
  <ellipse cx="36" cy="268" rx="22" ry="55" fill="#2a4a10"/>
  <rect x="756" y="280" width="16" height="90" rx="4" fill="#3a5a18"/>
  <ellipse cx="764" cy="268" rx="22" ry="55" fill="#2a4a10"/>
  <!-- Caption -->
  <rect x="175" y="448" width="450" height="24" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f5d97a">Umaid Bhawan Palace — Built 1929–1943, Jodhpur</text>
</svg>
