<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marwar School of Miniature Painting">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#e8d2a0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b2020"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b2020"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" fill="#2c1a08"/>
  <!-- Decorative outer border -->
  <rect x="20" y="20" width="760" height="440" rx="6" fill="url(#borderGrad)" opacity="0.8"/>
  <!-- Painting border frame -->
  <rect x="30" y="30" width="740" height="420" rx="4" fill="#1a0a04"/>
  <!-- Painting inner border ornament -->
  <rect x="40" y="40" width="720" height="400" rx="3" fill="#8b2020" opacity="0.6"/>
  <!-- Painting surface -->
  <rect x="55" y="55" width="690" height="370" rx="2" fill="url(#parchment)"/>
  <!-- Sky in painting -->
  <rect x="55" y="55" width="690" height="160" rx="2" fill="#c8e0f5"/>
  <!-- Palace/haveli in painting -->
  <rect x="160" y="130" width="480" height="200" fill="#e8c870"/>
  <rect x="158" y="120" width="484" height="16" fill="#d4a840"/>
  <!-- Palace arches -->
  <rect x="175" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M175 148 Q195 130 215 148 Z" fill="#f5f0e0"/>
  <rect x="228" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M228 148 Q248 130 268 148 Z" fill="#f5f0e0"/>
  <rect x="281" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M281 148 Q301 130 321 148 Z" fill="#f5f0e0"/>
  <rect x="334" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M334 148 Q354 130 374 148 Z" fill="#f5f0e0"/>
  <rect x="387" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M387 148 Q407 130 427 148 Z" fill="#f5f0e0"/>
  <rect x="440" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M440 148 Q460 130 480 148 Z" fill="#f5f0e0"/>
  <rect x="493" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M493 148 Q513 130 533 148 Z" fill="#f5f0e0"/>
  <rect x="546" y="148" width="40" height="65" rx="3" fill="#f5f0e0"/>
  <path d="M546 148 Q566 130 586 148 Z" fill="#f5f0e0"/>
  <!-- Central doorway -->
  <rect x="360" y="190" width="80" height="140" rx="4" fill="#a03018"/>
  <path d="M360 190 Q400 158 440 190 Z" fill="#a03018"/>
  <!-- Chhatris on palace roof -->
  <ellipse cx="200" cy="118" rx="16" ry="9" fill="#e0a030"/>
  <ellipse cx="300" cy="118" rx="16" ry="9" fill="#e0a030"/>
  <ellipse cx="400" cy="118" rx="16" ry="9" fill="#e0a030"/>
  <ellipse cx="500" cy="118" rx="16" ry="9" fill="#e0a030"/>
  <ellipse cx="600" cy="118" rx="16" ry="9" fill="#e0a030"/>
  <!-- Trees (painting style) -->
  <rect x="95" y="215" width="14" height="115" fill="#4a3010"/>
  <circle cx="102" cy="200" r="35" fill="#2a6018"/>
  <circle cx="88" cy="218" r="25" fill="#3a7020"/>
  <circle cx="116" cy="220" r="22" fill="#2a6018"/>
  <rect x="670" y="225" width="14" height="105" fill="#4a3010"/>
  <circle cx="677" cy="210" r="35" fill="#2a6018"/>
  <circle cx="663" cy="228" r="25" fill="#3a7020"/>
  <!-- Elephant in foreground (miniature style) -->
  <ellipse cx="200" cy="358" rx="65" ry="40" fill="#6a5040"/>
  <rect x="155" y="335" width="90" height="50" rx="10" fill="#7a6050"/>
  <!-- Elephant head -->
  <circle cx="240" cy="330" r="32" fill="#7a6050"/>
  <ellipse cx="268" cy="345" rx="8" ry="28" fill="#6a5040"/>
  <!-- Elephant caparison (decorative cloth) -->
  <rect x="158" y="318" width="86" height="22" rx="4" fill="#c82020" opacity="0.9"/>
  <rect x="164" y="318" width="74" height="6" fill="#d4af37" opacity="0.9"/>
  <!-- Rider -->
  <circle cx="215" cy="298" r="16" fill="#d4905a"/>
  <rect x="205" y="314" width="20" height="28" rx="3" fill="#b03010"/>
  <!-- Turban -->
  <ellipse cx="215" cy="286" rx="16" ry="8" fill="#d4af37"/>
  <!-- Peacock -->
  <circle cx="560" cy="340" r="16" fill="#2a8060"/>
  <rect x="553" y="356" width="14" height="30" rx="3" fill="#2a8060"/>
  <!-- Peacock tail (fan) -->
  <path d="M560 330 Q530 290 510 310" stroke="#3ab080" stroke-width="3" fill="none"/>
  <path d="M560 330 Q540 280 560 265" stroke="#2a7050" stroke-width="3" fill="none"/>
  <path d="M560 330 Q580 285 600 300" stroke="#3ab080" stroke-width="3" fill="none"/>
  <path d="M560 330 Q590 295 605 320" stroke="#2a7050" stroke-width="3" fill="none"/>
  <!-- Border decorative motifs -->
  <circle cx="55" cy="55" r="8" fill="#d4af37"/>
  <circle cx="745" cy="55" r="8" fill="#d4af37"/>
  <circle cx="55" cy="425" r="8" fill="#d4af37"/>
  <circle cx="745" cy="425" r="8" fill="#d4af37"/>
  <!-- Caption -->
  <rect x="180" y="395" width="440" height="24" rx="4" fill="rgba(140,60,0,0.6)"/>
  <text x="400" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f5d78e">Marwar School of Miniature Painting — 17th–19th Century</text>
</svg>
