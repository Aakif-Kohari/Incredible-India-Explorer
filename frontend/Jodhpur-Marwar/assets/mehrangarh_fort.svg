  <ellipse cx="348" cy="70" rx="14" ry="8" fill="#e09040"/>
  <ellipse cx="452" cy="70" rx="14" ry="8" fill="#e09040"/>
  <ellipse cx="400" cy="46" rx="14" ry="8" fill="#e09040"/>
