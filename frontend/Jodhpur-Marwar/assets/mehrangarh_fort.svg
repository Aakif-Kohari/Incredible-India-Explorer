  <!-- Wall battlements row -->
  <rect x="100" y="205" width="600" height="20" fill="#c07030"/>
  <g fill="#b06020">
    <rect x="108" y="185" width="24" height="23" rx="3"/>
    <rect x="144" y="185" width="24" height="23" rx="3"/>
    <rect x="180" y="185" width="24" height="23" rx="3"/>
