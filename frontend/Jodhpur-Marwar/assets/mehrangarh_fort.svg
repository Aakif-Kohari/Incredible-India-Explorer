  <rect x="162" y="172" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <rect x="136" y="215" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <rect x="162" y="215" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <!-- Right tower windows -->
  <rect x="616" y="172" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <rect x="642" y="172" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <rect x="616" y="215" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <rect x="642" y="215" width="20" height="28" rx="3" fill="#1a0a02" opacity="0.8"/>
  <!-- Gatehouse windows -->
  <rect x="335" y="130" width="28" height="36" rx="4" fill="#1a0a02" opacity="0.8"/>
  <rect x="437" y="130" width="28" height="36" rx="4" fill="#1a0a02" opacity="0.8"/>
  <rect x="335" y="185" width="28" height="36" rx="4" fill="#1a0a02" opacity="0.8"/>
  <rect x="437" y="185" width="28" height="36" rx="4" fill="#1a0a02" opacity="0.8"/>
  <!-- Caption -->
  <rect x="220" y="448" width="360" height="26" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#f5d97a">Mehrangarh Fort — Jodhpur, Rajasthan</text>
