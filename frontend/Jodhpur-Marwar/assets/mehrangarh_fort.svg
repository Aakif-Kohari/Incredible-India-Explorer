  <rect x="353" y="48" width="20" height="27" rx="3" fill="#b06020"/>
  <rect x="383" y="48" width="20" height="27" rx="3" fill="#b06020"/>
  <rect x="413" y="48" width="20" height="27" rx="3" fill="#b06020"/>
