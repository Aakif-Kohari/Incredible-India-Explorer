<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mehrangarh Fort, Jodhpur">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8e"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a1a"/>
      <stop offset="100%" stop-color="#2e1a08"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4843a"/>
      <stop offset="100%" stop-color="#8b4c1a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e09040"/>
      <stop offset="100%" stop-color="#9a5520"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="150" cy="20" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="220" cy="55" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="340" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="490" cy="18" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="580" cy="45" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="680" cy="25" r="1.5" fill="#fff" opacity="0.8"/>
