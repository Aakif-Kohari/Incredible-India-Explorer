<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manganiyar musicians of Marwar">
  <defs>
    <linearGradient id="skym" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#1a1a4a"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Night sky -->
  <rect width="800" height="480" fill="url(#skym)"/>
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="120" cy="15" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="180" cy="45" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="20" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="400" cy="10" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="520" cy="35" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="640" cy="18" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="730" cy="42" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="760" cy="8" r="1.5" fill="#fff" opacity="0.9"/>
  <!-- Full moon -->
  <circle cx="700" cy="70" r="45" fill="#f0e8a8" opacity="0.9"/>
  <!-- Desert ground -->
  <path d="M0 380 Q200 355 400 370 Q600 355 800 365 L800 480 L0 480 Z" fill="#6a4520"/>
  <rect x="0" y="400" width="800" height="80" fill="#7a5530"/>
  <!-- Sand dune textures -->
  <path d="M0 390 Q150 370 300 385 Q450 370 600 385 Q700 375 800 378" stroke="#8a6540" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Fire / campfire -->
  <ellipse cx="400" cy="380" rx="60" ry="15" fill="#ff6600" opacity="0.4"/>
  <circle cx="400" cy="365" r="50" fill="url(#fireGlow)"/>
  <!-- Fire flames -->
  <path d="M390 380 Q395 355 400 342 Q405 355 410 380 Z" fill="#ffcc33" opacity="0.9"/>
  <path d="M382 378 Q390 360 393 348 Q400 363 402 375 Z" fill="#ff8800" opacity="0.8"/>
  <path d="M408 378 Q412 362 415 350 Q420 364 418 376 Z" fill="#ff8800" opacity="0.8"/>
  <path d="M385 380 Q388 368 385 358 Q395 368 392 378 Z" fill="#ffaa00" opacity="0.7"/>
  <!-- Fire log base -->
  <ellipse cx="400" cy="382" rx="38" ry="10" fill="#4a2a10"/>
  <!-- Musician 1 — playing Sarangi (left) -->
  <!-- Body -->
  <ellipse cx="200" cy="360" rx="30" ry="40" fill="#c87030"/>
  <rect x="175" y="330" width="50" height="55" rx="8" fill="#a03020"/>
  <!-- Head -->
  <circle cx="200" cy="315" r="22" fill="#d4905a"/>
  <!-- Turban -->
  <ellipse cx="200" cy="297" rx="26" ry="11" fill="#e84040"/>
  <rect x="174" y="291" width="52" height="10" rx="3" fill="#e84040"/>
  <!-- Sarangi instrument -->
  <rect x="218" y="295" width="18" height="55" rx="4" fill="#c8a028"/>
  <rect x="222" y="300" width="10" height="40" rx="2" fill="#8a6010"/>
  <line x1="225" y1="300" x2="225" y2="340" stroke="#f0e0a0" stroke-width="1.5"/>
  <line x1="229" y1="300" x2="229" y2="340" stroke="#f0e0a0" stroke-width="1.5"/>
  <rect x="215" y="292" width="24" height="8" rx="2" fill="#a08020"/>
  <!-- Musician 1 arm playing -->
  <path d="M215 330 Q240 310 250 295" stroke="#d4905a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Musician 2 — playing Dholak (centre-left) -->
  <ellipse cx="310" cy="360" rx="28" ry="38" fill="#a84028"/>
  <rect x="286" y="332" width="48" height="50" rx="8" fill="#903020"/>
  <circle cx="310" cy="318" r="20" fill="#d4905a"/>
  <ellipse cx="310" cy="301" rx="24" ry="10" fill="#d4af37"/>
  <!-- Dholak drum -->
  <ellipse cx="335" cy="348" rx="24" ry="16" fill="#8b4010"/>
  <rect x="311" y="340" width="48" height="16" rx="4" fill="#a05018"/>
  <ellipse cx="311" cy="348" rx="8" ry="16" fill="#c06020"/>
  <ellipse cx="359" cy="348" rx="8" ry="16" fill="#c06020"/>
  <!-- Musician 2 arms -->
  <path d="M305 338 Q320 328 335 340" stroke="#d4905a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Musician 3 — singing (centre) -->
  <ellipse cx="400" cy="355" rx="26" ry="36" fill="#304090"/>
  <rect x="378" y="328" width="44" height="48" rx="8" fill="#2a3880"/>
  <circle cx="400" cy="315" r="21" fill="#c87848"/>
  <ellipse cx="400" cy="297" rx="24" ry="10" fill="#e06840"/>
  <!-- Open mouth singing -->
  <path d="M392 320 Q400 328 408 320" stroke="#8b2020" stroke-width="2.5" fill="#d44040" stroke-linecap="round"/>
  <!-- Gesture hand (raised) -->
  <circle cx="422" cy="295" r="10" fill="#c87848"/>
  <path d="M400 325 Q420 305 425 290" stroke="#c87848" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Musician 4 — playing Khartal (right-centre) -->
  <ellipse cx="490" cy="360" rx="28" ry="38" fill="#206040"/>
  <rect x="466" y="332" width="48" height="50" rx="8" fill="#185030"/>
  <circle cx="490" cy="318" r="20" fill="#d4905a"/>
  <ellipse cx="490" cy="301" rx="24" ry="10" fill="#28a060"/>
  <!-- Khartal (wooden clappers) -->
  <rect x="510" y="300" width="8" height="35" rx="3" fill="#8b5020"/>
  <rect x="520" y="295" width="8" height="35" rx="3" fill="#8b5020"/>
  <path d="M486 330 Q508 312 520 298" stroke="#d4905a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Musician 5 — playing Morchang (right) -->
  <ellipse cx="600" cy="360" rx="28" ry="38" fill="#802040"/>
  <rect x="576" y="332" width="48" height="50" rx="8" fill="#701030"/>
  <circle cx="600" cy="318" r="20" fill="#d4905a"/>
  <ellipse cx="600" cy="301" rx="24" ry="10" fill="#d4af37"/>
  <!-- Morchang / jew's harp held to mouth -->
  <path d="M600 322 Q618 318 625 308" stroke="#c8a828" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="627" cy="306" r="6" fill="#d4af37"/>
  <!-- Musical notes floating -->
  <text x="150" y="200" font-size="28" fill="#d4af37" opacity="0.7" font-family="serif">♪</text>
  <text x="260" y="170" font-size="22" fill="#d4af37" opacity="0.6" font-family="serif">♫</text>
  <text x="370" y="155" font-size="30" fill="#d4af37" opacity="0.75" font-family="serif">♩</text>
  <text x="500" y="175" font-size="24" fill="#d4af37" opacity="0.65" font-family="serif">♪</text>
  <text x="610" y="195" font-size="26" fill="#d4af37" opacity="0.7" font-family="serif">♫</text>
  <!-- Fort silhouette in background -->
  <path d="M0 250 Q100 220 200 235 Q300 210 400 220 Q500 210 600 232 Q700 218 800 240 L800 300 Q600 280 400 285 Q200 280 0 300 Z" fill="#1a0a02" opacity="0.6"/>
  <!-- Caption -->
  <rect x="175" y="448" width="450" height="24" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f5d97a">Manganiyar Musicians — Living Folk Heritage of Marwar</text>
</svg>
