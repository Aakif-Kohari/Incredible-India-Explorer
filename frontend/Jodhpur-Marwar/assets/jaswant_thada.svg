<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jaswant Thada cenotaph, Jodhpur">
  <defs>
    <linearGradient id="skyt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="40%" stop-color="#ffc266"/>
      <stop offset="100%" stop-color="#ffe9b0"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefaf0"/>
      <stop offset="100%" stop-color="#e8d5a0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0cfe8"/>
      <stop offset="100%" stop-color="#6a9fc0"/>
    </linearGradient>
  </defs>
  <!-- Sunset sky -->
  <rect width="800" height="480" fill="url(#skyt)"/>
  <!-- Sun setting -->
  <circle cx="660" cy="200" r="55" fill="#ffcc33" opacity="0.85"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="120" rx="90" ry="28" fill="#ffb347" opacity="0.5"/>
  <ellipse cx="140" cy="130" rx="60" ry="22" fill="#ffb347" opacity="0.4"/>
  <ellipse cx="500" cy="95" rx="110" ry="30" fill="#ff9944" opacity="0.45"/>
  <!-- Reflecting pool -->
  <ellipse cx="400" cy="430" rx="340" ry="40" fill="url(#water)" opacity="0.75"/>
  <!-- Reflection of structure (blurred) -->
  <rect x="295" y="410" width="210" height="60" rx="4" fill="#e8c870" opacity="0.3"/>
  <!-- Lawn / base platform -->
  <rect x="0" y="380" width="800" height="100" fill="#7a9a40"/>
  <rect x="150" y="368" width="500" height="18" rx="3" fill="#6a8a30"/>
  <!-- Main cenotaph structure -->
  <!-- Base plinth -->
  <rect x="230" y="310" width="340" height="70" rx="4" fill="url(#marble)"/>
  <rect x="225" y="304" width="350" height="12" rx="2" fill="#f0e0a0"/>
  <!-- Second level -->
  <rect x="260" y="240" width="280" height="75" rx="4" fill="url(#marble)"/>
  <rect x="256" y="234" width="288" height="11" rx="2" fill="#f0e0a0"/>
  <!-- Central chamber -->
  <rect x="310" y="155" width="180" height="90" rx="4" fill="url(#marble)"/>
  <!-- Arched windows on chamber -->
  <rect x="320" y="168" width="35" height="50" rx="4" fill="#d4b860" opacity="0.6"/>
  <rect x="373" y="168" width="35" height="50" rx="4" fill="#d4b860" opacity="0.6"/>
  <rect x="445" y="168" width="35" height="50" rx="4" fill="#d4b860" opacity="0.6"/>
  <!-- Central dome -->
  <ellipse cx="400" cy="155" rx="55" ry="22" fill="#fefaf0"/>
  <path d="M345 155 Q400 95 455 155 Z" fill="url(#marble)"/>
  <ellipse cx="400" cy="93" rx="14" ry="8" fill="#f0e0a0"/>
  <line x1="400" y1="93" x2="400" y2="68" stroke="#c8a828" stroke-width="3"/>
  <circle cx="400" cy="65" r="7" fill="#d4af37"/>
  <!-- Corner chhatris (left) -->
  <rect x="260" y="195" width="30" height="50" rx="2" fill="url(#marble)"/>
  <path d="M260 195 Q275 170 290 195 Z" fill="#f0e0a0"/>
  <ellipse cx="275" cy="168" rx="9" ry="5" fill="#f0e0a0"/>
  <!-- Corner chhatris (right) -->
  <rect x="510" y="195" width="30" height="50" rx="2" fill="url(#marble)"/>
  <path d="M510 195 Q525 170 540 195 Z" fill="#f0e0a0"/>
  <ellipse cx="525" cy="168" rx="9" ry="5" fill="#f0e0a0"/>
  <!-- Side chhatris on second level -->
  <rect x="278" y="222" width="22" height="20" rx="2" fill="url(#marble)"/>
  <path d="M278 222 Q289 208 300 222 Z" fill="#f0e0a0"/>
  <rect x="500" y="222" width="22" height="20" rx="2" fill="url(#marble)"/>
  <path d="M500 222 Q511 208 522 222 Z" fill="#f0e0a0"/>
  <!-- Intricate jali lattice on chamber -->
  <rect x="310" y="310" width="180" height="4" fill="#d4af37" opacity="0.7"/>
  <rect x="310" y="240" width="280" height="4" fill="#d4af37" opacity="0.7"/>
  <!-- Cypress trees -->
  <rect x="188" y="320" width="14" height="60" rx="3" fill="#4a7028"/>
  <ellipse cx="195" cy="318" rx="18" ry="40" fill="#3a6020"/>
  <rect x="598" y="320" width="14" height="60" rx="3" fill="#4a7028"/>
  <ellipse cx="605" cy="318" rx="18" ry="40" fill="#3a6020"/>
  <!-- Amber glow from sun hitting marble -->
  <rect x="310" y="155" width="180" height="90" rx="4" fill="#ffcc66" opacity="0.15"/>
  <!-- Caption -->
  <rect x="190" y="448" width="420" height="24" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fff8dc">Jaswant Thada — White Marble Cenotaph, Jodhpur</text>
</svg>
