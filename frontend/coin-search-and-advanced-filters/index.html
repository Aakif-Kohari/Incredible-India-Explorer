<!doctype html>
<html lang="en">
    <head>
        <script>
            (function () {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'light') {
                    document.body.classList.add('light-theme');
                }
            })();
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Coin Search and Advanced Filters — Real-time search system to explore Indian coins by ruler, dynasty, historical period, region, metal, script, symbol, and coin type."
        />
        <title>Coin Search & Advanced Filters | Incredible India</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../../styles.css" />
        <link rel="stylesheet" href="coin-search.css" />
    </head>
    <body class="search-main">
        <header class="navbar scrolled" id="navbar">
            <div class="nav-container">
                <a href="../../index.html#home" class="nav-logo" id="nav-logo">
                    <span class="saffron">Incredible</span>
                    <span class="gold">India</span>
                    <span class="green">Explorer</span>
                </a>
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu" aria-expanded="false">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <nav class="nav-menu" id="nav-menu">
                    <a href="../../index.html#home" class="nav-link">Home</a>
                    <a href="../coin/coin.html" class="nav-link">Currency History</a>
                    <a href="index.html" class="nav-link active" style="color: var(--saffron)">Coin Search</a>
                    <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle Dark/Light Mode" title="Toggle Light Mode">
                        ☀️
                    </button>
                </nav>
            </div>
        </header>

        <main>
            <section class="search-hero">
                <div class="section-container">
                    <span class="hero-pill">🔍 Numismatic Database</span>
                    <h1>Coin Search & Advanced Filters</h1>
                    <p class="hero-subtitle">
                        Filter Indian coins in real-time by keyword, ruler/dynasty, metal, historical period, region, script, and emblem symbol.
                    </p>
                </div>
            </section>

            <section class="search-controls-section">
                <div class="section-container">
                    <div class="search-bar-box">
                        <input type="text" id="search-input" placeholder="🔍 Search by coin name, ruler, script, or symbol... (e.g. Gupta, Gold, Devanagari)" />
                        <button id="btn-reset" class="btn-reset">Clear Filters</button>
                    </div>

                    <div class="filters-grid">
                        <div class="filter-group">
                            <label for="filter-metal">Metal:</label>
                            <select id="filter-metal">
                                <option value="all">All Metals</option>
                                <option value="Gold">Gold</option>
                                <option value="Silver">Silver</option>
                                <option value="Copper">Copper</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-period">Historical Period:</label>
                            <select id="filter-period">
                                <option value="all">All Periods</option>
                                <option value="Ancient">Ancient</option>
                                <option value="Medieval">Medieval</option>
                                <option value="Early Modern">Early Modern</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-region">Region:</label>
                            <select id="filter-region">
                                <option value="all">All Regions</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Bihar">Bihar</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-script">Script:</label>
                            <select id="filter-script">
                                <option value="all">All Scripts</option>
                                <option value="Devanagari">Devanagari</option>
                                <option value="Persian">Persian</option>
                                <option value="Brahmi">Brahmi</option>
                                <option value="Tamil">Tamil</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <section class="results-section">
                <div class="section-container">
                    <div id="results-count" class="results-count">Showing 0 coins</div>
                    <div class="results-grid" id="results-grid"></div>
                </div>
            </section>
        </main>

        <script src="coin-search-data.js"></script>
        <script src="coin-search.js"></script>
    </body>
</html>
