<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNESCO Heritage Sites | Incredible India Explorer</title>
    <!-- Include global styles -->
    <link rel="stylesheet" href="../../css/style.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="navbar global-nav">
            <div class="logo">Incredible India</div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">🌙</button></li>
            </ul>
        </nav>

        <main class="unesco-module">
            <!-- Hero Section -->
            <section class="hero-section">
                <div class="hero-content">
                    <h1>UNESCO Heritage Sites of India</h1>
                    <p class="subtitle">Explore India's globally recognized cultural, natural, and mixed heritage treasures.</p>
                </div>
                
                <!-- Statistics Section -->
                <div class="stats-section" aria-label="UNESCO Site Statistics">
                    <div class="stat-card">
                        <span class="stat-number" id="stat-total">0</span>
                        <span class="stat-label">Total Sites</span>
                    </div>
                    <div class="stat-card stat-cultural">
                        <span class="stat-number" id="stat-cultural">0</span>
                        <span class="stat-label">Cultural</span>
                    </div>
                    <div class="stat-card stat-natural">
                        <span class="stat-number" id="stat-natural">0</span>
                        <span class="stat-label">Natural</span>
                    </div>
                    <div class="stat-card stat-mixed">
                        <span class="stat-number" id="stat-mixed">0</span>
                        <span class="stat-label">Mixed</span>
                    </div>
                </div>
            </section>

            <!-- Sorting & Controls -->
            <section class="controls-section" aria-label="Filtering and Sorting controls">
                <div class="controls-container">
                    <div class="control-group">
                        <label for="search-input">Search Sites</label>
                        <input type="text" id="search-input" placeholder="Search by name or state...">
                    </div>
                    
                    <div class="control-group">
                        <label for="type-filter">Category</label>
                        <select id="type-filter">
                            <option value="all">All Types</option>
                            <option value="cultural">Cultural</option>
                            <option value="natural">Natural</option>
                            <option value="mixed">Mixed</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="sort-select">Sort By</label>
                        <select id="sort-select">
                            <option value="oldest">Year Added (Oldest First)</option>
                            <option value="newest">Year Added (Newest First)</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Main Grid -->
            <section class="grid-section" aria-label="UNESCO Sites Grid">
                <div class="unesco-grid" id="unesco-grid" aria-live="polite">
                    <!-- Cards injected via JS -->
                </div>
                
                <div id="no-results" class="no-results" style="display: none;">
                    <p>No UNESCO sites match your search criteria.</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Incredible India Explorer. All rights reserved.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="../../js/app.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
