<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO Heritage Sites of India</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-content">
      <h1>UNESCO Heritage Sites of India</h1>
      <p class="subtitle">Explore India’s UNESCO-recognized cultural and natural treasures.</p>
      <div class="stats-badge">43 World Heritage Sites</div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <!-- Sorting Controls -->
    <section class="controls" aria-label="Sorting Controls">
      <div class="sort-group">
        <label for="sort-select">Sort By</label>
        <select id="sort-select" class="sort-select">
          <option value="year-asc">Year Added (Oldest to Newest)</option>
          <option value="year-desc">Year Added (Newest to Oldest)</option>
          <option value="name-asc">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
          <option value="type">Type (Cultural, Natural, Mixed)</option>
        </select>
      </div>
    </section>

    <!-- Site Grid -->
    <section id="unesco-grid" class="unesco-grid" aria-live="polite">
      <!-- Site cards will be dynamically injected here -->
    </section>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
