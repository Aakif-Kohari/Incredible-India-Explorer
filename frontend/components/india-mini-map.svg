<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" class="quick-nav-svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Regions of India: Abstracted for quick navigation -->
  <g stroke="#ffffff" stroke-width="0.5" filter="url(#shadow)">
    <!-- North India -->
    <path id="nav-north" class="nav-region" data-target="north" d="M 35 10 L 45 5 L 50 15 L 45 30 L 35 25 Z" aria-label="Jump to North India" tabindex="0" role="button" />
    
    <!-- Central India -->
    <path id="nav-central" class="nav-region" data-target="central" d="M 45 30 L 55 25 L 60 45 L 60 55 L 45 55 Z" aria-label="Jump to Central India" tabindex="0" role="button" />

    <!-- East India -->
    <path id="nav-east" class="nav-region" data-target="east" d="M 55 25 L 60 25 L 75 35 L 70 45 L 60 45 Z" aria-label="Jump to East India" tabindex="0" role="button" />

    <!-- Northeast India -->
    <path id="nav-northeast" class="nav-region" data-target="northeast" d="M 75 35 L 95 40 L 85 50 L 75 55 L 70 45 Z" aria-label="Jump to Northeast India" tabindex="0" role="button" />

    <!-- West India -->
    <path id="nav-west" class="nav-region" data-target="west" d="M 10 45 L 20 40 L 25 30 L 35 25 L 45 30 L 45 55 L 25 55 L 15 50 Z" aria-label="Jump to West India" tabindex="0" role="button" />

    <!-- South India -->
    <path id="nav-south" class="nav-region" data-target="south" d="M 40 70 L 45 95 L 50 95 L 55 70 L 60 55 L 25 55 L 30 65 Z" aria-label="Jump to South India" tabindex="0" role="button" />
  </g>
</svg>
