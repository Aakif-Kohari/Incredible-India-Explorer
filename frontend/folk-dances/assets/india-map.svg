<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" id="india-map-svg">
  <!-- Simplified Representation of India Map with Interactive States -->
  <!-- Note: Geometries are stylized and highly simplified for the interactive module -->
  <style>
    .state {
      fill: #e0e0e0;
      stroke: #ffffff;
      stroke-width: 2;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .state:hover, .state:focus {
      fill: #ff9933;
      outline: none;
    }
    .state.active {
      fill: #b30000;
    }
    /* Dark mode support handled in main CSS, but default fallbacks here */
  </style>

  <g id="map-states">
    <!-- Jammu & Kashmir -->
    <path id="jammu-kashmir" class="state" aria-label="Jammu &amp; Kashmir - Rouf folk dance" tabindex="0" 
          d="M 280,50 L 350,20 L 420,80 L 450,150 L 380,220 L 260,180 Z" />
    
    <!-- Punjab -->
    <path id="punjab" class="state" aria-label="Punjab - Bhangra folk dance" tabindex="0" 
          d="M 260,180 L 320,240 L 280,300 L 220,250 Z" />
    
    <!-- Rajasthan -->
    <path id="rajasthan" class="state" aria-label="Rajasthan - Ghoomar folk dance" tabindex="0" 
          d="M 220,250 L 280,300 L 300,420 L 150,400 L 130,300 Z" />
    
    <!-- Gujarat -->
    <path id="gujarat" class="state" aria-label="Gujarat - Garba folk dance" tabindex="0" 
          d="M 130,400 L 250,420 L 280,500 L 180,550 L 50,480 Z" />
    
    <!-- Maharashtra -->
    <path id="maharashtra" class="state" aria-label="Maharashtra - Lavani folk dance" tabindex="0" 
          d="M 180,550 L 280,500 L 380,550 L 400,650 L 250,700 L 160,650 Z" />
    
    <!-- Karnataka -->
    <path id="karnataka" class="state" aria-label="Karnataka - Yakshagana folk dance" tabindex="0" 
          d="M 250,700 L 350,680 L 380,780 L 300,850 L 220,780 Z" />
    
    <!-- Odisha -->
    <path id="odisha" class="state" aria-label="Odisha - Chhau folk dance" tabindex="0" 
          d="M 450,450 L 550,450 L 580,550 L 480,580 L 420,520 Z" />
    
    <!-- West Bengal -->
    <path id="west-bengal" class="state" aria-label="West Bengal - Chhau / Baul folk dance" tabindex="0" 
          d="M 550,450 L 600,420 L 650,480 L 600,550 L 580,500 Z" />
    
    <!-- Assam -->
    <path id="assam" class="state" aria-label="Assam - Bihu folk dance" tabindex="0" 
          d="M 600,420 L 650,350 L 750,350 L 780,400 L 650,450 Z" />
          
    <!-- Background placeholder shapes for other non-interactive regions to complete the silhouette roughly -->
    <path class="state non-interactive" style="pointer-events:none; fill:#f5f5f5;" 
          d="M 380,220 L 450,150 L 520,250 L 600,300 L 550,380 L 450,400 L 300,350 L 320,240 Z" />
    <path class="state non-interactive" style="pointer-events:none; fill:#f5f5f5;" 
          d="M 300,420 L 450,400 L 450,450 L 420,520 L 380,550 L 280,500 Z" />
    <path class="state non-interactive" style="pointer-events:none; fill:#f5f5f5;" 
          d="M 400,650 L 480,580 L 500,650 L 400,750 L 350,680 Z" />
    <path class="state non-interactive" style="pointer-events:none; fill:#f5f5f5;" 
          d="M 380,780 L 400,750 L 380,880 L 330,900 L 300,850 Z" />
  </g>
  
  <g id="state-labels" style="pointer-events: none; font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #444;">
    <text x="310" y="140">J&amp;K</text>
    <text x="250" y="250">Punjab</text>
    <text x="180" y="350">Rajasthan</text>
    <text x="130" y="470">Gujarat</text>
    <text x="250" y="600">Maharashtra</text>
    <text x="270" y="770">Karnataka</text>
    <text x="480" y="520">Odisha</text>
    <text x="580" y="490">WB</text>
    <text x="680" y="400">Assam</text>
  </g>
</svg>
