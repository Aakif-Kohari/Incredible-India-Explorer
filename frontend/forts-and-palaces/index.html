<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forts & Palaces Gallery | Incredible India Explorer</title>
    <!-- Include global styles -->
    <link rel="stylesheet" href="../../css/style.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="navbar global-nav">
            <div class="logo">Incredible India</div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">🌙</button></li>
            </ul>
        </nav>

        <main class="gallery-module">
            <!-- Hero Section -->
            <section class="hero-section">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <h1>Forts & Palaces Gallery</h1>
                    <p class="subtitle">Explore the architectural grandeur of Rajput, Maratha, and Mughal monuments across India.</p>
                </div>
            </section>

            <!-- Category Navigation -->
            <section class="filter-section" aria-label="Gallery category filters">
                <div class="filter-container">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="rajput">Rajput</button>
                    <button class="filter-btn" data-filter="maratha">Maratha</button>
                    <button class="filter-btn" data-filter="mughal">Mughal</button>
                </div>
            </section>

            <!-- Gallery Grid -->
            <section class="gallery-section" aria-label="Image gallery of forts and palaces">
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Cards rendered dynamically by script.js -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Incredible India Explorer. All rights reserved.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="../../js/app.js"></script>
    <script src="script.js"></script>
</body>
</html>
