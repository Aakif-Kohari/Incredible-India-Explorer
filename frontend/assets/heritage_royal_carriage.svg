<svg viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of an ornately decorated heritage train carriage, inspired by the Palace on Wheels">
  <rect width="1024" height="500" fill="#1a0f16"/>
  <circle cx="850" cy="110" r="60" fill="#e8a24e" opacity="0.8"/>

  <rect x="0" y="380" width="1024" height="120" fill="#241826"/>
  <rect x="0" y="372" width="1024" height="8" fill="#e8a24e"/>

  <!-- Decorated carriage -->
  <rect x="260" y="260" width="500" height="110" rx="10" fill="#5c1f3a" stroke="#e8a24e" stroke-width="3"/>
  <g fill="#e8a24e" opacity="0.85">
    <rect x="300" y="290" width="40" height="40" rx="4"/>
    <rect x="360" y="290" width="40" height="40" rx="4"/>
    <rect x="420" y="290" width="40" height="40" rx="4"/>
    <rect x="480" y="290" width="40" height="40" rx="4"/>
    <rect x="540" y="290" width="40" height="40" rx="4"/>
    <rect x="600" y="290" width="40" height="40" rx="4"/>
    <rect x="660" y="290" width="40" height="40" rx="4"/>
  </g>
  <rect x="260" y="255" width="500" height="14" fill="#e8a24e"/>

  <!-- Wheels -->
  <g fill="#0f0a05">
    <circle cx="330" cy="380" r="20"/><circle cx="480" cy="380" r="20"/>
    <circle cx="630" cy="380" r="20"/><circle cx="700" cy="380" r="20"/>
  </g>

  <text x="512" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e8a24e" letter-spacing="2">ROYAL HERITAGE ON RAILS</text>
</svg>