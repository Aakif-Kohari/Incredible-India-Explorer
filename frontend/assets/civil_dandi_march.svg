<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the Dandi March, Gandhi leading marchers toward the sea to break the salt law">
  <defs>
    <linearGradient id="dmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="55%" stop-color="#3a2a12"/>
      <stop offset="100%" stop-color="#e0862b"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="640" fill="url(#dmSky)"/>
  <circle cx="820" cy="140" r="70" fill="#f4a94e" opacity="0.9"/>

  <!-- Sea -->
  <rect x="0" y="480" width="1024" height="160" fill="#1f5c3f"/>
  <g stroke="#2f8a5c" stroke-width="3" opacity="0.6">
    <path d="M0 500 Q100 490 200 500 T400 500 T600 500 T800 500 T1024 500"/>
    <path d="M0 530 Q100 520 200 530 T400 530 T600 530 T800 530 T1024 530"/>
  </g>

  <!-- Road -->
  <rect x="0" y="440" width="1024" height="40" fill="#3a2a12"/>

  <!-- Marchers, walking toward sea in a line -->
  <g fill="#14100a">
    <circle cx="180" cy="410" r="13"/><rect x="169" y="423" width="22" height="55" rx="6"/>
    <circle cx="240" cy="420" r="13"/><rect x="229" y="433" width="22" height="55" rx="6"/>
    <circle cx="300" cy="410" r="13"/><rect x="289" y="423" width="22" height="55" rx="6"/>
    <circle cx="360" cy="420" r="13"/><rect x="349" y="433" width="22" height="55" rx="6"/>
    <circle cx="420" cy="410" r="13"/><rect x="409" y="423" width="22" height="55" rx="6"/>
    <circle cx="480" cy="420" r="13"/><rect x="469" y="433" width="22" height="55" rx="6"/>
  </g>
  <!-- Staff-bearing lead figure (Gandhi) -->
  <g fill="#14100a">
    <circle cx="130" cy="400" r="15"/>
    <rect x="118" y="415" width="24" height="65" rx="6"/>
  </g>
  <line x1="150" y1="420" x2="160" y2="480" stroke="#f4a94e" stroke-width="4"/>

  <text x="512" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#f4a94e" letter-spacing="3">DANDI · 6 APRIL 1930</text>
</svg>