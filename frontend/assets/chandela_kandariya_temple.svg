<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a1930"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#d4952f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a1930" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- central shikhara, tallest at Khajuraho -->
  <path d="M250 430 L250 360 Q270 300 290 250 Q310 190 330 130 Q350 190 370 250 Q390 300 410 360 L410 430 Z" fill="#0e5c5c" stroke="#f0c674" stroke-width="2"/>
  <!-- smaller flanking spires (urushringas) -->
  <path d="M180 430 L180 380 Q200 340 220 300 Q235 340 250 380 L250 430 Z" fill="#0a1930" stroke="#d4952f" stroke-width="1.5"/>
  <path d="M410 430 L410 380 Q425 340 440 300 Q455 340 470 380 L470 430 Z" fill="#0a1930" stroke="#d4952f" stroke-width="1.5"/>
  <path d="M120 430 L120 395 Q135 365 150 335 Q160 365 170 395 L170 430 Z" fill="#0a1930" stroke="#d4952f" stroke-width="1.2"/>
  <path d="M480 430 L480 395 Q495 365 510 335 Q520 365 530 395 L530 430 Z" fill="#0a1930" stroke="#d4952f" stroke-width="1.2"/>
  <!-- amalaka crown -->
  <ellipse cx="330" cy="128" rx="16" ry="8" fill="#d4952f"/>
  <rect x="322" y="108" width="16" height="18" fill="#d4952f"/>
  <!-- carved band texture -->
  <g stroke="#f0c674" stroke-width="1" opacity="0.4" fill="none">
    <line x1="270" y1="270" x2="390" y2="270"/>
    <line x1="260" y1="320" x2="400" y2="320"/>
    <line x1="250" y1="370" x2="410" y2="370"/>
  </g>
  <!-- platform -->
  <rect x="100" y="428" width="450" height="16" fill="#0e5c5c" opacity="0.85"/>
</svg>