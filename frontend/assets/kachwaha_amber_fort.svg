<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Amber Fort overlooking Maota Lake">
  <defs>
    <linearGradient id="afSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="55%" stop-color="#4a2a1a"/>
      <stop offset="100%" stop-color="#d4a24c"/>
    </linearGradient>
    <linearGradient id="afLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a4a"/>
      <stop offset="100%" stop-color="#170e0a"/>
    </linearGradient>
    <linearGradient id="afHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a24"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="afWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cfa8"/>
      <stop offset="100%" stop-color="#b8925c"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#afSky)"/>
  <circle cx="820" cy="140" r="60" fill="#f0c97a" opacity="0.85"/>

  <!-- hills -->
  <path d="M0 340 Q200 260 420 320 T1024 300 V420 H0 Z" fill="url(#afHill)"/>
  <path d="M0 380 Q260 320 520 370 T1024 350 V420 H0 Z" fill="#3a2313" opacity="0.9"/>

  <!-- fort wall along hilltop (Amber's hallmark serpentine wall) -->
  <path d="M40 320 L100 300 L160 312 L220 288 L300 300 L360 278 L440 292 L520 270 L600 286 L680 264 L760 280 L840 260 L920 274 L980 258"
        fill="none" stroke="#6a4a2e" stroke-width="10" stroke-linecap="round"/>

  <!-- main fort structure -->
  <g fill="url(#afWall)" stroke="#5c3a24" stroke-width="2">
    <rect x="380" y="230" width="260" height="90"/>
    <rect x="420" y="180" width="180" height="60"/>
    <rect x="460" y="145" width="100" height="45"/>
  </g>
  <!-- domes -->
  <g fill="#d4a24c">
    <circle cx="420" cy="230" r="14"/>
    <circle cx="600" cy="230" r="14"/>
    <circle cx="460" cy="180" r="10"/>
    <circle cx="580" cy="180" r="10"/>
    <circle cx="510" cy="145" r="12"/>
  </g>
  <!-- chhatris (small pavilions) -->
  <g fill="#f0c97a" opacity="0.9">
    <rect x="392" y="245" width="8" height="18"/>
    <rect x="624" y="245" width="8" height="18"/>
  </g>

  <!-- terraced gardens below fort -->
  <path d="M340 320 L680 320 L700 345 L320 345 Z" fill="#7a5636" opacity="0.8"/>
  <path d="M320 345 L700 345 L715 368 L305 368 Z" fill="#63431f" opacity="0.8"/>

  <!-- Maota Lake -->
  <rect y="420" width="1024" height="220" fill="url(#afLake)"/>
  <g stroke="#d9607a" stroke-opacity="0.25" stroke-width="3" fill="none">
    <path d="M0 450 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path d="M0 490 q40 -8 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
  </g>

  <!-- reflection of the fort -->
  <g fill="#5c3a24" opacity="0.35">
    <rect x="380" y="440" width="260" height="60"/>
    <rect x="420" y="490" width="180" height="40"/>
  </g>
</svg>