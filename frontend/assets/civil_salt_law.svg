<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of cultivators making salt at the seashore in defiance of the salt law">
  <rect width="1024" height="640" fill="#14100a"/>
  <circle cx="512" cy="200" r="240" fill="#f4a94e" opacity="0.12"/>

  <!-- Salt pans -->
  <g fill="#f4e8d0" stroke="#e0862b" stroke-width="2">
    <rect x="220" y="360" width="180" height="90" rx="6"/>
    <rect x="430" y="380" width="180" height="90" rx="6"/>
    <rect x="640" y="360" width="180" height="90" rx="6"/>
  </g>
  <g fill="#e0862b" opacity="0.5">
    <circle cx="260" cy="400" r="4"/><circle cx="290" cy="410" r="4"/><circle cx="320" cy="395" r="4"/>
    <circle cx="470" cy="420" r="4"/><circle cx="500" cy="410" r="4"/><circle cx="530" cy="425" r="4"/>
    <circle cx="680" cy="400" r="4"/><circle cx="710" cy="415" r="4"/><circle cx="740" cy="395" r="4"/>
  </g>

  <!-- Figures scooping salt -->
  <g fill="#221b10">
    <circle cx="310" cy="330" r="14"/><path d="M290 350 Q310 330 330 350 L330 380 L290 380 Z"/>
    <circle cx="520" cy="345" r="14"/><path d="M500 365 Q520 345 540 365 L540 395 L500 395 Z"/>
    <circle cx="730" cy="330" r="14"/><path d="M710 350 Q730 330 750 350 L750 380 L710 380 Z"/>
  </g>

  <text x="512" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#f4a94e" letter-spacing="2">"WE MAKE OUR OWN SALT"</text>
</svg>