<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a Sanjhi paper-cut peacock stencil motif">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#201811"/>
      <stop offset="100%" stop-color="#150e08"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#146c60" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#146c60" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#spBg)"/>
  <circle cx="400" cy="280" r="240" fill="url(#spGlow)"/>

  <!-- decorative circular stencil frame -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="#d9a441" stroke-width="3" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- peacock body -->
  <ellipse cx="380" cy="360" rx="40" ry="60" fill="#146c60"/>
  <circle cx="380" cy="280" r="26" fill="#146c60"/>
  <!-- crest -->
  <g stroke="#f0cc7a" stroke-width="3" stroke-linecap="round">
    <line x1="372" y1="256" x2="368" y2="236"/>
    <line x1="380" y1="254" x2="380" y2="232"/>
    <line x1="388" y1="256" x2="392" y2="236"/>
  </g>
  <!-- beak -->
  <path d="M356 280 L338 286 L356 292 Z" fill="#d9a441"/>
  <circle cx="386" cy="276" r="3" fill="#150e08"/>

  <!-- tail fan (paper-cut style feather shapes) -->
  <g fill="none" stroke="#d9a441" stroke-width="2">
    <path d="M400 380 Q460 340 520 380 Q480 420 460 470 Q430 430 400 380 Z" fill="#1a8574" opacity="0.85"/>
    <path d="M400 390 Q470 380 540 430 Q490 450 460 500 Q420 450 400 390 Z" fill="#146c60" opacity="0.85"/>
    <path d="M400 400 Q480 420 540 490 Q480 480 440 520 Q410 460 400 400 Z" fill="#0f5449" opacity="0.85"/>
  </g>
  <g fill="#f0cc7a">
    <circle cx="480" cy="380" r="8"/>
    <circle cx="500" cy="430" r="8"/>
    <circle cx="470" cy="470" r="8"/>
  </g>

  <!-- legs -->
  <g stroke="#8f6a24" stroke-width="4" stroke-linecap="round">
    <line x1="370" y1="418" x2="365" y2="450"/>
    <line x1="392" y1="418" x2="398" y2="450"/>
  </g>

  <!-- decorative corner cut-paper leaves -->
  <g fill="#d9a441" opacity="0.55">
    <path d="M100 100 q30 0 30 30 q-30 0 -30 -30 Z"/>
    <path d="M700 100 q-30 0 -30 30 q30 0 30 -30 Z"/>
    <path d="M100 500 q30 0 30 -30 q-30 0 -30 30 Z"/>
    <path d="M700 500 q-30 0 -30 -30 q30 0 30 30 Z"/>
  </g>

  <text x="400" y="565" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">SANJHI · PEACOCK MOTIF</text>
</svg>