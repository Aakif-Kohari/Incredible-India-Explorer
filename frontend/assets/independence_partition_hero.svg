<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Independence and Partition of 1947">
  <defs>
    <linearGradient id="ipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a101e"/>
      <stop offset="50%" stop-color="#1e1428"/>
      <stop offset="100%" stop-color="#4a2242"/>
    </linearGradient>
    <radialGradient id="ipGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0cc7a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#ipBg)"/>
  <circle cx="512" cy="300" r="220" fill="url(#ipGlow)"/>

  <!-- India outline with partition boundary -->
  <path d="M320 20 C260 40 220 90 210 140 C170 150 120 170 100 220 C80 260 90 300 130 320 C110 360 120 410 160 440 C150 480 170 520 210 540 C220 590 260 630 320 660 C360 615 400 570 420 525 C460 515 500 485 510 448 C550 428 580 390 570 342 C600 302 600 252 560 212 C570 162 540 112 480 82 C440 42 380 12 320 20 Z"
        fill="rgba(240,204,122,0.05)" stroke="rgba(240,204,122,0.3)" stroke-width="2"/>

  <!-- Radcliffe-style boundary line splitting India -->
  <path d="M340 180 C380 220, 350 280, 380 330 C410 380, 430 430, 460 470 C490 510, 520 550, 550 590"
        fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="8 6" opacity="0.7"/>

  <!-- Independence marker (New Delhi) -->
  <circle cx="500" cy="230" r="9" fill="#d9a441" stroke="#4a2242" stroke-width="3"/>
  <text x="500" y="248" font-family="Outfit, sans-serif" font-size="13" fill="#f0cc7a" text-anchor="middle">Independence</text>

  <!-- Lahore / West Pakistan marker -->
  <circle cx="440" cy="180" r="7" fill="#3b82f6" stroke="#1e1428" stroke-width="2"/>
  <text x="440" y="170" font-family="Outfit, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Lahore</text>

  <!-- Karachi / Sind marker -->
  <circle cx="320" cy="340" r="7" fill="#3b82f6" stroke="#1e1428" stroke-width="2"/>
  <text x="320" y="328" font-family="Outfit, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Karachi</text>

  <!-- Amritsar marker -->
  <circle cx="420" cy="180" r="7" fill="#d9a441" stroke="#4a2242" stroke-width="2"/>
  <text x="420" y="170" font-family="Outfit, sans-serif" font-size="11" fill="#d9a441" text-anchor="middle">Amritsar</text>

  <!-- Refugee movement arrows (dotted lines) -->
  <g stroke="#f0cc7a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4">
    <line x1="420" y1="187" x2="510" y2="235"/>
    <line x1="440" y1="188" x2="220" y2="380"/>
    <line x1="320" y1="350" x2="560" y2="440"/>
  </g>

  <!-- ground -->
  <rect y="530" width="1024" height="110" fill="#0f0a14"/>

  <text x="512" y="600" font-family="Georgia, serif" font-size="22" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">INDEPENDENCE &amp; PARTITION, 1947</text>
</svg>
