<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Sanjhi artisan scissors and cut paper">
  <defs>
    <linearGradient id="sspBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#201811"/>
      <stop offset="100%" stop-color="#150e08"/>
    </linearGradient>
    <linearGradient id="sspMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sspBg)"/>
  <circle cx="580" cy="160" r="90" fill="#146c60" opacity="0.1"/>

  <!-- handmade paper sheet with cut-out lace pattern -->
  <rect x="200" y="180" width="320" height="260" rx="4" fill="#e8cba0" opacity="0.95"/>
  <g fill="#150e08" opacity="0.9">
    <circle cx="260" cy="240" r="10"/>
    <circle cx="310" cy="240" r="10"/>
    <circle cx="360" cy="240" r="10"/>
    <circle cx="410" cy="240" r="10"/>
    <circle cx="460" cy="240" r="10"/>
    <circle cx="285" cy="290" r="10"/>
    <circle cx="335" cy="290" r="10"/>
    <circle cx="385" cy="290" r="10"/>
    <circle cx="435" cy="290" r="10"/>
    <circle cx="260" cy="340" r="10"/>
    <circle cx="310" cy="340" r="10"/>
    <circle cx="360" cy="340" r="10"/>
    <circle cx="410" cy="340" r="10"/>
    <circle cx="460" cy="340" r="10"/>
    <path d="M320 380 q40 -20 80 0 q-40 30 -80 0 Z"/>
  </g>
  <rect x="200" y="180" width="320" height="260" rx="4" fill="none" stroke="#8f6a24" stroke-width="2"/>

  <!-- scissors -->
  <g transform="translate(480,300) rotate(-20)">
    <path d="M0 0 L120 40" stroke="url(#sspMetal)" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 0 L120 -40" stroke="url(#sspMetal)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#sspMetal)" stroke-width="6"/>
    <circle cx="-30" cy="20" r="20" fill="none" stroke="#d9a441" stroke-width="6"/>
    <circle cx="-30" cy="-20" r="20" fill="none" stroke="#d9a441" stroke-width="6"/>
  </g>

  <!-- small cut paper scraps scattered below -->
  <g fill="#f0cc7a" opacity="0.7">
    <circle cx="180" cy="480" r="6"/>
    <circle cx="210" cy="500" r="5"/>
    <circle cx="240" cy="475" r="4"/>
    <path d="M600 470 q10 -10 20 0 q-10 14 -20 0 Z"/>
    <path d="M630 490 q10 -10 20 0 q-10 14 -20 0 Z"/>
  </g>

  <text x="400" y="555" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">SCISSORS &amp; HANDMADE PAPER</text>
</svg>