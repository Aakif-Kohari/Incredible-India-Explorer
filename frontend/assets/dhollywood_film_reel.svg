<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a film reel and dhol drum">
  <defs>
    <linearGradient id="dfrBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241010"/>
      <stop offset="100%" stop-color="#170a0a"/>
    </linearGradient>
    <linearGradient id="dfrMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#dfrBg)"/>
  <circle cx="600" cy="150" r="90" fill="#d9a441" opacity="0.08"/>

  <!-- large film reel -->
  <circle cx="300" cy="300" r="140" fill="none" stroke="url(#dfrMetal)" stroke-width="14"/>
  <circle cx="300" cy="300" r="40" fill="url(#dfrMetal)"/>
  <circle cx="300" cy="300" r="14" fill="#170a0a"/>
  <g fill="#170a0a">
    <circle cx="300" cy="210" r="20"/>
    <circle cx="378" cy="255" r="20"/>
    <circle cx="378" cy="345" r="20"/>
    <circle cx="300" cy="390" r="20"/>
    <circle cx="222" cy="345" r="20"/>
    <circle cx="222" cy="255" r="20"/>
  </g>

  <!-- unspooling film strip -->
  <g fill="#1f1010" stroke="#8f6a24" stroke-width="2">
    <rect x="430" y="380" width="220" height="60" rx="4"/>
  </g>
  <g fill="#170a0a">
    <rect x="440" y="390" width="14" height="14"/>
    <rect x="440" y="416" width="14" height="14"/>
    <rect x="470" y="390" width="14" height="14"/>
    <rect x="470" y="416" width="14" height="14"/>
    <rect x="500" y="390" width="14" height="14"/>
    <rect x="500" y="416" width="14" height="14"/>
    <rect x="530" y="390" width="14" height="14"/>
    <rect x="530" y="416" width="14" height="14"/>
    <rect x="560" y="390" width="14" height="14"/>
    <rect x="560" y="416" width="14" height="14"/>
    <rect x="590" y="390" width="14" height="14"/>
    <rect x="590" y="416" width="14" height="14"/>
    <rect x="620" y="390" width="14" height="14"/>
    <rect x="620" y="416" width="14" height="14"/>
  </g>

  <!-- dhol drum -->
  <g>
    <ellipse cx="540" cy="220" rx="70" ry="34" fill="#8f6a24" stroke="#d9a441" stroke-width="4"/>
    <ellipse cx="540" cy="290" rx="70" ry="34" fill="#6b4c1a" stroke="#d9a441" stroke-width="4"/>
    <rect x="470" y="220" width="140" height="70" fill="#6b4c1a" stroke="#d9a441" stroke-width="3"/>
    <g stroke="#f0cc7a" stroke-width="3">
      <line x1="486" y1="225" x2="486" y2="285"/>
      <line x1="512" y1="225" x2="512" y2="285"/>
      <line x1="568" y1="225" x2="568" y2="285"/>
      <line x1="594" y1="225" x2="594" y2="285"/>
    </g>
    <ellipse cx="540" cy="220" rx="70" ry="34" fill="none" stroke="#c41e3a" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- drum sticks -->
  <g stroke="#c99a5c" stroke-width="6" stroke-linecap="round">
    <line x1="500" y1="150" x2="470" y2="200"/>
    <line x1="580" y1="150" x2="610" y2="200"/>
  </g>
</svg>