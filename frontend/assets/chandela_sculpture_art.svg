<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a1930"/>
  <!-- carved wall panel with niches -->
  <rect x="80" y="60" width="640" height="380" rx="6" fill="#0e5c5c" opacity="0.25" stroke="#f0c674" stroke-width="2"/>
  <!-- niche grid suggesting sculpted figures -->
  <g fill="#d4952f" opacity="0.85">
    <rect x="130" y="120" width="70" height="140" rx="30"/>
    <rect x="230" y="100" width="70" height="160" rx="30"/>
    <rect x="330" y="130" width="70" height="130" rx="30"/>
    <rect x="430" y="100" width="70" height="160" rx="30"/>
    <rect x="530" y="120" width="70" height="140" rx="30"/>
    <rect x="600" y="140" width="60" height="120" rx="28"/>
  </g>
  <!-- decorative dividing pilasters -->
  <g stroke="#f0c674" stroke-width="3" opacity="0.55">
    <line x1="215" y1="90" x2="215" y2="290"/>
    <line x1="315" y1="90" x2="315" y2="290"/>
    <line x1="415" y1="90" x2="415" y2="290"/>
    <line x1="515" y1="90" x2="515" y2="290"/>
  </g>
  <!-- lower moulding band -->
  <g fill="none" stroke="#f0c674" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="320" x2="700" y2="320"/>
    <line x1="100" y1="340" x2="700" y2="340"/>
    <line x1="100" y1="360" x2="700" y2="360"/>
  </g>
</svg>