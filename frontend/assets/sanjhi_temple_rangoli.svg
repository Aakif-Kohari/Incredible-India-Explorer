<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a Sanjhi temple rangoli filled with colour">
  <defs>
    <linearGradient id="strBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="55%" stop-color="#241811"/>
      <stop offset="100%" stop-color="#146c60"/>
    </linearGradient>
    <radialGradient id="strGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f0cc7a"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#strBg)"/>
  <circle cx="512" cy="300" r="260" fill="url(#strGlow)" opacity="0.35"/>

  <!-- stone floor -->
  <rect y="480" width="1024" height="160" fill="#241811"/>

  <!-- concentric rangoli rings -->
  <circle cx="512" cy="300" r="220" fill="none" stroke="#c41e3a" stroke-width="6" opacity="0.7"/>
  <circle cx="512" cy="300" r="180" fill="none" stroke="#d9a441" stroke-width="5" opacity="0.7"/>
  <circle cx="512" cy="300" r="140" fill="none" stroke="#146c60" stroke-width="5" opacity="0.7"/>
  <circle cx="512" cy="300" r="100" fill="none" stroke="#f0cc7a" stroke-width="4" opacity="0.7"/>

  <!-- petal pattern -->
  <g fill="#c41e3a" opacity="0.85">
    <ellipse cx="512" cy="120" rx="18" ry="40"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(45 512 300)"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(90 512 300)"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(135 512 300)"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(180 512 300)"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(225 512 300)"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(270 512 300)"/>
    <ellipse cx="512" cy="120" rx="18" ry="40" transform="rotate(315 512 300)"/>
  </g>

  <!-- center medallion -->
  <circle cx="512" cy="300" r="42" fill="#d9a441"/>
  <circle cx="512" cy="300" r="22" fill="#f0cc7a"/>
  <circle cx="512" cy="300" r="8" fill="#c41e3a"/>

  <!-- scattered flower/stone accents -->
  <g fill="#f0cc7a">
    <circle cx="360" cy="200" r="6"/>
    <circle cx="664" cy="200" r="6"/>
    <circle cx="360" cy="400" r="6"/>
    <circle cx="664" cy="400" r="6"/>
    <circle cx="300" cy="300" r="5"/>
    <circle cx="724" cy="300" r="5"/>
  </g>

  <!-- diyas flanking -->
  <g fill="#8f6a24">
    <rect x="230" y="460" width="10" height="40"/>
    <ellipse cx="235" cy="455" rx="16" ry="8"/>
    <rect x="780" y="460" width="10" height="40"/>
    <ellipse cx="785" cy="455" rx="16" ry="8"/>
  </g>
  <g fill="#f0cc7a" opacity="0.85">
    <ellipse cx="235" cy="445" rx="5" ry="9"/>
    <ellipse cx="785" cy="445" rx="5" ry="9"/>
  </g>
</svg>