<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated impression of the Cripps Mission proposal — a sealed colonial-era document and quill">
  <defs>
    <radialGradient id="crippsGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10151f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crippsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161d2b"/>
      <stop offset="100%" stop-color="#0c1019"/>
    </linearGradient>
    <linearGradient id="crippsParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8dcb8"/>
      <stop offset="100%" stop-color="#d5c496"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#crippsBg)"/>
  <rect width="1200" height="630" fill="url(#crippsGlow)"/>

  <!-- Parchment scroll -->
  <g transform="translate(310,120) rotate(-4)">
    <rect x="0" y="0" width="580" height="380" rx="10" fill="url(#crippsParchment)" stroke="#8a6c15" stroke-width="3"/>
    <rect x="0" y="0" width="580" height="26" rx="10" fill="#c9a227" opacity="0.55"/>
    <!-- text lines -->
    <g stroke="#5b4a2a" stroke-width="4" stroke-linecap="round" opacity="0.55">
      <line x1="40" y1="70" x2="500" y2="70"/>
      <line x1="40" y1="100" x2="470" y2="100"/>
      <line x1="40" y1="130" x2="510" y2="130"/>
      <line x1="40" y1="160" x2="430" y2="160"/>
      <line x1="40" y1="200" x2="500" y2="200"/>
      <line x1="40" y1="230" x2="460" y2="230"/>
      <line x1="40" y1="260" x2="510" y2="260"/>
      <line x1="40" y1="290" x2="400" y2="290"/>
    </g>
    <!-- scroll edge curls -->
    <path d="M0 0 Q -22 190 0 380" fill="none" stroke="#8a6c15" stroke-width="6" opacity="0.6"/>
    <path d="M580 0 Q 602 190 580 380" fill="none" stroke="#8a6c15" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- Wax seal -->
  <g transform="translate(760,360)">
    <circle cx="0" cy="0" r="58" fill="#a13d3d" stroke="#7a2b2b" stroke-width="4"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#c96363" stroke-width="2" opacity="0.5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#f3d9d9">C</text>
  </g>

  <!-- Quill -->
  <g transform="translate(880,150) rotate(35)">
    <path d="M0 0 C 40 -10, 60 -60, 20 -160 C 60 -80, 30 -30, 0 0 Z" fill="#e8c766" stroke="#8a6c15" stroke-width="2"/>
    <line x1="0" y1="0" x2="140" y2="180" stroke="#8a6c15" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- decorative flourish -->
  <g opacity="0.35" stroke="#c9a227" stroke-width="2" fill="none">
    <path d="M120 520 Q 260 470 400 520 T 680 520 T 960 520"/>
  </g>
</svg>
