<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration symbolising the 1931 Gandhi-Irwin Pact negotiations">
  <rect width="1024" height="640" fill="#14100a"/>

  <!-- Table -->
  <rect x="300" y="380" width="424" height="22" fill="#e0862b"/>
  <rect x="320" y="402" width="18" height="120" fill="#221b10"/>
  <rect x="686" y="402" width="18" height="120" fill="#221b10"/>

  <!-- Two seated figures facing each other -->
  <g fill="#221b10" stroke="#f4a94e" stroke-width="2">
    <circle cx="400" cy="330" r="26"/><rect x="370" y="356" width="60" height="60"/>
    <circle cx="624" cy="330" r="26"/><rect x="594" y="356" width="60" height="60"/>
  </g>

  <!-- Handshake motif between them -->
  <g stroke="#f4a94e" stroke-width="5">
    <line x1="460" y1="400" x2="512" y2="400"/>
    <line x1="512" y1="400" x2="564" y2="400"/>
  </g>
  <circle cx="512" cy="400" r="8" fill="#f4a94e"/>

  <text x="512" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#f4a94e" letter-spacing="2">GANDHI–IRWIN PACT · MARCH 1931</text>
</svg>