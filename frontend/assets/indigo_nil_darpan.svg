<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration inspired by Dinabandhu Mitra's 1860 play Nil Darpan">
  <defs>
    <radialGradient id="ndAura" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#7d9df0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7d9df0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="640" fill="#0b0f18"/>
  <circle cx="512" cy="240" r="260" fill="url(#ndAura)"/>

  <!-- Open book / play manuscript -->
  <g transform="translate(312,220)">
    <path d="M0 20 Q200 -20 400 20 L400 220 Q200 180 0 220 Z" fill="#141b2b" stroke="#4a6fd4" stroke-width="3"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke="#4a6fd4" stroke-width="2" opacity="0.5"/>
    <g stroke="#7d9df0" stroke-width="2" opacity="0.6">
      <line x1="30" y1="60" x2="170" y2="50"/>
      <line x1="30" y1="90" x2="170" y2="80"/>
      <line x1="30" y1="120" x2="170" y2="110"/>
      <line x1="230" y1="50" x2="370" y2="60"/>
      <line x1="230" y1="80" x2="370" y2="90"/>
      <line x1="230" y1="110" x2="370" y2="120"/>
    </g>
  </g>

  <!-- Quill -->
  <g transform="translate(650,180) rotate(35)">
    <rect x="0" y="0" width="10" height="140" rx="4" fill="#7d9df0"/>
    <path d="M-4 0 Q5 -30 14 0 Z" fill="#7d9df0"/>
  </g>

  <text x="512" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#7d9df0" letter-spacing="2">NIL DARPAN</text>
  <text x="512" y="530" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" fill="#cbd5e1">Dinabandhu Mitra · 1860</text>
</svg>