<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Cellular Jail's radial cell block wings">
  <defs>
    <linearGradient id="ccbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c19"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ccbBg)"/>
  <circle cx="400" cy="300" r="200" fill="#5a6472" opacity="0.08"/>

  <!-- central hub -->
  <circle cx="400" cy="300" r="50" fill="#3a3733" stroke="#5a6472" stroke-width="3"/>
  <circle cx="400" cy="300" r="20" fill="#0f0e0d"/>

  <!-- three radial wings -->
  <g fill="#2a2723" stroke="#5a6472" stroke-width="2.5">
    <rect x="392" y="60" width="16" height="220" transform="rotate(0 400 300)"/>
    <rect x="392" y="60" width="16" height="220" transform="rotate(120 400 300)"/>
    <rect x="392" y="60" width="16" height="220" transform="rotate(240 400 300)"/>
  </g>
  <g fill="#3a3733" stroke="#5a6472" stroke-width="2">
    <rect x="360" y="60" width="80" height="220" transform="rotate(0 400 300)" opacity="0.85"/>
    <rect x="360" y="60" width="80" height="220" transform="rotate(120 400 300)" opacity="0.85"/>
    <rect x="360" y="60" width="80" height="220" transform="rotate(240 400 300)" opacity="0.85"/>
  </g>

  <!-- cell doors along wings -->
  <g fill="#0f0e0d">
    <rect x="375" y="90" width="12" height="18"/>
    <rect x="413" y="90" width="12" height="18"/>
    <rect x="375" y="130" width="12" height="18"/>
    <rect x="413" y="130" width="12" height="18"/>
    <rect x="375" y="170" width="12" height="18"/>
    <rect x="413" y="170" width="12" height="18"/>
    <rect x="375" y="210" width="12" height="18"/>
    <rect x="413" y="210" width="12" height="18"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="530" rx="260" ry="24" fill="#0f0e0d" opacity="0.6"/>

  <text x="400" y="565" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">RADIAL CELL BLOCKS</text>
</svg>