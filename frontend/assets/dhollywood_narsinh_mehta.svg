<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration inspired by Narsinh Mehta, the first Gujarati talkie of 1932">
  <defs>
    <linearGradient id="nmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241010"/>
      <stop offset="100%" stop-color="#170a0a"/>
    </linearGradient>
    <linearGradient id="nmFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nmBg)"/>

  <!-- vintage film frame border -->
  <rect x="60" y="60" width="680" height="480" fill="none" stroke="url(#nmFrame)" stroke-width="8"/>
  <g fill="#8f6a24">
    <rect x="60" y="80" width="16" height="24"/>
    <rect x="60" y="150" width="16" height="24"/>
    <rect x="60" y="220" width="16" height="24"/>
    <rect x="60" y="290" width="16" height="24"/>
    <rect x="60" y="360" width="16" height="24"/>
    <rect x="60" y="430" width="16" height="24"/>
    <rect x="60" y="500" width="16" height="24"/>
    <rect x="724" y="80" width="16" height="24"/>
    <rect x="724" y="150" width="16" height="24"/>
    <rect x="724" y="220" width="16" height="24"/>
    <rect x="724" y="290" width="16" height="24"/>
    <rect x="724" y="360" width="16" height="24"/>
    <rect x="724" y="430" width="16" height="24"/>
    <rect x="724" y="500" width="16" height="24"/>
  </g>

  <!-- ground -->
  <rect x="120" y="430" width="560" height="90" fill="#3b1f18" opacity="0.7"/>

  <!-- seated saint-poet figure with ektara-like instrument -->
  <g>
    <path d="M360 300 q0 -30 40 -30 q40 0 40 30 v140 h-80 Z" fill="#d9a441"/>
    <circle cx="400" cy="255" r="20" fill="#e8cba0"/>
    <path d="M382 240 q18 -14 36 0" fill="none" stroke="#8f6a24" stroke-width="3"/>

    <!-- instrument (ektara-style) -->
    <ellipse cx="450" cy="360" rx="18" ry="12" fill="#6b4c1a" stroke="#d9a441" stroke-width="2"/>
    <line x1="450" y1="348" x2="450" y2="300" stroke="#8f6a24" stroke-width="4"/>
  </g>

  <!-- temple silhouette / shikhara behind figure -->
  <path d="M300 300 L330 210 L360 300 Z" fill="#3b1f18" opacity="0.8"/>
  <path d="M440 300 L470 200 L500 300 Z" fill="#3b1f18" opacity="0.8"/>
  <circle cx="330" cy="200" r="5" fill="#d9a441"/>
  <circle cx="470" cy="190" r="5" fill="#d9a441"/>

  <!-- diyas/lamps flanking the scene -->
  <g fill="#8f6a24">
    <rect x="210" y="420" width="10" height="40"/>
    <ellipse cx="215" cy="415" rx="16" ry="8"/>
    <rect x="580" y="420" width="10" height="40"/>
    <ellipse cx="585" cy="415" rx="16" ry="8"/>
  </g>
  <g fill="#f0cc7a" opacity="0.85">
    <ellipse cx="215" cy="405" rx="5" ry="9"/>
    <ellipse cx="585" cy="405" rx="5" ry="9"/>
  </g>

  <!-- title card text -->
  <text x="400" y="560" font-family="Georgia, serif" font-size="20" fill="#f0cc7a" text-anchor="middle" letter-spacing="3">NARSINH MEHTA · 1932</text>
</svg>