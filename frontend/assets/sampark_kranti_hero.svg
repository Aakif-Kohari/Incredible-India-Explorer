<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the Sampark Kranti Express, a superfast train connecting state capitals to New Delhi, departing a platform at dusk">
  <defs>
    <linearGradient id="skSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#1c1633"/>
      <stop offset="100%" stop-color="#c23b5e"/>
    </linearGradient>
    <linearGradient id="skCoach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fa06e"/>
      <stop offset="100%" stop-color="#1f5c40"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#skSky)"/>
  <circle cx="1000" cy="120" r="70" fill="#e8804e" opacity="0.85"/>

  <!-- Platform -->
  <rect x="0" y="400" width="1200" height="100" fill="#20242c"/>
  <rect x="0" y="392" width="1200" height="8" fill="#f2b25c"/>

  <!-- Train body: engine + coaches -->
  <g>
    <rect x="60" y="270" width="180" height="120" rx="14" fill="#7a2f45" stroke="#f2b25c" stroke-width="3"/>
    <rect x="90" y="290" width="50" height="40" rx="4" fill="#8ec2e8"/>
    <circle cx="100" cy="400" r="18" fill="#161a1f"/>
    <circle cx="200" cy="400" r="18" fill="#161a1f"/>

    <rect x="260" y="280" width="270" height="110" rx="8" fill="url(#skCoach)" stroke="#f2b25c" stroke-width="2"/>
    <rect x="580" y="280" width="270" height="110" rx="8" fill="url(#skCoach)" stroke="#f2b25c" stroke-width="2"/>
    <rect x="900" y="280" width="240" height="110" rx="8" fill="url(#skCoach)" stroke="#f2b25c" stroke-width="2"/>

    <!-- Coach windows -->
    <g fill="#cfe6f7" opacity="0.9">
      <rect x="280" y="300" width="34" height="30" rx="3"/>
      <rect x="330" y="300" width="34" height="30" rx="3"/>
      <rect x="380" y="300" width="34" height="30" rx="3"/>
      <rect x="430" y="300" width="34" height="30" rx="3"/>
      <rect x="480" y="300" width="34" height="30" rx="3"/>
      <rect x="600" y="300" width="34" height="30" rx="3"/>
      <rect x="650" y="300" width="34" height="30" rx="3"/>
      <rect x="700" y="300" width="34" height="30" rx="3"/>
      <rect x="750" y="300" width="34" height="30" rx="3"/>
      <rect x="800" y="300" width="34" height="30" rx="3"/>
      <rect x="920" y="300" width="34" height="30" rx="3"/>
      <rect x="970" y="300" width="34" height="30" rx="3"/>
      <rect x="1020" y="300" width="34" height="30" rx="3"/>
      <rect x="1070" y="300" width="34" height="30" rx="3"/>
    </g>

    <!-- Wheels -->
    <g fill="#161a1f">
      <circle cx="300" cy="400" r="16"/><circle cx="480" cy="400" r="16"/>
      <circle cx="620" cy="400" r="16"/><circle cx="800" cy="400" r="16"/>
      <circle cx="940" cy="400" r="16"/><circle cx="1110" cy="400" r="16"/>
    </g>
  </g>

  <text x="600" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f2b25c" letter-spacing="2">SAMPARK KRANTI EXPRESS</text>
  <text x="600" y="470" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" fill="#cbd5e1">Original illustration — Incredible India Explorer</text>
</svg>