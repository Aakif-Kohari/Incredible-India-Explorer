<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Yerawada Central Jail in Pune">
  <defs>
    <linearGradient id="yjBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1712"/>
      <stop offset="60%" stop-color="#241f19"/>
      <stop offset="100%" stop-color="#96631f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#yjBg)"/>
  <circle cx="600" cy="130" r="80" fill="#f0cc7a" opacity="0.12"/>

  <!-- ground -->
  <rect y="470" width="800" height="130" fill="#120d0a"/>

  <!-- main building facade -->
  <rect x="200" y="280" width="400" height="190" fill="#3a3226" stroke="#5c4a2a" stroke-width="3"/>
  <path d="M170 280 L630 280 L590 230 L210 230 Z" fill="#4a3d28" stroke="#5c4a2a" stroke-width="2"/>

  <!-- central gate arch -->
  <path d="M370 470 v-80 a30 30 0 0 1 60 0 v80 Z" fill="#120d0a"/>

  <!-- barred windows -->
  <g fill="#120d0a">
    <rect x="240" y="320" width="40" height="50" rx="3"/>
    <rect x="320" y="320" width="40" height="50" rx="3"/>
    <rect x="440" y="320" width="40" height="50" rx="3"/>
    <rect x="520" y="320" width="40" height="50" rx="3"/>
  </g>
  <g stroke="#8f6a24" stroke-width="1.5">
    <line x1="250" y1="320" x2="250" y2="370"/>
    <line x1="260" y1="320" x2="260" y2="370"/>
    <line x1="270" y1="320" x2="270" y2="370"/>
    <line x1="330" y1="320" x2="330" y2="370"/>
    <line x1="340" y1="320" x2="340" y2="370"/>
    <line x1="350" y1="320" x2="350" y2="370"/>
    <line x1="450" y1="320" x2="450" y2="370"/>
    <line x1="460" y1="320" x2="460" y2="370"/>
    <line x1="470" y1="320" x2="470" y2="370"/>
    <line x1="530" y1="320" x2="530" y2="370"/>
    <line x1="540" y1="320" x2="540" y2="370"/>
    <line x1="550" y1="320" x2="550" y2="370"/>
  </g>

  <!-- boundary wall -->
  <rect x="140" y="440" width="60" height="60" fill="#3a3226" stroke="#5c4a2a" stroke-width="2"/>
  <rect x="600" y="440" width="60" height="60" fill="#3a3226" stroke="#5c4a2a" stroke-width="2"/>

  <!-- flag suggestion at entrance -->
  <line x1="400" y1="230" x2="400" y2="190" stroke="#8f6a24" stroke-width="3"/>
  <path d="M400 190 l30 10 -30 10 Z" fill="#c41e3a"/>

  <text x="400" y="555" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">YERAWADA CENTRAL JAIL</text>
</svg>