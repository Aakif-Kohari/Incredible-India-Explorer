<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of naval ratings striking aboard HMIS Talwar in Bombay harbour">
  <defs>
    <linearGradient id="htSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="60%" stop-color="#131c2b"/>
      <stop offset="100%" stop-color="#3a8fd6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="640" fill="url(#htSky)"/>
  <circle cx="820" cy="130" r="70" fill="#6fb4ec" opacity="0.85"/>

  <!-- Sea -->
  <rect x="0" y="440" width="1024" height="200" fill="#0d2438"/>
  <g stroke="#3a8fd6" stroke-width="3" opacity="0.5">
    <path d="M0 470 Q100 460 200 470 T400 470 T600 470 T800 470 T1024 470"/>
    <path d="M0 500 Q100 490 200 500 T400 500 T600 500 T800 500 T1024 500"/>
  </g>

  <!-- Ship hull -->
  <path d="M180 380 L840 380 L800 440 L220 440 Z" fill="#131c2b" stroke="#6fb4ec" stroke-width="3"/>
  <rect x="260" y="300" width="500" height="90" fill="#1a2740" stroke="#3a8fd6" stroke-width="2"/>
  <rect x="460" y="230" width="30" height="80" fill="#1a2740" stroke="#3a8fd6" stroke-width="2"/>

  <!-- Ratings on deck with raised fists -->
  <g fill="#0a1018">
    <circle cx="330" cy="360" r="13"/><rect x="319" y="373" width="22" height="30" rx="6"/>
    <circle cx="400" cy="360" r="13"/><rect x="389" y="373" width="22" height="30" rx="6"/>
    <circle cx="470" cy="360" r="13"/><rect x="459" y="373" width="22" height="30" rx="6"/>
    <circle cx="540" cy="360" r="13"/><rect x="529" y="373" width="22" height="30" rx="6"/>
    <circle cx="610" cy="360" r="13"/><rect x="599" y="373" width="22" height="30" rx="6"/>
  </g>
  <g stroke="#6fb4ec" stroke-width="4">
    <line x1="400" y1="373" x2="395" y2="345"/>
    <line x1="540" y1="373" x2="545" y2="345"/>
  </g>

  <text x="512" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#6fb4ec" letter-spacing="3">HMIS TALWAR · 18 FEB 1946</text>
</svg>