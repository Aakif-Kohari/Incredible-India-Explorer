<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a narrow-gauge toy train winding through Himalayan hills, inspired by the Darjeeling Himalayan Railway">
  <defs>
    <linearGradient id="htSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a2b"/>
      <stop offset="55%" stop-color="#1f3a52"/>
      <stop offset="100%" stop-color="#e8a24e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#htSky)"/>
  <circle cx="980" cy="110" r="60" fill="#f4c477" opacity="0.85"/>

  <!-- Hills -->
  <path d="M0 340 Q200 240 420 320 T820 300 T1200 330 V500 H0 Z" fill="#2c4a34"/>
  <path d="M0 400 Q250 340 500 400 T1000 380 T1200 400 V500 H0 Z" fill="#203a29"/>

  <!-- Spiral loop track hint -->
  <ellipse cx="620" cy="410" rx="170" ry="34" fill="none" stroke="#f4c477" stroke-width="4" stroke-dasharray="10 8" opacity="0.7"/>

  <!-- Toy train -->
  <g>
    <rect x="500" y="380" width="46" height="34" rx="6" fill="#7a3a1a" stroke="#f4c477" stroke-width="2"/>
    <circle cx="512" cy="392" r="8" fill="#f4c477"/>
    <rect x="552" y="386" width="56" height="28" rx="4" fill="#5c2f16" stroke="#f4c477" stroke-width="2"/>
    <rect x="616" y="386" width="56" height="28" rx="4" fill="#5c2f16" stroke="#f4c477" stroke-width="2"/>
    <rect x="680" y="386" width="56" height="28" rx="4" fill="#5c2f16" stroke="#f4c477" stroke-width="2"/>
  </g>

  <text x="600" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#f4c477" letter-spacing="2">HERITAGE TRAIN JOURNEYS OF INDIA</text>
  <text x="600" y="470" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" fill="#cbd5e1">Original illustration — Incredible India Explorer</text>
</svg>