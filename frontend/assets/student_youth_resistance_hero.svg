<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of student and youth resistance across India">
  <defs>
    <linearGradient id="syBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="50%" stop-color="#241811"/>
      <stop offset="100%" stop-color="#0f4031"/>
    </linearGradient>
    <radialGradient id="syGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0cc7a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#syBg)"/>
  <circle cx="512" cy="300" r="220" fill="url(#syGlow)"/>

  <!-- India stencil outline with protest markers -->
  <path d="M512 100 C460 120 400 160 380 230 C340 260 320 300 320 360 C320 430 360 500 420 530 C460 555 500 565 540 560 C580 555 620 520 660 490 C700 455 720 410 710 360 C700 310 660 260 630 230 C600 200 560 170 512 100 Z"
        fill="rgba(26,18,10,0.3)" stroke="#d9a441" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- protest rally points -->
  <g fill="#f0cc7a" stroke="#b5451f" stroke-width="2">
    <circle cx="380" cy="230"/>
    <circle cx="440" cy="270"/>
    <circle cx="510" cy="210"/>
    <circle cx="580" cy="250"/>
    <circle cx="630" cy="310"/>
    <circle cx="570" cy="380"/>
    <circle cx="510" cy="420"/>
    <circle cx="450" cy="390"/>
    <circle cx="390" cy="350"/>
  </g>

  <!-- student silhouette icons -->
  <g fill="#241811" stroke="#d9a441" stroke-width="1.5">
    <circle cx="380" cy="230" r="7"/>
    <circle cx="440" cy="270" r="7"/>
    <circle cx="510" cy="210" r="8"/>
    <circle cx="580" cy="250" r="7"/>
    <circle cx="630" cy="310" r="8"/>
    <circle cx="570" cy="380" r="7"/>
    <circle cx="510" cy="420" r="9"/>
    <circle cx="450" cy="390" r="7"/>
    <circle cx="390" cy="350" r="6"/>
  </g>

  <!-- connecting protest lines -->
  <g stroke="#f0cc7a" stroke-width="2" opacity="0.45">
    <line x1="380" y1="230" x2="440" y2="270"/>
    <line x1="440" y1="270" x2="510" y2="210"/>
    <line x1="510" y1="210" x2="580" y2="250"/>
    <line x1="580" y1="250" x2="630" y2="310"/>
    <line x1="630" y1="310" x2="570" y2="380"/>
    <line x1="570" y1="380" x2="510" y2="420"/>
    <line x1="510" y1="420" x2="450" y2="390"/>
    <line x1="450" y1="390" x2="390" y2="350"/>
    <line x1="380" y1="230" x2="450" y2="390"/>
    <line x1="580" y1="250" x2="510" y2="420"/>
  </g>

  <!-- ground -->
  <rect y="530" width="1024" height="110" fill="#120d0a"/>

  <text x="512" y="600" font-family="Georgia, serif" font-size="22" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">STUDENT &amp; YOUTH RESISTANCE</text>
</svg>
