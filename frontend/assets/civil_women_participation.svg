<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration honouring women picketing foreign cloth shops during the Civil Disobedience Movement">
  <defs>
    <radialGradient id="wpAura" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#f4a94e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f4a94e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="640" fill="#14100a"/>
  <circle cx="512" cy="240" r="260" fill="url(#wpAura)"/>

  <!-- Row of women figures with picket signs -->
  <g fill="#221b10">
    <circle cx="320" cy="360" r="20"/><path d="M290 390 Q320 360 350 390 L350 480 L290 480 Z"/>
    <circle cx="460" cy="350" r="20"/><path d="M430 380 Q460 350 490 380 L490 480 L430 480 Z"/>
    <circle cx="600" cy="360" r="20"/><path d="M570 390 Q600 360 630 390 L630 480 L570 480 Z"/>
    <circle cx="720" cy="350" r="20"/><path d="M690 380 Q720 350 750 380 L750 480 L690 480 Z"/>
  </g>

  <!-- Picket signs -->
  <g fill="none" stroke="#f4a94e" stroke-width="3">
    <rect x="410" y="300" width="90" height="34" rx="4"/>
    <rect x="680" y="290" width="90" height="34" rx="4"/>
  </g>

  <text x="512" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#f4a94e" letter-spacing="2">WOMEN IN THE FRONT LINE</text>
</svg>