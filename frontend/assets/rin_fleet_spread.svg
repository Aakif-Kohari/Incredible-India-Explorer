<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the mutiny spreading across Royal Indian Navy ships in harbour">
  <rect width="1024" height="640" fill="#0a1018"/>
  <rect x="0" y="460" width="1024" height="180" fill="#0d2438"/>
  <g stroke="#3a8fd6" stroke-width="3" opacity="0.5">
    <path d="M0 490 Q100 480 200 490 T400 490 T600 490 T800 490 T1024 490"/>
  </g>

  <!-- Multiple ship silhouettes at anchor -->
  <g fill="#131c2b" stroke="#6fb4ec" stroke-width="2">
    <path d="M100 420 L300 420 L280 460 L120 460 Z"/>
    <rect x="170" y="370" width="60" height="55"/>
    <path d="M380 400 L620 400 L600 460 L400 460 Z"/>
    <rect x="460" y="340" width="70" height="65"/>
    <path d="M680 420 L900 420 L880 460 L700 460 Z"/>
    <rect x="750" y="375" width="60" height="50"/>
  </g>

  <!-- Strike flags on each ship -->
  <g fill="#b23245">
    <rect x="195" y="330" width="40" height="26"/>
    <rect x="490" y="300" width="40" height="26"/>
    <rect x="775" y="335" width="40" height="26"/>
  </g>
  <g stroke="#6fb4ec" stroke-width="3">
    <line x1="195" y1="370" x2="195" y2="330"/>
    <line x1="490" y1="340" x2="490" y2="300"/>
    <line x1="775" y1="375" x2="775" y2="335"/>
  </g>

  <text x="512" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#6fb4ec" letter-spacing="2">78 SHIPS · 20 SHORE ESTABLISHMENTS</text>
</svg>