<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Bengali peasants resisting forced indigo cultivation">
  <rect width="1024" height="640" fill="#0b0f18"/>
  <circle cx="512" cy="200" r="240" fill="#4a6fd4" opacity="0.14"/>

  <!-- Group of peasants with raised tools (lathis/sickles) standing firm -->
  <g fill="#141b2b" stroke="#4a6fd4" stroke-width="2">
    <circle cx="360" cy="380" r="18"/><rect x="345" y="398" width="30" height="70" rx="6"/>
    <circle cx="440" cy="360" r="18"/><rect x="425" y="378" width="30" height="70" rx="6"/>
    <circle cx="520" cy="370" r="18"/><rect x="505" y="388" width="30" height="70" rx="6"/>
    <circle cx="600" cy="360" r="18"/><rect x="585" y="378" width="30" height="70" rx="6"/>
    <circle cx="680" cy="380" r="18"/><rect x="665" y="398" width="30" height="70" rx="6"/>
  </g>

  <!-- Raised sickles / tools -->
  <g stroke="#7d9df0" stroke-width="5">
    <line x1="360" y1="398" x2="330" y2="340"/>
    <line x1="520" y1="388" x2="520" y2="320"/>
    <line x1="680" y1="398" x2="710" y2="340"/>
  </g>

  <text x="512" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#7d9df0" letter-spacing="2">"WE WILL NOT SOW INDIGO"</text>
</svg>