<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the Cellular Jail watchtower">
  <defs>
    <linearGradient id="cjhBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="55%" stop-color="#1e1c19"/>
      <stop offset="100%" stop-color="#5a6472"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="640" fill="url(#cjhBg)"/>
  <circle cx="512" cy="180" r="140" fill="#d9a441" opacity="0.08"/>

  <!-- ground -->
  <rect y="540" width="1024" height="100" fill="#0f0e0d"/>

  <!-- central watchtower -->
  <rect x="462" y="160" width="100" height="280" fill="#3a3733" stroke="#5a6472" stroke-width="3"/>
  <rect x="440" y="120" width="144" height="50" fill="#4a463f" stroke="#5a6472" stroke-width="3"/>
  <polygon points="440,120 512,80 584,120" fill="#2a2723" stroke="#5a6472" stroke-width="3"/>

  <!-- radial wings extending from tower -->
  <g fill="#2a2723" stroke="#5a6472" stroke-width="2">
    <rect x="60" y="380" width="380" height="60" transform="rotate(-8 250 410)"/>
    <rect x="584" y="380" width="380" height="60" transform="rotate(8 774 410)"/>
    <rect x="462" y="440" width="100" height="100"/>
  </g>

  <!-- windows on tower -->
  <g fill="#0f0e0d">
    <rect x="485" y="200" width="18" height="30"/>
    <rect x="521" y="200" width="18" height="30"/>
    <rect x="485" y="260" width="18" height="30"/>
    <rect x="521" y="260" width="18" height="30"/>
    <rect x="485" y="320" width="18" height="30"/>
    <rect x="521" y="320" width="18" height="30"/>
  </g>

  <!-- cell block window rows on wings -->
  <g fill="#0f0e0d">
    <rect x="90" y="395" width="14" height="20"/>
    <rect x="130" y="392" width="14" height="20"/>
    <rect x="170" y="389" width="14" height="20"/>
    <rect x="210" y="386" width="14" height="20"/>
    <rect x="250" y="383" width="14" height="20"/>
    <rect x="620" y="395" width="14" height="20"/>
    <rect x="660" y="392" width="14" height="20"/>
    <rect x="700" y="389" width="14" height="20"/>
    <rect x="740" y="386" width="14" height="20"/>
    <rect x="780" y="383" width="14" height="20"/>
  </g>

  <text x="512" y="600" font-family="Georgia, serif" font-size="20" fill="#f0cc7a" text-anchor="middle" letter-spacing="3">CELLULAR JAIL · KALA PANI</text>
</svg>