<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of Jaigarh Fort and the Jaivana cannon">
  <defs>
    <linearGradient id="jgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241511"/>
      <stop offset="100%" stop-color="#170e0a"/>
    </linearGradient>
    <linearGradient id="jgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#jgBg)"/>

  <!-- fort ramparts backdrop -->
  <rect x="0" y="260" width="800" height="60" fill="url(#jgWall)" opacity="0.6"/>
  <g fill="url(#jgWall)" opacity="0.7">
    <rect x="40" y="230" width="24" height="30"/>
    <rect x="120" y="230" width="24" height="30"/>
    <rect x="640" y="230" width="24" height="30"/>
    <rect x="720" y="230" width="24" height="30"/>
  </g>

  <!-- ground platform -->
  <ellipse cx="400" cy="470" rx="300" ry="40" fill="#4d3a22" opacity="0.5"/>
  <rect x="150" y="440" width="500" height="30" rx="6" fill="#5c3a24"/>

  <!-- Jaivana cannon carriage wheels -->
  <circle cx="280" cy="440" r="55" fill="none" stroke="#8f6a24" stroke-width="10"/>
  <circle cx="280" cy="440" r="10" fill="#d4a24c"/>
  <circle cx="520" cy="440" r="55" fill="none" stroke="#8f6a24" stroke-width="10"/>
  <circle cx="520" cy="440" r="10" fill="#d4a24c"/>
  <g stroke="#6a4a2e" stroke-width="4">
    <line x1="280" y1="440" x2="245" y2="405"/>
    <line x1="280" y1="440" x2="315" y2="405"/>
    <line x1="280" y1="440" x2="245" y2="475"/>
    <line x1="280" y1="440" x2="315" y2="475"/>
    <line x1="520" y1="440" x2="485" y2="405"/>
    <line x1="520" y1="440" x2="555" y2="405"/>
    <line x1="520" y1="440" x2="485" y2="475"/>
    <line x1="520" y1="440" x2="555" y2="475"/>
  </g>

  <!-- cannon barrel -->
  <rect x="230" y="395" width="360" height="42" rx="20" fill="#3b2c18" stroke="#170e0a" stroke-width="2"/>
  <ellipse cx="580" cy="416" rx="16" ry="21" fill="#241511"/>
  <rect x="220" y="388" width="40" height="56" rx="8" fill="#5c3a24"/>

  <!-- decorative bands on barrel -->
  <g stroke="#d4a24c" stroke-width="3" opacity="0.8">
    <line x1="290" y1="395" x2="290" y2="437"/>
    <line x1="360" y1="395" x2="360" y2="437"/>
    <line x1="430" y1="395" x2="430" y2="437"/>
    <line x1="500" y1="395" x2="500" y2="437"/>
  </g>

  <!-- sky glow -->
  <circle cx="650" cy="140" r="90" fill="#d4a24c" opacity="0.12"/>
</svg>