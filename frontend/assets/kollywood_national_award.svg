<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated Rajat Kamal National Film Award trophy on a dais">
  <defs>
    <radialGradient id="kaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f3cc78" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f3cc78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kaLotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3cc78"/>
      <stop offset="100%" stop-color="#9c6f1c"/>
    </linearGradient>
    <linearGradient id="kaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150807"/>
      <stop offset="100%" stop-color="#3a120e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#kaBg)"/>
  <ellipse cx="512" cy="270" rx="300" ry="240" fill="url(#kaGlow)"/>

  <!-- dais -->
  <rect x="330" y="500" width="364" height="34" rx="4" fill="#2a100b" stroke="#e0a840" stroke-width="2"/>
  <rect x="380" y="470" width="264" height="34" rx="4" fill="#3a1710" stroke="#e0a840" stroke-width="2"/>

  <!-- trophy stem -->
  <rect x="500" y="360" width="24" height="112" fill="#c39a5f"/>
  <ellipse cx="512" cy="360" rx="60" ry="16" fill="#9c6f1c"/>

  <!-- lotus petals (Rajat Kamal) -->
  <g fill="url(#kaLotus)" stroke="#9c6f1c" stroke-width="1.5">
    <ellipse cx="512" cy="260" rx="26" ry="70"/>
    <ellipse cx="462" cy="278" rx="26" ry="66" transform="rotate(-35 462 278)"/>
    <ellipse cx="562" cy="278" rx="26" ry="66" transform="rotate(35 562 278)"/>
    <ellipse cx="432" cy="320" rx="24" ry="60" transform="rotate(-65 432 320)"/>
    <ellipse cx="592" cy="320" rx="24" ry="60" transform="rotate(65 592 320)"/>
    <ellipse cx="512" cy="230" rx="18" ry="50"/>
  </g>
  <circle cx="512" cy="300" r="16" fill="#f3cc78"/>

  <!-- laurel accents on dais -->
  <g stroke="#e0a840" stroke-width="2" fill="none" opacity="0.8">
    <path d="M400 500 Q420 480 440 500"/>
    <path d="M584 500 Q604 480 624 500"/>
  </g>

  <!-- caption -->
  <rect x="382" y="555" width="260" height="46" rx="4" fill="#120806" stroke="#e0a840" stroke-width="2"/>
  <text x="512" y="585" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f3cc78" text-anchor="middle" letter-spacing="2">RAJAT KAMAL</text>
</svg>
