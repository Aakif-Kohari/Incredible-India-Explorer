<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration representing the 1860 Indigo Commission of Inquiry">
  <rect width="1024" height="640" fill="#0b0f18"/>

  <!-- Table -->
  <rect x="200" y="380" width="624" height="24" fill="#2e4a8f"/>
  <rect x="230" y="404" width="20" height="140" fill="#1a2a52"/>
  <rect x="774" y="404" width="20" height="140" fill="#1a2a52"/>

  <!-- Commission members (silhouettes seated) -->
  <g fill="#141b2b" stroke="#4a6fd4" stroke-width="2">
    <circle cx="320" cy="330" r="26"/><rect x="290" y="356" width="60" height="60"/>
    <circle cx="440" cy="320" r="26"/><rect x="410" y="346" width="60" height="60"/>
    <circle cx="580" cy="320" r="26"/><rect x="550" y="346" width="60" height="60"/>
    <circle cx="700" cy="330" r="26"/><rect x="670" y="356" width="60" height="60"/>
  </g>

  <!-- Document / report on table -->
  <g transform="translate(462,340)">
    <rect x="0" y="0" width="100" height="40" fill="#f0cc7a" opacity="0.15" stroke="#7d9df0" stroke-width="2"/>
    <line x1="14" y1="12" x2="86" y2="12" stroke="#7d9df0" stroke-width="2"/>
    <line x1="14" y1="22" x2="86" y2="22" stroke="#7d9df0" stroke-width="2"/>
    <line x1="14" y1="32" x2="60" y2="32" stroke="#7d9df0" stroke-width="2"/>
  </g>

  <text x="512" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#7d9df0" letter-spacing="2">INDIGO COMMISSION · 1860</text>
</svg>