<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the Feroz Shah Kotla ruins in Delhi">
  <defs>
    <linearGradient id="fskBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="60%" stop-color="#241811"/>
      <stop offset="100%" stop-color="#b5451f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fskBg)"/>
  <circle cx="620" cy="130" r="70" fill="#f0cc7a" opacity="0.15"/>

  <!-- ground -->
  <rect x="0" y="460" width="800" height="140" fill="#120d0a"/>

  <!-- ruined stepped structure (Ashokan pillar site impression) -->
  <g fill="#8f6a24" opacity="0.9">
    <rect x="260" y="380" width="280" height="80" rx="4"/>
    <rect x="290" y="320" width="220" height="70" rx="4"/>
    <rect x="320" y="260" width="160" height="70" rx="4"/>
    <rect x="350" y="200" width="100" height="70" rx="4"/>
  </g>
  <g fill="none" stroke="#d9a441" stroke-width="2" opacity="0.6">
    <rect x="260" y="380" width="280" height="80" rx="4"/>
    <rect x="290" y="320" width="220" height="70" rx="4"/>
    <rect x="320" y="260" width="160" height="70" rx="4"/>
    <rect x="350" y="200" width="100" height="70" rx="4"/>
  </g>

  <!-- pillar on top -->
  <rect x="392" y="110" width="16" height="95" fill="#c99a5c" stroke="#5c3a24" stroke-width="2"/>
  <ellipse cx="400" cy="108" rx="16" ry="6" fill="#c99a5c" stroke="#5c3a24" stroke-width="2"/>

  <!-- arched doorways suggestion -->
  <g fill="#120d0a">
    <path d="M300 460 v-40 a20 20 0 0 1 40 0 v40 Z"/>
    <path d="M460 460 v-40 a20 20 0 0 1 40 0 v40 Z"/>
  </g>

  <!-- ruined bricks scattered -->
  <g fill="#5c3a24" opacity="0.7">
    <rect x="150" y="440" width="40" height="20" rx="2"/>
    <rect x="200" y="450" width="30" height="16" rx="2"/>
    <rect x="600" y="440" width="40" height="20" rx="2"/>
    <rect x="650" y="450" width="30" height="16" rx="2"/>
  </g>

  <!-- small group figures (revolutionary gathering impression) -->
  <g fill="#241811">
    <circle cx="330" cy="430" r="10"/>
    <rect x="322" y="440" width="16" height="24"/>
    <circle cx="360" cy="430" r="10"/>
    <rect x="352" y="440" width="16" height="24"/>
    <circle cx="470" cy="430" r="10"/>
    <rect x="462" y="440" width="16" height="24"/>
  </g>

  <text x="400" y="560" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">FEROZ SHAH KOTLA, 1928</text>
</svg>