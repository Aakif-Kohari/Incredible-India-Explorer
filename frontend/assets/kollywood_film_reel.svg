<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated film reel and vintage movie camera representing the craft of Tamil filmmaking">
  <defs>
    <linearGradient id="krBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150807"/>
      <stop offset="100%" stop-color="#3a120e"/>
    </linearGradient>
    <radialGradient id="krGlow" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f3cc78" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f3cc78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#krBg)"/>
  <circle cx="330" cy="260" r="240" fill="url(#krGlow)"/>

  <!-- film reel -->
  <circle cx="330" cy="300" r="150" fill="none" stroke="#e0a840" stroke-width="10"/>
  <circle cx="330" cy="300" r="34" fill="#150806" stroke="#e0a840" stroke-width="6"/>
  <g fill="#150806" stroke="#e0a840" stroke-width="4">
    <circle cx="330" cy="180" r="26"/>
    <circle cx="440" cy="240" r="26"/>
    <circle cx="440" cy="360" r="26"/>
    <circle cx="330" cy="420" r="26"/>
    <circle cx="220" cy="360" r="26"/>
    <circle cx="220" cy="240" r="26"/>
  </g>

  <!-- filmstrip trailing -->
  <path d="M470 300 L760 260" stroke="#e0a840" stroke-width="14" opacity="0.85"/>
  <g fill="#150806">
    <rect x="500" y="284" width="18" height="18"/>
    <rect x="540" y="278" width="18" height="18"/>
    <rect x="580" y="272" width="18" height="18"/>
    <rect x="620" y="266" width="18" height="18"/>
    <rect x="660" y="260" width="18" height="18"/>
    <rect x="700" y="254" width="18" height="18"/>
  </g>

  <!-- vintage camera -->
  <g>
    <rect x="640" y="380" width="220" height="130" rx="10" fill="#c39a5f" stroke="#5c3420" stroke-width="3"/>
    <rect x="640" y="380" width="220" height="26" fill="#9c6f1c"/>
    <circle cx="700" cy="450" r="46" fill="#150806" stroke="#e0a840" stroke-width="6"/>
    <circle cx="700" cy="450" r="22" fill="#3a120e"/>
    <rect x="800" y="410" width="50" height="60" rx="6" fill="#8a1c22" stroke="#5c3420" stroke-width="2"/>
    <rect x="770" y="350" width="40" height="34" rx="4" fill="#8a1c22" stroke="#5c3420" stroke-width="2"/>
    <rect x="640" y="480" width="220" height="14" fill="#5c3420"/>
  </g>

  <!-- caption -->
  <rect x="382" y="555" width="260" height="46" rx="4" fill="#120806" stroke="#e0a840" stroke-width="2"/>
  <text x="512" y="585" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f3cc78" text-anchor="middle" letter-spacing="2">REEL &amp; CAMERA</text>
</svg>
