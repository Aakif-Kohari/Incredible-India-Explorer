<svg viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a narrow-gauge train crossing a multi-arched mountain viaduct, inspired by the Kalka-Shimla Railway">
  <rect width="1024" height="500" fill="#0c1a2b"/>
  <circle cx="850" cy="110" r="60" fill="#f4c477" opacity="0.8"/>

  <!-- Mountains -->
  <path d="M0 300 L200 150 L380 300 Z" fill="#1f3a52"/>
  <path d="M300 300 L520 130 L740 300 Z" fill="#254a68"/>
  <path d="M620 300 L820 170 L1024 300 Z" fill="#1f3a52"/>

  <!-- Viaduct -->
  <rect x="150" y="330" width="720" height="20" fill="#5c4326"/>
  <g fill="none" stroke="#5c4326" stroke-width="10">
    <path d="M180 350 Q230 400 280 350"/>
    <path d="M280 350 Q330 400 380 350"/>
    <path d="M380 350 Q430 400 480 350"/>
    <path d="M480 350 Q530 400 580 350"/>
    <path d="M580 350 Q630 400 680 350"/>
    <path d="M680 350 Q730 400 780 350"/>
  </g>

  <!-- Train on viaduct -->
  <g fill="#7a3a1a" stroke="#f4c477" stroke-width="2">
    <rect x="330" y="308" width="50" height="24" rx="4"/>
    <rect x="384" y="308" width="50" height="24" rx="4"/>
    <rect x="438" y="308" width="50" height="24" rx="4"/>
  </g>

  <text x="512" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f4c477" letter-spacing="2">MOUNTAIN RAILWAYS OF INDIA</text>
</svg>