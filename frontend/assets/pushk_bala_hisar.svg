<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the Bala Hisar mound of ancient Pushkalavati at the confluence of two rivers">
  <defs>
    <linearGradient id="bhSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191008"/>
      <stop offset="60%" stop-color="#3a2412"/>
      <stop offset="100%" stop-color="#c9852f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="640" fill="url(#bhSky)"/>
  <circle cx="800" cy="140" r="75" fill="#e8ab5c" opacity="0.85"/>

  <!-- Two converging rivers -->
  <path d="M0 470 Q250 440 400 480 Q550 520 1024 500 L1024 640 L0 640 Z" fill="#3a5a68"/>
  <path d="M0 420 Q220 400 400 480" fill="none" stroke="#6b8e9e" stroke-width="6" opacity="0.6"/>
  <path d="M1024 400 Q700 420 400 480" fill="none" stroke="#6b8e9e" stroke-width="6" opacity="0.6"/>

  <!-- City mound -->
  <path d="M340 460 Q400 300 520 300 Q640 300 700 460 Z" fill="#7a3a24" stroke="#e8ab5c" stroke-width="3"/>
  <rect x="440" y="330" width="140" height="50" fill="#241a0e" stroke="#c9852f" stroke-width="2"/>

  <!-- Fortification wall outline -->
  <path d="M360 440 Q510 340 680 440" fill="none" stroke="#e8ab5c" stroke-width="4" stroke-dasharray="10 8"/>

  <text x="512" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#e8ab5c" letter-spacing="3">BALA HISAR · PUSHKALAVATI</text>
</svg>