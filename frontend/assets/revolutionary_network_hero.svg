<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a connected revolutionary network">
  <defs>
    <linearGradient id="rnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="55%" stop-color="#241811"/>
      <stop offset="100%" stop-color="#b5451f"/>
    </linearGradient>
    <radialGradient id="rnGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0cc7a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#rnBg)"/>
  <circle cx="512" cy="280" r="260" fill="url(#rnGlow)"/>

  <!-- connecting lines -->
  <g stroke="#f0cc7a" stroke-width="2" opacity="0.5">
    <line x1="260" y1="180" x2="450" y2="260"/>
    <line x1="450" y1="260" x2="620" y2="180"/>
    <line x1="450" y1="260" x2="450" y2="420"/>
    <line x1="450" y1="420" x2="680" y2="440"/>
    <line x1="680" y1="440" x2="820" y2="360"/>
    <line x1="680" y1="440" x2="820" y2="520"/>
    <line x1="260" y1="180" x2="220" y2="360"/>
  </g>

  <!-- nodes -->
  <g fill="#241811" stroke="#d9a441" stroke-width="3">
    <circle cx="260" cy="180" r="34"/>
    <circle cx="450" cy="260" r="44"/>
    <circle cx="620" cy="180" r="28"/>
    <circle cx="450" cy="420" r="46"/>
    <circle cx="680" cy="440" r="30"/>
    <circle cx="820" cy="360" r="26"/>
    <circle cx="820" cy="520" r="26"/>
    <circle cx="220" cy="360" r="26"/>
  </g>
  <g fill="#f0cc7a">
    <circle cx="260" cy="180" r="6"/>
    <circle cx="450" cy="260" r="8"/>
    <circle cx="620" cy="180" r="5"/>
    <circle cx="450" cy="420" r="8"/>
    <circle cx="680" cy="440" r="6"/>
    <circle cx="820" cy="360" r="5"/>
    <circle cx="820" cy="520" r="5"/>
    <circle cx="220" cy="360" r="5"/>
  </g>

  <!-- ground -->
  <rect y="560" width="1024" height="80" fill="#120d0a"/>

  <text x="512" y="600" font-family="Georgia, serif" font-size="20" fill="#f0cc7a" text-anchor="middle" letter-spacing="3">THE REVOLUTIONARY NETWORK</text>
</svg>