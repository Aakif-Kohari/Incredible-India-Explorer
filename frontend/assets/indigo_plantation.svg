<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of an indigo plantation in Bengal with cultivators at work">
  <defs>
    <linearGradient id="ipSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f18"/>
      <stop offset="60%" stop-color="#141b2b"/>
      <stop offset="100%" stop-color="#2e4a8f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="640" fill="url(#ipSky)"/>

  <!-- Fields -->
  <rect x="0" y="380" width="1024" height="260" fill="#12331f"/>
  <g fill="#1c4a2c">
    <rect x="0" y="380" width="1024" height="16"/>
  </g>
  <g fill="#3fae6a" opacity="0.85">
    <circle cx="120" cy="430" r="7"/><circle cx="160" cy="450" r="7"/><circle cx="200" cy="425" r="7"/>
    <circle cx="240" cy="455" r="7"/><circle cx="280" cy="435" r="7"/><circle cx="320" cy="460" r="7"/>
    <circle cx="360" cy="430" r="7"/><circle cx="400" cy="450" r="7"/><circle cx="440" cy="425" r="7"/>
    <circle cx="480" cy="455" r="7"/><circle cx="520" cy="435" r="7"/><circle cx="560" cy="460" r="7"/>
    <circle cx="600" cy="430" r="7"/><circle cx="640" cy="450" r="7"/><circle cx="680" cy="425" r="7"/>
    <circle cx="720" cy="455" r="7"/><circle cx="760" cy="435" r="7"/><circle cx="800" cy="460" r="7"/>
    <circle cx="840" cy="430" r="7"/><circle cx="880" cy="450" r="7"/>
  </g>

  <!-- Cultivator figures bent working -->
  <g fill="#1a2a52">
    <path d="M220 520 Q260 490 300 520 L300 560 L220 560 Z"/>
    <circle cx="220" cy="510" r="14"/>
    <path d="M560 530 Q600 500 640 530 L640 570 L560 570 Z"/>
    <circle cx="560" cy="520" r="14"/>
  </g>

  <!-- Planter's bungalow silhouette in background -->
  <g fill="#141b2b" stroke="#2e4a8f" stroke-width="2">
    <rect x="760" y="260" width="180" height="110"/>
    <path d="M750 260 L850 200 L950 260 Z"/>
  </g>

  <text x="512" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#7d9df0" letter-spacing="3">NEEL CHASH · BENGAL, 1859</text>
</svg>