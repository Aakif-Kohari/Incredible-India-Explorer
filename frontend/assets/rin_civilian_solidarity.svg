<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of civilian solidarity strikes on the streets of Bombay during the mutiny">
  <rect width="1024" height="640" fill="#0a1018"/>
  <circle cx="512" cy="200" r="240" fill="#3a8fd6" opacity="0.12"/>

  <!-- Street with shuttered mill buildings -->
  <rect x="0" y="420" width="1024" height="220" fill="#131c2b"/>
  <g fill="#1a2740" stroke="#3a8fd6" stroke-width="2">
    <rect x="120" y="330" width="180" height="100"/>
    <rect x="360" y="300" width="200" height="130"/>
    <rect x="620" y="330" width="180" height="100"/>
  </g>
  <rect x="440" y="260" width="30" height="60" fill="#1a2740" stroke="#3a8fd6" stroke-width="2"/>

  <!-- Crowd of civilians in solidarity -->
  <g fill="#0a1018">
    <circle cx="260" cy="470" r="15"/><rect x="248" y="486" width="24" height="60" rx="6"/>
    <circle cx="330" cy="480" r="15"/><rect x="318" y="496" width="24" height="60" rx="6"/>
    <circle cx="400" cy="470" r="15"/><rect x="388" y="486" width="24" height="60" rx="6"/>
    <circle cx="600" cy="480" r="15"/><rect x="588" y="496" width="24" height="60" rx="6"/>
    <circle cx="670" cy="470" r="15"/><rect x="658" y="486" width="24" height="60" rx="6"/>
    <circle cx="740" cy="480" r="15"/><rect x="728" y="496" width="24" height="60" rx="6"/>
  </g>

  <text x="512" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#6fb4ec" letter-spacing="2">BOMBAY IN SOLIDARITY</text>
</svg>