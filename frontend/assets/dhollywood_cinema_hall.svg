<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a vintage cinema hall marquee in Gujarat">
  <defs>
    <linearGradient id="dchSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="55%" stop-color="#3a1414"/>
      <stop offset="100%" stop-color="#c41e3a"/>
    </linearGradient>
    <linearGradient id="dchWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cba0"/>
      <stop offset="100%" stop-color="#b89060"/>
    </linearGradient>
    <radialGradient id="dchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0cc7a"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#dchSky)"/>
  <circle cx="512" cy="220" r="220" fill="url(#dchGlow)" opacity="0.5"/>

  <!-- ground -->
  <rect y="500" width="1024" height="140" fill="#120808"/>
  <rect y="500" width="1024" height="18" fill="#1f1010"/>

  <!-- cinema hall facade -->
  <rect x="260" y="260" width="504" height="240" fill="url(#dchWall)" stroke="#5c2424" stroke-width="3"/>

  <!-- marquee canopy -->
  <path d="M230 260 L794 260 L764 210 L260 210 Z" fill="#8a1c2e" stroke="#3b1010" stroke-width="2"/>
  <g fill="#f0cc7a">
    <circle cx="270" cy="235" r="4"/>
    <circle cx="310" cy="235" r="4"/>
    <circle cx="350" cy="235" r="4"/>
    <circle cx="390" cy="235" r="4"/>
    <circle cx="430" cy="235" r="4"/>
    <circle cx="470" cy="235" r="4"/>
    <circle cx="510" cy="235" r="4"/>
    <circle cx="550" cy="235" r="4"/>
    <circle cx="590" cy="235" r="4"/>
    <circle cx="630" cy="235" r="4"/>
    <circle cx="670" cy="235" r="4"/>
    <circle cx="710" cy="235" r="4"/>
    <circle cx="750" cy="235" r="4"/>
  </g>

  <!-- marquee sign board -->
  <rect x="340" y="215" width="344" height="40" rx="4" fill="#120808" stroke="#d9a441" stroke-width="2"/>
  <text x="512" y="242" font-family="Georgia, serif" font-size="20" fill="#f0cc7a" text-anchor="middle" letter-spacing="3">DHOLLYWOOD</text>

  <!-- entrance doors -->
  <g fill="#3b1010">
    <rect x="420" y="380" width="70" height="120" rx="4"/>
    <rect x="534" y="380" width="70" height="120" rx="4"/>
  </g>
  <g stroke="#d9a441" stroke-width="2" opacity="0.6">
    <line x1="455" y1="380" x2="455" y2="500"/>
    <line x1="569" y1="380" x2="569" y2="500"/>
  </g>

  <!-- windows -->
  <g fill="#120808" opacity="0.85">
    <rect x="300" y="300" width="50" height="60" rx="6"/>
    <rect x="674" y="300" width="50" height="60" rx="6"/>
  </g>

  <!-- dhol drum decoration above entrance -->
  <g>
    <ellipse cx="512" cy="315" rx="34" ry="18" fill="#8f6a24" stroke="#d9a441" stroke-width="3"/>
    <ellipse cx="512" cy="345" rx="34" ry="18" fill="#6b4c1a" stroke="#d9a441" stroke-width="3"/>
    <rect x="478" y="315" width="68" height="30" fill="#6b4c1a" stroke="#d9a441" stroke-width="2"/>
    <g stroke="#f0cc7a" stroke-width="2">
      <line x1="486" y1="318" x2="486" y2="342"/>
      <line x1="500" y1="318" x2="500" y2="342"/>
      <line x1="524" y1="318" x2="524" y2="342"/>
      <line x1="538" y1="318" x2="538" y2="342"/>
    </g>
  </g>

  <!-- palm trees flanking -->
  <g stroke="#3b1010" stroke-width="6" stroke-linecap="round">
    <path d="M150 500 q10 -70 4 -130"/>
    <path d="M874 500 q-10 -65 -4 -120"/>
  </g>
  <g fill="#1f6b52">
    <path d="M154 370 q-42 -10 -58 12 q37 6 58 -12 Z"/>
    <path d="M154 370 q42 -10 58 10 q-37 8 -58 -10 Z"/>
    <path d="M154 370 q-10 -38 10 -55 q10 32 -10 55 Z"/>
    <path d="M870 380 q-40 -8 -55 12 q35 6 55 -12 Z"/>
    <path d="M870 380 q40 -8 55 10 q-35 8 -55 -10 Z"/>
  </g>
</svg>