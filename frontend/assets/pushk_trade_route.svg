<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a trade caravan crossing the mountain route near Pushkalavati toward Central Asia">
  <rect width="1024" height="640" fill="#191008"/>
  <circle cx="512" cy="160" r="240" fill="#c9852f" opacity="0.12"/>

  <!-- Mountain silhouettes (Khyber Pass) -->
  <path d="M0 380 L160 220 L320 380 Z" fill="#241a0e" stroke="#7a3a24" stroke-width="2"/>
  <path d="M260 380 L460 180 L660 380 Z" fill="#2e2010" stroke="#7a3a24" stroke-width="2"/>
  <path d="M600 380 L800 240 L1024 380 Z" fill="#241a0e" stroke="#7a3a24" stroke-width="2"/>

  <!-- Winding trade route -->
  <path d="M60 420 Q300 380 500 420 T980 400" fill="none" stroke="#e8ab5c" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- Caravan of camels (simplified) -->
  <g fill="#241a0e" stroke="#e8ab5c" stroke-width="2">
    <ellipse cx="300" cy="410" rx="28" ry="16"/><circle cx="284" cy="392" r="10"/>
    <ellipse cx="420" cy="418" rx="28" ry="16"/><circle cx="404" cy="400" r="10"/>
    <ellipse cx="540" cy="410" rx="28" ry="16"/><circle cx="524" cy="392" r="10"/>
    <ellipse cx="660" cy="416" rx="28" ry="16"/><circle cx="644" cy="398" r="10"/>
  </g>

  <text x="512" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e8ab5c" letter-spacing="2">GATEWAY TO THE SILK ROAD</text>
</svg>