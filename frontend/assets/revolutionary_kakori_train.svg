<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a steam train inspired by the Kakori Train Robbery">
  <defs>
    <linearGradient id="ktBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1611"/>
      <stop offset="100%" stop-color="#120d0a"/>
    </linearGradient>
    <linearGradient id="ktMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ktBg)"/>
  <circle cx="600" cy="140" r="90" fill="#b5451f" opacity="0.12"/>

  <!-- moon -->
  <circle cx="660" cy="110" r="36" fill="#f0cc7a" opacity="0.8"/>

  <!-- tracks -->
  <rect x="0" y="480" width="800" height="10" fill="#5c3a24"/>
  <g stroke="#3b2416" stroke-width="6">
    <line x1="40" y1="500" x2="10" y2="530"/>
    <line x1="120" y1="500" x2="90" y2="530"/>
    <line x1="200" y1="500" x2="170" y2="530"/>
    <line x1="280" y1="500" x2="250" y2="530"/>
    <line x1="360" y1="500" x2="330" y2="530"/>
    <line x1="440" y1="500" x2="410" y2="530"/>
    <line x1="520" y1="500" x2="490" y2="530"/>
    <line x1="600" y1="500" x2="570" y2="530"/>
    <line x1="680" y1="500" x2="650" y2="530"/>
    <line x1="760" y1="500" x2="730" y2="530"/>
  </g>

  <!-- train body -->
  <rect x="230" y="330" width="360" height="110" rx="10" fill="url(#ktMetal)" stroke="#5c3a24" stroke-width="3"/>
  <rect x="250" y="350" width="60" height="50" rx="4" fill="#1d1611"/>
  <rect x="330" y="350" width="60" height="50" rx="4" fill="#1d1611"/>
  <rect x="410" y="350" width="60" height="50" rx="4" fill="#1d1611"/>
  <rect x="490" y="350" width="60" height="50" rx="4" fill="#1d1611"/>

  <!-- locomotive front -->
  <g>
    <rect x="130" y="300" width="110" height="140" rx="8" fill="url(#ktMetal)" stroke="#5c3a24" stroke-width="3"/>
    <circle cx="185" cy="320" r="22" fill="#1d1611" stroke="#d9a441" stroke-width="3"/>
    <rect x="150" y="260" width="70" height="40" rx="6" fill="#5c3a24"/>
    <rect x="165" y="220" width="16" height="50" fill="#3b2416"/>
  </g>

  <!-- wheels -->
  <g fill="#1d1611" stroke="#d9a441" stroke-width="3">
    <circle cx="180" cy="440" r="24"/>
    <circle cx="280" cy="440" r="20"/>
    <circle cx="360" cy="440" r="20"/>
    <circle cx="440" cy="440" r="20"/>
    <circle cx="520" cy="440" r="20"/>
  </g>

  <!-- steam -->
  <g fill="#e8cba0" opacity="0.5">
    <ellipse cx="170" cy="200" rx="26" ry="16"/>
    <ellipse cx="200" cy="170" rx="22" ry="14"/>
    <ellipse cx="230" cy="145" rx="18" ry="12"/>
  </g>

  <text x="400" y="565" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">THE KAKORI TRAIN, 1925</text>
</svg>