<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the City Palace of Jaipur">
  <defs>
    <linearGradient id="cpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2317"/>
      <stop offset="100%" stop-color="#d9607a"/>
    </linearGradient>
    <linearGradient id="cpWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b3a8"/>
      <stop offset="100%" stop-color="#c47a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cpSky)"/>
  <rect y="440" width="800" height="160" fill="#170e0a"/>

  <!-- palace base -->
  <rect x="180" y="380" width="440" height="70" fill="#5c3a24"/>

  <!-- Chandra Mahal-style tiered structure -->
  <rect x="300" y="300" width="200" height="90" fill="url(#cpWall)" stroke="#5c3a24" stroke-width="2"/>
  <rect x="330" y="240" width="140" height="70" fill="url(#cpWall)" stroke="#5c3a24" stroke-width="2"/>
  <rect x="355" y="190" width="90" height="60" fill="url(#cpWall)" stroke="#5c3a24" stroke-width="2"/>
  <rect x="375" y="150" width="50" height="48" fill="url(#cpWall)" stroke="#5c3a24" stroke-width="2"/>

  <!-- domed chhatri top -->
  <circle cx="400" cy="140" r="16" fill="#d4a24c"/>
  <rect x="393" y="120" width="14" height="22" fill="#d4a24c"/>
  <circle cx="400" cy="118" r="5" fill="#f0c97a"/>

  <!-- small corner chhatris -->
  <g fill="#d4a24c">
    <circle cx="335" cy="240" r="9"/>
    <circle cx="465" cy="240" r="9"/>
    <circle cx="310" cy="300" r="9"/>
    <circle cx="490" cy="300" r="9"/>
  </g>

  <!-- arched windows -->
  <g fill="#170e0a" opacity="0.85">
    <rect x="320" y="330" width="20" height="34" rx="10"/>
    <rect x="360" y="330" width="20" height="34" rx="10"/>
    <rect x="420" y="330" width="20" height="34" rx="10"/>
    <rect x="460" y="330" width="20" height="34" rx="10"/>
  </g>

  <!-- side wings -->
  <rect x="180" y="360" width="100" height="90" fill="url(#cpWall)" opacity="0.85" stroke="#5c3a24" stroke-width="2"/>
  <rect x="520" y="360" width="100" height="90" fill="url(#cpWall)" opacity="0.85" stroke="#5c3a24" stroke-width="2"/>
  <g fill="#d4a24c">
    <circle cx="200" cy="360" r="7"/>
    <circle cx="260" cy="360" r="7"/>
    <circle cx="540" cy="360" r="7"/>
    <circle cx="600" cy="360" r="7"/>
  </g>

  <!-- courtyard flags -->
  <g stroke="#5c3a24" stroke-width="3">
    <line x1="400" y1="118" x2="400" y2="95"/>
  </g>
  <polygon points="400,95 428,102 400,109" fill="#d9607a"/>
</svg>