<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated stage scene inspired by the 1931 film Kalidas, the first Tamil talkie">
  <defs>
    <linearGradient id="kkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c0906"/>
      <stop offset="60%" stop-color="#4a1712"/>
      <stop offset="100%" stop-color="#8a1c22"/>
    </linearGradient>
    <radialGradient id="kkSpot" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f3cc78" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3cc78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#kkSky)"/>
  <ellipse cx="512" cy="260" rx="360" ry="260" fill="url(#kkSpot)"/>

  <!-- stage curtains -->
  <path d="M0 0 L180 0 L120 640 L0 640 Z" fill="#6c1319" opacity="0.9"/>
  <path d="M1024 0 L844 0 L904 640 L1024 640 Z" fill="#6c1319" opacity="0.9"/>
  <path d="M0 0 L120 0 L80 640 L0 640 Z" fill="#4a0e12" opacity="0.9"/>
  <path d="M1024 0 L904 0 L944 640 L1024 640 Z" fill="#4a0e12" opacity="0.9"/>

  <!-- stage floor -->
  <rect y="520" width="1024" height="120" fill="#150806"/>
  <rect y="520" width="1024" height="16" fill="#2a100b"/>

  <!-- temple-style arch backdrop -->
  <path d="M300 500 L300 300 Q512 150 724 300 L724 500 Z" fill="none" stroke="#e0a840" stroke-width="4" opacity="0.8"/>
  <path d="M340 500 L340 320 Q512 200 684 320 L684 500 Z" fill="#2a0f0a" opacity="0.6"/>

  <!-- veena / musician silhouette -->
  <g fill="#150806">
    <ellipse cx="420" cy="470" rx="30" ry="55"/>
    <circle cx="420" cy="400" r="20"/>
    <path d="M400 460 Q340 470 320 500" stroke="#150806" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- dancer silhouette -->
  <g fill="#150806">
    <ellipse cx="620" cy="460" rx="26" ry="60"/>
    <circle cx="620" cy="380" r="20"/>
    <path d="M600 420 Q560 390 540 350" stroke="#150806" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M640 420 Q680 390 700 350" stroke="#150806" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ornamental lamps -->
  <g fill="#f3cc78">
    <circle cx="360" cy="330" r="6"/>
    <circle cx="512" cy="270" r="7"/>
    <circle cx="664" cy="330" r="6"/>
  </g>

  <!-- title card -->
  <rect x="362" y="555" width="300" height="46" rx="4" fill="#120806" stroke="#e0a840" stroke-width="2"/>
  <text x="512" y="585" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f3cc78" text-anchor="middle" letter-spacing="3">KALIDAS &#183; 1931</text>
</svg>
