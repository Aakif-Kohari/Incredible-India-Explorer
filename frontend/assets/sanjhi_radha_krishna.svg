<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration inspired by Radha and Krishna, the central theme of Sanjhi art">
  <defs>
    <linearGradient id="srkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#201811"/>
      <stop offset="100%" stop-color="#150e08"/>
    </linearGradient>
    <linearGradient id="srkFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a5c"/>
      <stop offset="100%" stop-color="#8f6a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#srkBg)"/>

  <!-- lace-like paper-cut border -->
  <rect x="60" y="60" width="680" height="480" fill="none" stroke="url(#srkFrame)" stroke-width="6"/>
  <g fill="none" stroke="#d9a441" stroke-width="1.5" opacity="0.6">
    <circle cx="60" cy="60" r="10"/>
    <circle cx="740" cy="60" r="10"/>
    <circle cx="60" cy="540" r="10"/>
    <circle cx="740" cy="540" r="10"/>
  </g>

  <!-- ground -->
  <rect x="120" y="430" width="560" height="90" fill="#241811" opacity="0.7"/>

  <!-- Krishna figure (blue-hued, flute) -->
  <g>
    <path d="M340 300 q0 -30 22 -30 q22 0 22 30 v140 h-44 Z" fill="#146c60"/>
    <circle cx="362" cy="255" r="18" fill="#e8cba0"/>
    <path d="M340 300 q10 20 44 0" fill="none" stroke="#0f5449" stroke-width="2"/>
    <!-- peacock feather crown -->
    <path d="M362 236 q6 -20 -2 -34 q-4 16 2 34 Z" fill="#146c60"/>
    <circle cx="360" cy="205" r="4" fill="#f0cc7a"/>
    <!-- flute -->
    <line x1="335" y1="270" x2="390" y2="258" stroke="#8f6a24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Radha figure (red/gold-hued) -->
  <g>
    <path d="M420 300 q0 -30 22 -30 q22 0 22 30 v140 h-44 Z" fill="#c41e3a"/>
    <circle cx="442" cy="255" r="18" fill="#e8cba0"/>
    <path d="M425 240 q17 -16 34 0" fill="none" stroke="#8f6a24" stroke-width="3"/>
    <!-- veil drape -->
    <path d="M424 240 q18 40 -6 66" fill="none" stroke="#d9a441" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- ornamental arch above -->
  <path d="M300 210 Q400 140 500 210" fill="none" stroke="#d9a441" stroke-width="3"/>
  <g fill="#f0cc7a">
    <circle cx="320" cy="200" r="4"/>
    <circle cx="360" cy="168" r="4"/>
    <circle cx="400" cy="155" r="4"/>
    <circle cx="440" cy="168" r="4"/>
    <circle cx="480" cy="200" r="4"/>
  </g>

  <!-- lotus flowers flanking -->
  <g fill="none" stroke="#c41e3a" stroke-width="2" opacity="0.8">
    <path d="M220 460 q10 -20 20 0 q-10 12 -20 0 Z"/>
    <path d="M240 460 q10 -20 20 0 q-10 12 -20 0 Z"/>
    <path d="M560 460 q10 -20 20 0 q-10 12 -20 0 Z"/>
    <path d="M580 460 q10 -20 20 0 q-10 12 -20 0 Z"/>
  </g>

  <text x="400" y="560" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="3">RADHA · KRISHNA LEELA</text>
</svg>