<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the Antyodaya Express, a high-capacity fully unreserved superfast train, departing a platform at dusk">
  <defs>
    <linearGradient id="aySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#231a12"/>
      <stop offset="100%" stop-color="#c4691f"/>
    </linearGradient>
    <linearGradient id="ayCoach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5511f"/>
      <stop offset="100%" stop-color="#6e2f10"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#aySky)"/>
  <circle cx="1000" cy="120" r="70" fill="#f0a83f" opacity="0.85"/>

  <!-- Platform with crowd hint -->
  <rect x="0" y="400" width="1200" height="100" fill="#20242c"/>
  <rect x="0" y="392" width="1200" height="8" fill="#f0a83f"/>

  <!-- Train body: engine + high-capacity coaches -->
  <g>
    <rect x="60" y="270" width="180" height="120" rx="14" fill="#4a2410" stroke="#f0a83f" stroke-width="3"/>
    <rect x="90" y="290" width="50" height="40" rx="4" fill="#8ec2e8"/>
    <circle cx="100" cy="400" r="18" fill="#161a1f"/>
    <circle cx="200" cy="400" r="18" fill="#161a1f"/>

    <rect x="260" y="280" width="270" height="110" rx="8" fill="url(#ayCoach)" stroke="#f0a83f" stroke-width="2"/>
    <rect x="580" y="280" width="270" height="110" rx="8" fill="url(#ayCoach)" stroke="#f0a83f" stroke-width="2"/>
    <rect x="900" y="280" width="240" height="110" rx="8" fill="url(#ayCoach)" stroke="#f0a83f" stroke-width="2"/>

    <!-- Wider doors, hinting at high-capacity boarding -->
    <g fill="#20130a">
      <rect x="295" y="305" width="22" height="60" rx="3"/>
      <rect x="480" y="305" width="22" height="60" rx="3"/>
      <rect x="615" y="305" width="22" height="60" rx="3"/>
      <rect x="800" y="305" width="22" height="60" rx="3"/>
      <rect x="935" y="305" width="22" height="60" rx="3"/>
      <rect x="1110" y="305" width="22" height="60" rx="3"/>
    </g>

    <!-- Coach windows -->
    <g fill="#cfe6f7" opacity="0.85">
      <rect x="340" y="300" width="30" height="26" rx="3"/>
      <rect x="390" y="300" width="30" height="26" rx="3"/>
      <rect x="440" y="300" width="30" height="26" rx="3"/>
      <rect x="660" y="300" width="30" height="26" rx="3"/>
      <rect x="710" y="300" width="30" height="26" rx="3"/>
      <rect x="760" y="300" width="30" height="26" rx="3"/>
      <rect x="975" y="300" width="30" height="26" rx="3"/>
      <rect x="1025" y="300" width="30" height="26" rx="3"/>
      <rect x="1075" y="300" width="30" height="26" rx="3"/>
    </g>

    <!-- Wheels -->
    <g fill="#161a1f">
      <circle cx="300" cy="400" r="16"/><circle cx="480" cy="400" r="16"/>
      <circle cx="620" cy="400" r="16"/><circle cx="800" cy="400" r="16"/>
      <circle cx="940" cy="400" r="16"/><circle cx="1110" cy="400" r="16"/>
    </g>
  </g>

  <text x="600" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f0a83f" letter-spacing="2">ANTYODAYA EXPRESS</text>
  <text x="600" y="470" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" fill="#cbd5e1">Original illustration — Incredible India Explorer</text>
</svg>