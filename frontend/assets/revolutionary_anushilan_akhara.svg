<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of an Anushilan Samiti gymnasium in Bengal">
  <defs>
    <linearGradient id="aaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1611"/>
      <stop offset="100%" stop-color="#120d0a"/>
    </linearGradient>
    <linearGradient id="aaWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cba0"/>
      <stop offset="100%" stop-color="#b89060"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aaBg)"/>
  <circle cx="600" cy="130" r="80" fill="#d9a441" opacity="0.12"/>

  <!-- ground -->
  <rect y="470" width="800" height="130" fill="#120d0a"/>

  <!-- courtyard building -->
  <rect x="180" y="260" width="440" height="210" fill="url(#aaWall)" stroke="#5c3a24" stroke-width="3"/>
  <path d="M150 260 L650 260 L620 210 L180 210 Z" fill="#8f6a24" stroke="#3b2416" stroke-width="2"/>

  <!-- pillars -->
  <g fill="#5c3a24">
    <rect x="200" y="260" width="18" height="210"/>
    <rect x="290" y="260" width="18" height="210"/>
    <rect x="390" y="260" width="18" height="210"/>
    <rect x="490" y="260" width="18" height="210"/>
    <rect x="590" y="260" width="18" height="210"/>
  </g>

  <!-- open courtyard doorway -->
  <rect x="360" y="360" width="80" height="110" fill="#120d0a"/>

  <!-- wrestling ring / akhara mud circle in foreground -->
  <ellipse cx="400" cy="500" rx="140" ry="30" fill="#5c3a24" opacity="0.7"/>
  <ellipse cx="400" cy="500" rx="140" ry="30" fill="none" stroke="#d9a441" stroke-width="2" opacity="0.6"/>

  <!-- figures practising -->
  <g fill="#241811">
    <circle cx="350" cy="480" r="9"/>
    <rect x="343" y="489" width="14" height="20"/>
    <circle cx="450" cy="480" r="9"/>
    <rect x="443" y="489" width="14" height="20"/>
    <circle cx="400" cy="470" r="9"/>
    <rect x="393" y="479" width="14" height="20"/>
  </g>

  <!-- gada (mace) practice weights hanging near wall -->
  <g fill="#8f6a24" stroke="#3b2416" stroke-width="1.5">
    <circle cx="230" cy="420" r="12"/>
    <rect x="226" y="420" width="8" height="30"/>
    <circle cx="580" cy="420" r="12"/>
    <rect x="576" y="420" width="8" height="30"/>
  </g>

  <text x="400" y="560" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">AN ANUSHILAN AKHARA</text>
</svg>