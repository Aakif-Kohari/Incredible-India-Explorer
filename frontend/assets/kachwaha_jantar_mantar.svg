<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of the Jantar Mantar astronomical instruments in Jaipur">
  <defs>
    <linearGradient id="jmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#170e0a"/>
    </linearGradient>
    <linearGradient id="jmStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cfa8"/>
      <stop offset="100%" stop-color="#b8925c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#jmBg)"/>
  <circle cx="640" cy="120" r="70" fill="#f0c97a" opacity="0.15"/>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="130" fill="#241511"/>
  <ellipse cx="400" cy="472" rx="380" ry="20" fill="#3b2c18" opacity="0.7"/>

  <!-- Samrat Yantra (giant sundial triangle) -->
  <polygon points="180,470 420,470 200,180" fill="url(#jmStone)" stroke="#5c3a24" stroke-width="3"/>
  <path d="M200 180 L420 470" stroke="#5c3a24" stroke-width="2"/>
  <g stroke="#8f6a24" stroke-width="2" opacity="0.7">
    <line x1="220" y1="420" x2="380" y2="420"/>
    <line x1="230" y1="370" x2="360" y2="370"/>
    <line x1="240" y1="320" x2="340" y2="320"/>
    <line x1="250" y1="270" x2="320" y2="270"/>
  </g>

  <!-- quadrant arcs beside gnomon -->
  <path d="M420 470 A 130 130 0 0 1 420 210" fill="none" stroke="#d4a24c" stroke-width="4"/>
  <path d="M180 470 A 130 130 0 0 0 180 210" fill="none" stroke="#d4a24c" stroke-width="4"/>

  <!-- Jai Prakash Yantra (bowl-shaped instrument) -->
  <ellipse cx="580" cy="460" rx="90" ry="26" fill="url(#jmStone)" stroke="#5c3a24" stroke-width="3"/>
  <path d="M490 460 A 90 60 0 0 1 670 460" fill="none" stroke="#8f6a24" stroke-width="3"/>
  <g stroke="#5c3a24" stroke-width="1.5" opacity="0.6">
    <line x1="540" y1="440" x2="540" y2="475"/>
    <line x1="580" y1="435" x2="580" y2="480"/>
    <line x1="620" y1="440" x2="620" y2="475"/>
  </g>

  <!-- smaller instrument -->
  <rect x="100" y="430" width="50" height="40" rx="6" fill="url(#jmStone)" stroke="#5c3a24" stroke-width="2"/>
  <circle cx="125" cy="430" r="20" fill="none" stroke="#8f6a24" stroke-width="3"/>
</svg>