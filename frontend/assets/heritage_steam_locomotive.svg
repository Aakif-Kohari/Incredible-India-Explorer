<svg viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a vintage steam locomotive at a platform, inspired by the Fairy Queen">
  <rect width="1024" height="500" fill="#150e08"/>
  <circle cx="850" cy="110" r="60" fill="#f0a83f" opacity="0.8"/>

  <rect x="0" y="380" width="1024" height="120" fill="#20180f"/>
  <rect x="0" y="372" width="1024" height="8" fill="#f0a83f"/>

  <!-- Steam locomotive body -->
  <g>
    <rect x="300" y="250" width="360" height="90" rx="10" fill="#2e2010" stroke="#f0a83f" stroke-width="3"/>
    <circle cx="330" cy="260" r="46" fill="#2e2010" stroke="#f0a83f" stroke-width="3"/>
    <rect x="640" y="270" width="80" height="70" rx="8" fill="#3a2712" stroke="#f0a83f" stroke-width="2"/>

    <!-- Wheels -->
    <g fill="#0f0a05">
      <circle cx="360" cy="360" r="30" stroke="#f0a83f" stroke-width="3"/>
      <circle cx="460" cy="360" r="30" stroke="#f0a83f" stroke-width="3"/>
      <circle cx="560" cy="360" r="30" stroke="#f0a83f" stroke-width="3"/>
    </g>

    <!-- Smokestack + steam -->
    <rect x="380" y="200" width="24" height="50" fill="#2e2010" stroke="#f0a83f" stroke-width="2"/>
    <circle cx="392" cy="180" r="18" fill="#cbd5e1" opacity="0.4"/>
    <circle cx="410" cy="150" r="24" fill="#cbd5e1" opacity="0.3"/>
  </g>

  <text x="512" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f0a83f" letter-spacing="2">STEAM LOCOMOTIVE HERITAGE</text>
</svg>