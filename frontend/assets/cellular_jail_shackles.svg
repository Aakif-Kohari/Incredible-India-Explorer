<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of prisoners' iron shackles">
  <defs>
    <linearGradient id="csBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1816"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <linearGradient id="csMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a939e"/>
      <stop offset="100%" stop-color="#4a5058"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#csBg)"/>
  <circle cx="600" cy="150" r="90" fill="#5a6472" opacity="0.1"/>

  <!-- wooden surface -->
  <rect x="0" y="440" width="800" height="160" fill="#241c14" opacity="0.8"/>

  <!-- shackle rings -->
  <g fill="none" stroke="url(#csMetal)" stroke-width="16">
    <circle cx="300" cy="300" r="70"/>
    <circle cx="480" cy="300" r="70"/>
  </g>

  <!-- connecting chain -->
  <g fill="none" stroke="url(#csMetal)" stroke-width="10">
    <ellipse cx="370" cy="300" rx="18" ry="10"/>
    <ellipse cx="410" cy="300" rx="18" ry="10"/>
  </g>

  <!-- chain links trailing down -->
  <g fill="none" stroke="url(#csMetal)" stroke-width="9">
    <ellipse cx="300" cy="380" rx="14" ry="22"/>
    <ellipse cx="300" cy="420" rx="14" ry="22"/>
    <ellipse cx="480" cy="380" rx="14" ry="22"/>
    <ellipse cx="480" cy="420" rx="14" ry="22"/>
  </g>

  <!-- rivets -->
  <g fill="#c9d1d9">
    <circle cx="300" cy="230" r="4"/>
    <circle cx="480" cy="230" r="4"/>
    <circle cx="230" cy="300" r="4"/>
    <circle cx="550" cy="300" r="4"/>
  </g>

  <text x="400" y="565" font-family="Georgia, serif" font-size="18" fill="#f0cc7a" text-anchor="middle" letter-spacing="2">PRISONERS' IRON SHACKLES</text>
</svg>