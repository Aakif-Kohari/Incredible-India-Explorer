<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration symbolising the negotiated surrender that ended the mutiny on 23 February 1946">
  <rect width="1024" height="640" fill="#0a1018"/>
  <circle cx="512" cy="220" r="240" fill="#3a8fd6" opacity="0.14"/>

  <!-- Naval ensign being lowered -->
  <line x1="400" y1="150" x2="400" y2="480" stroke="#6fb4ec" stroke-width="6"/>
  <rect x="400" y="180" width="90" height="56" fill="#131c2b" stroke="#6fb4ec" stroke-width="2"/>
  <line x1="400" y1="240" x2="490" y2="180" stroke="#b23245" stroke-width="3"/>

  <!-- Two figures shaking hands (Strike Committee & negotiators) -->
  <g fill="#131c2b" stroke="#6fb4ec" stroke-width="2">
    <circle cx="580" cy="330" r="24"/><rect x="552" y="354" width="56" height="60"/>
    <circle cx="700" cy="330" r="24"/><rect x="672" y="354" width="56" height="60"/>
  </g>
  <g stroke="#6fb4ec" stroke-width="5">
    <line x1="608" y1="390" x2="672" y2="390"/>
  </g>
  <circle cx="640" cy="390" r="7" fill="#6fb4ec"/>

  <text x="512" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#6fb4ec" letter-spacing="2">SURRENDER · 23 FEBRUARY 1946</text>
</svg>