<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of a vintage Tamil cinema hall marquee in Chennai">
  <defs>
    <linearGradient id="kmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150807"/>
      <stop offset="55%" stop-color="#3a120e"/>
      <stop offset="100%" stop-color="#b3202c"/>
    </linearGradient>
    <linearGradient id="kmWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecd6ae"/>
      <stop offset="100%" stop-color="#c39a5f"/>
    </linearGradient>
    <radialGradient id="kmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3cc78"/>
      <stop offset="100%" stop-color="#e0a840" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="640" fill="url(#kmSky)"/>
  <circle cx="512" cy="210" r="230" fill="url(#kmGlow)" opacity="0.5"/>

  <!-- ground -->
  <rect y="500" width="1024" height="140" fill="#120806"/>
  <rect y="500" width="1024" height="18" fill="#20100b"/>

  <!-- cinema hall facade -->
  <rect x="250" y="255" width="524" height="245" fill="url(#kmWall)" stroke="#5c3420" stroke-width="3"/>

  <!-- marquee canopy -->
  <path d="M220 255 L804 255 L772 205 L252 205 Z" fill="#8a1c22" stroke="#3b1010" stroke-width="2"/>
  <g fill="#f3cc78">
    <circle cx="262" cy="230" r="4"/>
    <circle cx="304" cy="230" r="4"/>
    <circle cx="346" cy="230" r="4"/>
    <circle cx="388" cy="230" r="4"/>
    <circle cx="430" cy="230" r="4"/>
    <circle cx="472" cy="230" r="4"/>
    <circle cx="512" cy="230" r="4"/>
    <circle cx="552" cy="230" r="4"/>
    <circle cx="594" cy="230" r="4"/>
    <circle cx="636" cy="230" r="4"/>
    <circle cx="678" cy="230" r="4"/>
    <circle cx="720" cy="230" r="4"/>
    <circle cx="762" cy="230" r="4"/>
  </g>

  <!-- marquee sign board -->
  <rect x="352" y="210" width="320" height="42" rx="4" fill="#120806" stroke="#e0a840" stroke-width="2"/>
  <text x="512" y="238" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f3cc78" text-anchor="middle" letter-spacing="2">KOLLYWOOD TALKIES</text>

  <!-- entrance doors -->
  <rect x="440" y="380" width="60" height="120" fill="#3b1a10" stroke="#5c3420" stroke-width="2"/>
  <rect x="524" y="380" width="60" height="120" fill="#3b1a10" stroke="#5c3420" stroke-width="2"/>

  <!-- windows -->
  <rect x="290" y="300" width="60" height="70" fill="#7a3b1f" opacity="0.85"/>
  <rect x="674" y="300" width="60" height="70" fill="#7a3b1f" opacity="0.85"/>

  <!-- pillars -->
  <rect x="255" y="255" width="18" height="245" fill="#a06f3a"/>
  <rect x="751" y="255" width="18" height="245" fill="#a06f3a"/>

  <!-- poster boards -->
  <rect x="360" y="290" width="90" height="120" rx="3" fill="#6c1319" stroke="#e0a840" stroke-width="2"/>
  <rect x="574" y="290" width="90" height="120" rx="3" fill="#6c1319" stroke="#e0a840" stroke-width="2"/>
  <circle cx="405" cy="335" r="24" fill="#f3cc78" opacity="0.85"/>
  <circle cx="619" cy="335" r="24" fill="#f3cc78" opacity="0.85"/>

  <!-- string lights -->
  <path d="M250 255 Q512 190 774 255" fill="none" stroke="#e0a840" stroke-width="2" opacity="0.7"/>
  <g fill="#f3cc78">
    <circle cx="330" cy="234" r="3"/>
    <circle cx="420" cy="212" r="3"/>
    <circle cx="512" cy="204" r="3"/>
    <circle cx="604" cy="212" r="3"/>
    <circle cx="694" cy="234" r="3"/>
  </g>

  <!-- crowd silhouettes -->
  <g fill="#0d0605" opacity="0.75">
    <ellipse cx="330" cy="560" rx="16" ry="34"/>
    <circle cx="330" cy="516" r="11"/>
    <ellipse cx="380" cy="565" rx="17" ry="36"/>
    <circle cx="380" cy="520" r="12"/>
    <ellipse cx="650" cy="562" rx="16" ry="35"/>
    <circle cx="650" cy="518" r="11"/>
    <ellipse cx="700" cy="568" rx="18" ry="37"/>
    <circle cx="700" cy="522" r="12"/>
  </g>
</svg>
