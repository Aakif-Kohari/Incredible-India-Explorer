<svg viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised illustration of ancient coins, pottery and sculpture unearthed at Pushkalavati">
  <rect width="1024" height="640" fill="#191008"/>

  <!-- Display pedestal -->
  <rect x="120" y="440" width="784" height="20" fill="#7a3a24"/>

  <!-- Coins -->
  <g fill="none" stroke="#e8ab5c" stroke-width="4">
    <circle cx="260" cy="380" r="36"/>
    <circle cx="330" cy="400" r="26"/>
  </g>

  <!-- Pottery vessel -->
  <g fill="#2e2010" stroke="#c9852f" stroke-width="2">
    <path d="M460 320 Q440 380 460 440 L560 440 Q580 380 560 320 Z"/>
    <ellipse cx="510" cy="320" rx="50" ry="14"/>
  </g>

  <!-- Sculpture fragment (bust) -->
  <g fill="#241a0e" stroke="#e8ab5c" stroke-width="2">
    <circle cx="740" cy="350" r="40"/>
    <path d="M690 440 Q740 390 790 440 Z"/>
  </g>

  <text x="512" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e8ab5c" letter-spacing="2">ARTIFACTS OF PUSHKALAVATI</text>
</svg>