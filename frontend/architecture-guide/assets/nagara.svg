<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" class="arch-svg">
  <rect width="600" height="500" fill="transparent" />
  
  <!-- Jagati (Platform) -->
  <path d="M 100 420 L 500 420 L 520 450 L 80 450 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <rect x="120" y="380" width="360" height="40" fill="#E6C280" stroke="#333" stroke-width="2"/>

  <!-- Mandapa (Assembly Hall) -->
  <path d="M 140 380 L 140 300 L 220 300 L 220 380 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <!-- Mandapa Roof (Stepped/Pyramidal) -->
  <path d="M 130 300 L 230 300 L 180 220 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>

  <!-- Shikhara (Curvilinear Tower) -->
  <path d="M 280 380 L 280 300 C 280 200, 310 150, 340 100 C 370 150, 400 200, 400 300 L 400 380 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  
  <!-- Vertical lines on Shikhara (Latina style) -->
  <path d="M 310 380 C 310 200, 325 150, 340 100 M 370 380 C 370 200, 355 150, 340 100" stroke="#333" stroke-width="1.5" fill="transparent"/>

  <!-- Amalaka (Stone Disk) -->
  <ellipse cx="340" cy="90" rx="30" ry="10" fill="#CD7F32" stroke="#333" stroke-width="2"/>
  <ellipse cx="340" cy="85" rx="20" ry="5" fill="#CD7F32" stroke="#333" stroke-width="2"/>

  <!-- Kalasha (Finial Pot) -->
  <path d="M 335 80 L 345 80 L 348 70 L 332 70 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>
  <circle cx="340" cy="65" r="5" fill="#E6C280" stroke="#333" stroke-width="1"/>
  <path d="M 340 60 L 340 40" stroke="#333" stroke-width="2"/>

  <!-- Hotspots -->
  
  <!-- Jagati -->
  <g id="jagati" class="hotspot">
    <circle cx="150" cy="435" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="150" cy="435" r="15" class="hotspot-dot" />
  </g>
  <line x1="150" y1="435" x2="80" y2="470" class="annotation-line" />
  <text x="20" y="480" font-family="sans-serif" font-size="14" fill="#E6D5B8">Jagati</text>

  <!-- Mandapa -->
  <g id="mandapa" class="hotspot">
    <circle cx="180" cy="270" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="180" cy="270" r="15" class="hotspot-dot" />
  </g>
  <line x1="180" y1="270" x2="100" y2="240" class="annotation-line" />
  <text x="30" y="240" font-family="sans-serif" font-size="14" fill="#E6D5B8">Mandapa</text>

  <!-- Shikhara -->
  <g id="shikhara" class="hotspot">
    <circle cx="340" cy="250" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="340" cy="250" r="15" class="hotspot-dot" />
  </g>
  <line x1="340" y1="250" x2="450" y2="250" class="annotation-line" />
  <text x="460" y="255" font-family="sans-serif" font-size="14" fill="#E6D5B8">Shikhara</text>

  <!-- Amalaka -->
  <g id="amalaka" class="hotspot">
    <circle cx="340" cy="90" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="340" cy="90" r="12" class="hotspot-dot" />
  </g>
  <line x1="340" y1="90" x2="430" y2="90" class="annotation-line" />
  <text x="440" y="95" font-family="sans-serif" font-size="14" fill="#E6D5B8">Amalaka</text>

  <!-- Kalasha -->
  <g id="kalasha" class="hotspot">
    <circle cx="340" cy="50" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="340" cy="50" r="10" class="hotspot-dot" />
  </g>
  <line x1="340" y1="50" x2="420" y2="40" class="annotation-line" />
  <text x="430" y="45" font-family="sans-serif" font-size="14" fill="#E6D5B8">Kalasha</text>

</svg>
