<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" class="arch-svg">
  <rect width="600" height="500" fill="transparent" />
  
  <!-- Star-shaped Platform (Stellate Jagati) -->
  <!-- Simplified representation using multiple overlapping polygons -->
  <polygon points="100,430 500,430 520,460 80,460" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <polygon points="120,430 480,430 460,400 140,400" fill="#E6C280" stroke="#333" stroke-width="2"/>
  <!-- Zigzag line to represent star shape -->
  <polyline points="140,430 160,415 180,430 200,415 220,430 240,415 260,430 280,415 300,430 320,415 340,430 360,415 380,430 400,415 420,430 440,415 460,430" fill="transparent" stroke="#333" stroke-width="1.5"/>

  <!-- Pillared Hall (Navaranga) -->
  <rect x="160" y="280" width="140" height="120" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <!-- Carved pillars -->
  <rect x="180" y="280" width="10" height="120" fill="#CD7F32"/>
  <rect x="220" y="280" width="10" height="120" fill="#CD7F32"/>
  <rect x="260" y="280" width="10" height="120" fill="#CD7F32"/>
  <!-- Hall Roof -->
  <path d="M 150 280 L 310 280 L 280 230 L 180 230 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>
  
  <!-- Decorative Carvings (Horizontal Friezes) -->
  <line x1="160" y1="380" x2="300" y2="380" stroke="#333" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="160" y1="360" x2="300" y2="360" stroke="#333" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Hybrid Tower (Vimana/Shikhara blend) -->
  <!-- Base of tower -->
  <rect x="320" y="300" width="120" height="100" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <!-- Stepped but slightly curved profile -->
  <path d="M 310 300 L 450 300 L 430 240 L 330 240 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>
  <path d="M 330 240 L 430 240 L 415 180 L 345 180 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <path d="M 345 180 L 415 180 L 405 130 L 355 130 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>
  <path d="M 355 130 L 405 130 L 395 90 L 365 90 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <!-- Top dome/amalaka -->
  <path d="M 360 90 Q 380 60 400 90 Z" fill="#CD7F32" stroke="#333" stroke-width="2"/>
  <!-- Finial -->
  <line x1="380" y1="70" x2="380" y2="40" stroke="#333" stroke-width="2"/>

  <!-- Hotspots -->
  
  <!-- Star Platform -->
  <g id="star-platform" class="hotspot">
    <circle cx="440" cy="415" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="440" cy="415" r="15" class="hotspot-dot" />
  </g>
  <line x1="440" y1="415" x2="510" y2="380" class="annotation-line" />
  <text x="520" y="380" font-family="sans-serif" font-size="14" fill="#E6D5B8">Star Platform</text>

  <!-- Decorative Carvings -->
  <g id="carvings" class="hotspot">
    <circle cx="170" cy="370" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="170" cy="370" r="12" class="hotspot-dot" />
  </g>
  <line x1="170" y1="370" x2="80" y2="350" class="annotation-line" />
  <text x="20" y="350" font-family="sans-serif" font-size="14" fill="#E6D5B8">Carvings</text>

  <!-- Pillared Hall -->
  <g id="pillared-hall" class="hotspot">
    <circle cx="240" cy="320" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="240" cy="320" r="15" class="hotspot-dot" />
  </g>
  <line x1="240" y1="320" x2="130" y2="280" class="annotation-line" />
  <text x="50" y="275" font-family="sans-serif" font-size="14" fill="#E6D5B8">Pillared Hall</text>

  <!-- Hybrid Tower -->
  <g id="hybrid-tower" class="hotspot">
    <circle cx="380" cy="190" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="380" cy="190" r="15" class="hotspot-dot" />
  </g>
  <line x1="380" y1="190" x2="470" y2="170" class="annotation-line" />
  <text x="480" y="165" font-family="sans-serif" font-size="14" fill="#E6D5B8">Hybrid Tower</text>

</svg>
