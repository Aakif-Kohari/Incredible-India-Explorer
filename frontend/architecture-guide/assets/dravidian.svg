<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" class="arch-svg">
  <!-- Sky / Background -->
  <rect width="600" height="500" fill="transparent" />
  
  <!-- Base / Prakara -->
  <path d="M 50 450 L 550 450 L 550 480 L 50 480 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <text x="70" y="470" font-family="sans-serif" font-size="14" fill="#333">Prakara (Outer Wall)</text>

  <!-- Temple Tank (Kalyani) -->
  <path d="M 400 450 L 500 450 L 480 480 L 420 480 Z" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <path d="M 400 450 L 420 480 M 500 450 L 480 480" stroke="#333" stroke-width="1"/>

  <!-- Mandapa -->
  <rect x="250" y="320" width="130" height="130" fill="#E6C280" stroke="#333" stroke-width="2" />
  <rect x="260" y="320" width="10" height="130" fill="#D2A679" />
  <rect x="290" y="320" width="10" height="130" fill="#D2A679" />
  <rect x="320" y="320" width="10" height="130" fill="#D2A679" />
  <rect x="350" y="320" width="10" height="130" fill="#D2A679" />
  
  <!-- Vimana (Pyramidal Tower) -->
  <path d="M 270 320 L 350 320 L 340 260 L 280 260 Z" fill="#D2A679" stroke="#333" stroke-width="2" />
  <path d="M 280 260 L 340 260 L 330 200 L 290 200 Z" fill="#E6C280" stroke="#333" stroke-width="2" />
  <path d="M 290 200 L 330 200 L 315 150 L 305 150 Z" fill="#D2A679" stroke="#333" stroke-width="2" />
  <!-- Stupi (Cap) -->
  <path d="M 300 150 Q 310 130 320 150 Z" fill="#CD7F32" stroke="#333" stroke-width="2" />

  <!-- Gopuram (Gateway Tower) -->
  <rect x="100" y="350" width="80" height="100" fill="#D2A679" stroke="#333" stroke-width="2" />
  <path d="M 125 350 L 125 450 M 155 350 L 155 450" stroke="#333" stroke-width="1" />
  <!-- Gopuram Pyramidal Tiers -->
  <path d="M 90 350 L 190 350 L 170 270 L 110 270 Z" fill="#E6C280" stroke="#333" stroke-width="2" />
  <path d="M 110 270 L 170 270 L 155 190 L 125 190 Z" fill="#D2A679" stroke="#333" stroke-width="2" />
  <path d="M 125 190 L 155 190 L 145 120 L 135 120 Z" fill="#E6C280" stroke="#333" stroke-width="2" />
  <!-- Gopuram Kalasams (Finials) -->
  <circle cx="130" cy="110" r="5" fill="#CD7F32" />
  <circle cx="140" cy="105" r="6" fill="#CD7F32" />
  <circle cx="150" cy="110" r="5" fill="#CD7F32" />

  <!-- Hotspots -->
  <!-- Gopuram -->
  <circle id="gopuram" class="hotspot" cx="140" cy="220" r="15" />
  <line x1="140" y1="220" x2="60" y2="200" class="annotation-line" />
  <text x="10" y="200" font-family="sans-serif" font-size="14" fill="#E6D5B8">Gopuram</text>

  <!-- Vimana -->
  <circle id="vimana" class="hotspot" cx="310" cy="230" r="15" />
  <line x1="310" y1="230" x2="400" y2="200" class="annotation-line" />
  <text x="410" y="200" font-family="sans-serif" font-size="14" fill="#E6D5B8">Vimana</text>

  <!-- Mandapa -->
  <circle id="mandapa" class="hotspot" cx="310" cy="380" r="15" />
  <line x1="310" y1="380" x2="420" y2="350" class="annotation-line" />
  <text x="430" y="350" font-family="sans-serif" font-size="14" fill="#E6D5B8">Mandapa</text>

  <!-- Prakara -->
  <circle id="prakara" class="hotspot" cx="180" cy="465" r="12" />

  <!-- Temple Tank -->
  <circle id="temple-tank" class="hotspot" cx="450" cy="465" r="12" />

</svg>
