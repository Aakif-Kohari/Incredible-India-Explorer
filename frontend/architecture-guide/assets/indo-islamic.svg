<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" class="arch-svg">
  <rect width="600" height="500" fill="transparent" />
  
  <!-- Base -->
  <rect x="50" y="420" width="500" height="30" fill="#E6C280" stroke="#333" stroke-width="2"/>

  <!-- Main Structure -->
  <rect x="150" y="250" width="300" height="170" fill="#ivory" stroke="#333" stroke-width="2" />
  
  <!-- Arch (Iwan) -->
  <!-- Outer Arch -->
  <path d="M 230 420 L 230 310 C 230 260, 370 260, 370 310 L 370 420 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <!-- Inner Arch (Pointed) -->
  <path d="M 250 420 L 250 330 Q 300 270 350 330 L 350 420 Z" fill="#333" stroke="#333" stroke-width="2"/>

  <!-- Secondary Arches / Niches -->
  <path d="M 170 380 L 170 330 Q 190 300 210 330 L 210 380 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>
  <path d="M 390 380 L 390 330 Q 410 300 430 330 L 430 380 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>

  <!-- Dome -->
  <!-- Drum -->
  <rect x="220" y="210" width="160" height="40" fill="#E6C280" stroke="#333" stroke-width="2"/>
  <!-- Bulbous Dome -->
  <path d="M 210 210 C 210 50, 390 50, 390 210 Z" fill="#FFFFF0" stroke="#333" stroke-width="2"/>
  <!-- Finial -->
  <path d="M 298 90 L 302 90 L 302 50 L 298 50 Z" fill="#CD7F32" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="45" r="4" fill="#CD7F32"/>

  <!-- Chhatris -->
  <rect x="170" y="220" width="30" height="30" fill="#D2A679" stroke="#333" stroke-width="1"/>
  <path d="M 165 220 Q 185 190 205 220 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>
  
  <rect x="400" y="220" width="30" height="30" fill="#D2A679" stroke="#333" stroke-width="1"/>
  <path d="M 395 220 Q 415 190 435 220 Z" fill="#E6C280" stroke="#333" stroke-width="2"/>

  <!-- Minarets -->
  <!-- Left Minaret -->
  <rect x="80" y="150" width="30" height="270" fill="#FFFFF0" stroke="#333" stroke-width="2"/>
  <path d="M 70 300 L 120 300 L 120 290 L 70 290 Z" fill="#E6C280" stroke="#333" stroke-width="1"/>
  <path d="M 70 220 L 120 220 L 120 210 L 70 210 Z" fill="#E6C280" stroke="#333" stroke-width="1"/>
  <path d="M 75 150 Q 95 120 115 150 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>

  <!-- Right Minaret -->
  <rect x="490" y="150" width="30" height="270" fill="#FFFFF0" stroke="#333" stroke-width="2"/>
  <path d="M 480 300 L 530 300 L 530 290 L 480 290 Z" fill="#E6C280" stroke="#333" stroke-width="1"/>
  <path d="M 480 220 L 530 220 L 530 210 L 480 210 Z" fill="#E6C280" stroke="#333" stroke-width="1"/>
  <path d="M 485 150 Q 505 120 525 150 Z" fill="#D2A679" stroke="#333" stroke-width="2"/>

  <!-- Jali (Latticework) -->
  <rect x="180" y="345" width="20" height="30" fill="transparent" stroke="#333" stroke-width="1" stroke-dasharray="2"/>
  <rect x="400" y="345" width="20" height="30" fill="transparent" stroke="#333" stroke-width="1" stroke-dasharray="2"/>

  <!-- Hotspots -->
  
  <!-- Dome -->
  <g id="dome" class="hotspot">
    <circle cx="300" cy="150" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="300" cy="150" r="15" class="hotspot-dot" />
  </g>
  <circle id="dome" class="hotspot" cx="300" cy="150" r="15" />
  <line x1="300" y1="150" x2="380" y2="120" class="annotation-line" />
  <text x="390" y="115" font-family="sans-serif" font-size="14" fill="#E6D5B8">Dome</text>

  <!-- Arch -->
  <g id="arch" class="hotspot">
    <circle cx="300" cy="285" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="300" cy="285" r="15" class="hotspot-dot" />
  </g>
  <circle id="arch" class="hotspot" cx="300" cy="285" r="15" />
  <line x1="300" y1="285" x2="400" y2="280" class="annotation-line" />
  <text x="410" y="285" font-family="sans-serif" font-size="14" fill="#E6D5B8">Arch (Iwan)</text>

  <!-- Minaret -->
  <g id="minaret" class="hotspot">
    <circle cx="95" cy="190" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="95" cy="190" r="15" class="hotspot-dot" />
  </g>
  <circle id="minaret" class="hotspot" cx="95" cy="190" r="15" />
  <line x1="95" y1="190" x2="40" y2="160" class="annotation-line" />
  <text x="10" y="150" font-family="sans-serif" font-size="14" fill="#E6D5B8">Minaret</text>

  <!-- Jali -->
  <g id="jali" class="hotspot">
    <circle cx="190" cy="360" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="190" cy="360" r="12" class="hotspot-dot" />
  </g>
  <circle id="jali" class="hotspot" cx="190" cy="360" r="12" />
  <line x1="190" y1="360" x2="120" y2="380" class="annotation-line" />
  <text x="90" y="390" font-family="sans-serif" font-size="14" fill="#E6D5B8">Jali</text>

  <!-- Chhatri -->
  <g id="chhatri" class="hotspot">
    <circle cx="415" cy="205" r="45" class="hotspot-hit" fill="transparent" />
    <circle cx="415" cy="205" r="12" class="hotspot-dot" />
  </g>
  <circle id="chhatri" class="hotspot" cx="415" cy="205" r="12" />
  <line x1="415" y1="205" x2="470" y2="190" class="annotation-line" />
  <text x="480" y="185" font-family="sans-serif" font-size="14" fill="#E6D5B8">Chhatri</text>

</svg>
