<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Thali Guide | Incredible India Explorer</title>
    <!-- Use relative paths to access global styles if available, or just self-contained styles as requested -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <!-- Header -->
    <header class="module-header">
        <a href="../../index.html" class="back-link" aria-label="Back to home">
            &larr; Back to Home
        </a>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">🌙</button>
    </header>

    <main class="thali-container">
        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">Regional Thali Guide</h1>
            <p class="hero-subtitle">
                Explore the traditional meal combinations of different Indian states. Hover or click on the dishes to reveal their names and ingredients.
            </p>
            
            <!-- Region Selector -->
            <div class="region-selector" role="group" aria-label="Select a regional thali">
                <button class="region-btn active" data-region="gujarati" aria-pressed="true">Gujarati</button>
                <button class="region-btn" data-region="bengali" aria-pressed="false">Bengali</button>
                <button class="region-btn" data-region="rajasthani" aria-pressed="false">Rajasthani</button>
                <button class="region-btn" data-region="south-indian" aria-pressed="false">South Indian</button>
            </div>
        </section>

        <!-- Two Column Layout -->
        <section class="thali-layout">
            
            <!-- SVG Thali Container -->
            <div class="svg-container" id="svg-container" aria-live="polite">
                <!-- SVG injected via JavaScript -->
            </div>

            <!-- Dish Information Panel -->
            <div class="info-panel">
                <div class="info-card" id="info-card" aria-live="polite">
                    <div class="empty-state" id="empty-state">
                        <span class="empty-icon">🍽️</span>
                        <p>Hover over or click a dish to view its details.</p>
                    </div>
                    <div class="dish-details hidden" id="dish-details">
                        <h2 class="dish-name" id="dish-name">Dish Name</h2>
                        <p class="dish-description" id="dish-description">Description goes here.</p>
                        
                        <div class="ingredients-section">
                            <h3 class="ingredients-title">Key Ingredients</h3>
                            <ul class="ingredients-list" id="ingredients-list">
                                <!-- Injected via JS -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
