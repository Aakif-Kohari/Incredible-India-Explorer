<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>National Highway Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+e2Y5kG2Q4m8G8jzE2nM6Q0bqjv1m1p4o7ZB6+5H0=" crossorigin="" />
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>National Highway Navigator</h1>
      <p>Plan routes using a sample of India's National Highway network.</p>
    </header>

    <main>
      <aside class="controls">
        <div class="form-row">
          <label for="start">Start</label>
          <select id="start" aria-label="Start location"></select>
        </div>
        <div class="form-row">
          <label for="end">End</label>
          <select id="end" aria-label="End location"></select>
        </div>
        <div class="form-row actions">
          <button id="plan">Plan Route</button>
          <button id="clear">Clear</button>
        </div>
        <div id="info" class="info" aria-live="polite"></div>
      </aside>

      <section id="map" class="map" role="application" aria-label="Map showing highways"></section>
    </main>

    <footer>
      <small>Data: sample network for demo. Map tiles © OpenStreetMap contributors.</small>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7k9t+g1y3lM8dZV4wNqQ5jv1m1p4o7ZB6+5H0=" crossorigin=""></script>
  <script src="./script.js"></script>
</body>
</html>
