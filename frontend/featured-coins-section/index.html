<!doctype html>
<html lang="en">
    <head>
        <script>
            (function () {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'light') {
                    document.body.classList.add('light-theme');
                }
            })();
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Featured Coins Section — Showcase of historically significant and visually distinctive Indian coins with horizontal carousel slider and explore links."
        />
        <title>Featured Coins Showcase | Incredible India</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../../styles.css" />
        <link rel="stylesheet" href="featured.css" />
    </head>
    <body class="featured-main">
        <header class="navbar scrolled" id="navbar">
            <div class="nav-container">
                <a href="../../index.html#home" class="nav-logo" id="nav-logo">
                    <span class="saffron">Incredible</span>
                    <span class="gold">India</span>
                    <span class="green">Explorer</span>
                </a>
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu" aria-expanded="false">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <nav class="nav-menu" id="nav-menu">
                    <a href="../../index.html#home" class="nav-link">Home</a>
                    <a href="../coin/coin.html" class="nav-link">Currency History</a>
                    <a href="index.html" class="nav-link active" style="color: var(--saffron)">Featured Coins</a>
                    <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle Dark/Light Mode" title="Toggle Light Mode">
                        ☀️
                    </button>
                </nav>
            </div>
        </header>

        <main>
            <section class="featured-hero">
                <div class="section-container">
                    <span class="hero-pill">✨ Numismatic Highlights</span>
                    <h1>Featured Coins Showcase</h1>
                    <p class="hero-subtitle">
                        Explore historically significant and visually distinctive monetary treasures from ancient, medieval, and imperial Indian coin traditions.
                    </p>
                </div>
            </section>

            <section class="featured-carousel-section">
                <div class="section-container">
                    <div class="carousel-controls">
                        <button id="btn-prev" class="carousel-nav-btn" aria-label="Previous Coin">❮ Previous</button>
                        <button id="btn-next" class="carousel-nav-btn" aria-label="Next Coin">Next ❯</button>
                    </div>
                    <div class="carousel-track" id="carousel-track"></div>
                </div>
            </section>
        </main>

        <script src="featured-data.js"></script>
        <script src="featured.js"></script>
    </body>
</html>
