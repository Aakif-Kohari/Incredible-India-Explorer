<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famous Battles Timeline - Incredible India Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-content">
      <h1>Famous Battles Timeline</h1>
      <p class="subtitle">Explore the battles that shaped Indian history through an interactive map and chronological timeline.</p>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="container">
    
    <div class="battle-explorer">
      <!-- Interactive Map Section -->
      <section class="map-section" aria-label="Interactive Map of India">
        <div class="map-container" id="map-container">
          <!-- The SVG map and markers will be dynamically injected or handled here -->
          <svg id="india-map" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
            <!-- Simplified abstract outline of India for placeholder purposes -->
            <path class="landmass" d="M30,15 C40,5 50,5 60,15 C70,25 90,30 95,45 C95,55 85,60 70,60 C70,75 50,95 45,95 C40,95 25,65 15,50 C10,40 10,30 20,25 Z" />
          </svg>
          <div id="markers-layer" class="markers-layer"></div>
        </div>
      </section>

      <!-- Chronological Timeline Section -->
      <section class="timeline-section" aria-label="Battle Timeline">
        <div class="timeline" id="timeline">
          <!-- Timeline entries will be dynamically injected here -->
        </div>
      </section>
    </div>

  </main>

  <!-- Accessible Modal / Dialog -->
  <div id="battle-dialog-backdrop" class="dialog-backdrop hidden" aria-hidden="true">
    <div id="battle-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title">Battle Name</h2>
        <button id="dialog-close" class="close-btn" aria-label="Close battle details">&times;</button>
      </div>
      
      <div class="dialog-content">
        <div class="dialog-image-container">
          <img id="dialog-image" src="" alt="" loading="lazy">
        </div>
        <div class="dialog-info">
          <p class="dialog-meta"><strong id="dialog-year"></strong> | <span id="dialog-location"></span></p>
          
          <div class="info-group">
            <h3>Opponents</h3>
            <p id="dialog-opponents"></p>
          </div>
          
          <div class="info-group">
            <h3>Outcome</h3>
            <p id="dialog-outcome"></p>
          </div>
          
          <div class="info-group">
            <h3>Historical Significance</h3>
            <p id="dialog-significance"></p>
          </div>

          <details class="dialog-more-details">
            <summary>More Details</summary>
            <div class="details-content">
              <h4>Background</h4><p id="dialog-background"></p>
              <h4>Commanders</h4><p id="dialog-commanders"></p>
              <h4>Strategy</h4><p id="dialog-strategy"></p>
              <h4>Political Impact</h4><p id="dialog-political"></p>
              <h4>Long-term Consequences</h4><p id="dialog-longterm"></p>
            </div>
          </details>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
