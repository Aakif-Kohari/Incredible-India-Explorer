<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Festival Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero-section">
    <div class="container">
      <h1>Interactive Festival Calendar</h1>
      <p>Discover upcoming Indian festivals, their cultural significance, and regional celebrations throughout the year.</p>
    </div>
  </header>

  <main class="container">
    <section class="calendar-wrapper">
      <div class="calendar-header">
        <button id="prev-month" class="nav-btn" aria-label="Previous month">◀</button>
        <h2 id="calendar-month-year" class="month-year">August 2026</h2>
        <button id="next-month" class="nav-btn" aria-label="Next month">▶</button>
        <button id="current-month" class="nav-btn" aria-label="Current month">Today</button>
      </div>

      <div class="calendar-grid" id="calendar-grid">
        <div class="calendar-cell empty"></div>
        <div class="calendar-cell empty"></div>
        <div class="calendar-cell empty"></div>
        <div class="calendar-cell empty"></div>
        <div class="calendar-cell empty"></div>
        <div class="calendar-cell empty"></div>
        <div class="calendar-cell empty"></div>
      </div>
    </section>

    <section class="info-panel" id="festival-info-panel">
      <h3>Select a festival date</h3>
      <p>Click on any highlighted day to see festival details.</p>
    </section>
  </main>

  <section class="upcoming-section">
    <div class="container">
      <h3 id="upcoming-heading">Coming This Month</h3>
      <div class="upcoming-grid" id="upcoming-festivals">
      </div>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
