<!-- An abstract representation of the India map for plotting markers. -->
<!-- Coordinates are arbitrary but roughly match India's shape for absolute positioning -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%;" id="india-abstract-map">
    <defs>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
        </filter>
    </defs>
    
    <!-- Abstract India Polygon -->
    <!-- Not geographically accurate, but serves as a recognizable backdrop -->
    <!-- Top (Kashmir), Right (North East), Bottom (Kanyakumari), Left (Gujarat) -->
    <path 
        d="M 35 10 
           L 45 5 
           L 50 15 
           L 60 25 
           L 75 35 
           L 95 40 
           L 85 50 
           L 75 55 
           L 70 45
           L 60 55 
           L 55 70 
           L 50 95 
           L 45 95 
           L 40 70 
           L 30 65 
           L 25 55 
           L 15 50 
           L 10 45 
           L 20 40 
           L 25 30 
           L 35 25 
           Z" 
        fill="#fcf4e3" 
        stroke="#e0cda7" 
        stroke-width="0.5" 
        filter="url(#shadow)"
    />
    
    <!-- Optional inner lines for visual texture -->
    <path d="M 25 30 Q 40 40 50 20" stroke="#e0cda7" stroke-width="0.2" fill="none" />
    <path d="M 70 45 Q 60 60 50 95" stroke="#e0cda7" stroke-width="0.2" fill="none" />
    <path d="M 25 55 Q 40 60 60 55" stroke="#e0cda7" stroke-width="0.2" fill="none" />
</svg>
